---
deployment:
  tasks:
    - "/bin/bash -lc 'set -u; MARKER=$(tr -d \"\\r\\n\" < public/ratib-build.txt 2>/dev/null || echo unknown); STAMP=\"deploy-$(date -u +%Y%m%dT%H%M%SZ)-${MARKER}\"; LOG=/home/outratib/.ratib-deploy-log; printf \"%s start marker=%s\\n\" \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\" \"$MARKER\" >> \"$LOG\"; TARGETS=(); add_target() { local t=\"$1\"; [ -n \"$t\" ] && [ -d \"$t\" ] && TARGETS+=(\"$t\"); }; for UD in /var/cpanel/userdata/outratib/out.ratib.sa /var/cpanel/userdata/outratib/out.ratib.sa_SSL; do if [ -f \"$UD\" ]; then DR=$(grep -E \"^documentroot:\" \"$UD\" 2>/dev/null | head -1 | sed \"s/^documentroot:[[:space:]]*//\" | tr -d \"\\r\"); add_target \"$DR\"; fi; done; add_target /home/outratib/public_html; add_target /home/outratib/out.ratib.sa; add_target /home/outratib/out.ratib.sa/public_html; add_target /home/outratib/domains/out.ratib.sa/public_html; add_target /home/outratib/public_html/out.ratib.sa; add_target /home/outratib/subdomains/out.ratib.sa/public_html; DEDUPED=(); for t in \"${TARGETS[@]}\"; do dup=0; for d in \"${DEDUPED[@]}\"; do [ \"$t\" = \"$d\" ] && dup=1; done; [ \"$dup\" -eq 0 ] && DEDUPED+=(\"$t\"); done; if [ \"${#DEDUPED[@]}\" -eq 0 ]; then echo \"no deploy targets found\" >> \"$LOG\"; exit 1; fi; for TARGET in \"${DEDUPED[@]}\"; do if command -v rsync >/dev/null 2>&1; then rsync -a --delete --exclude=.git/ ./ \"$TARGET/\"; else (tar --exclude=.git -cf - .) | (cd \"$TARGET\" && tar -xf -); fi; printf \"%s\\n\" \"$STAMP\" > \"$TARGET/.ratib-deploy-stamp\"; ABOUT=no; [ -f \"$TARGET/pages/about.php\" ] && ABOUT=yes; printf \"%s target=%s about=%s marker=%s\\n\" \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\" \"$TARGET\" \"$ABOUT\" \"$MARKER\" >> \"$LOG\"; find \"$TARGET\" -type d -exec chmod 755 {} \\; ; find \"$TARGET\" -name .htaccess -type f -exec chmod 644 {} \\; ; [ -f \"$TARGET/.htaccess\" ] && chmod 644 \"$TARGET/.htaccess\" || true; done'"

