---
deployment:
  tasks:
    - "/bin/bash -lc 'MARKER=$(tr -d \"\\r\\n\" < public/ratib-build.txt 2>/dev/null || echo unknown); STAMP=\"deploy-$(date -u +%Y%m%dT%H%M%SZ)-${MARKER}\"; LOG=/home/outratib/.ratib-deploy-log; TARGETS=(/home/outratib/public_html /home/outratib/out.ratib.sa /home/outratib/domains/out.ratib.sa/public_html /home/outratib/public_html/out.ratib.sa /home/outratib/out.ratib.sa/public_html); for TARGET in \"${TARGETS[@]}\"; do [ -d \"$TARGET\" ] || continue; if command -v rsync >/dev/null 2>&1; then rsync -a --delete --exclude=.git/ ./ \"$TARGET/\"; else (tar --exclude=.git -cf - .) | (cd \"$TARGET\" && tar -xf -); fi; printf \"%s\\n\" \"$STAMP\" > \"$TARGET/.ratib-deploy-stamp\"; ABOUT=no; [ -f \"$TARGET/pages/about.php\" ] && ABOUT=yes; printf \"%s target=%s about=%s marker=%s\\n\" \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\" \"$TARGET\" \"$ABOUT\" \"$MARKER\" >> \"$LOG\"; find \"$TARGET\" -type d -exec chmod 755 {} \\; ; find \"$TARGET\" -name .htaccess -type f -exec chmod 644 {} \\; ; [ -f \"$TARGET/.htaccess\" ] && chmod 644 \"$TARGET/.htaccess\" || true; done'"
