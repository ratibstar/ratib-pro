name: ratib_hr_mobile
description: RATIB HR Mobile — Enterprise Employee Self-Service (ESS). Presentation layer for RATIB ERP.
publish_to: "none"
version: 0.1.9+111

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  intl: any
  # Declared for Phase 1+ — do not wire in Phase 0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  local_auth: ^2.3.0
  provider: ^6.1.2
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.4.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # ARB files under lib/l10n are the source of truth for copy.
  # Phase 0 uses manual AppLocalizations; enable generate:true when SDK is ready.
