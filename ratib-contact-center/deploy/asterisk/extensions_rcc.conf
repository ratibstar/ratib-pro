; RATEB Contact Center — Asterisk dialplan (include from extensions.conf)
; Install: #include extensions_rcc.conf

[rcc-inbound]
exten => _X.,1,NoOp(RCC inbound ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(RCC_TENANT_ID=${IF($[${LEN(${RCC_TENANT_ID})}=0]?1:${RCC_TENANT_ID})})
 same => n,Set(CHANNEL(hangup_handler_push)=rcc-hangup,s,1)
 same => n,Goto(rcc-ivr-tenant-${RCC_TENANT_ID},start,1)

[rcc-ivr-tenant-1]
exten => start,1,NoOp(RCC IVR tenant 1)
 same => n,Set(RCC_IVR=1)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(welcome)
 same => n,Goto(rcc-ivr-collect,s,1)

[rcc-ivr-collect]
exten => s,1,Read(RCC_INPUT,,,1,10)
 same => n,UserEvent(RCCDTMF,Channel: ${CHANNEL},Digit: ${RCC_INPUT},RCC_TENANT_ID: ${RCC_TENANT_ID})
 same => n,Goto(rcc-route,s,1)

[rcc-route]
exten => s,1,NoOp(RCC route input ${RCC_INPUT})
 same => n,GotoIf($["${RCC_INPUT}"="9"]?rcc-queue,s,1)
 same => n,Goto(rcc-queue,s,1)

[rcc-queue]
exten => s,1,NoOp(RCC queue)
 same => n,Set(RCC_QUEUE_CODE=default)
 same => n,Queue(${RCC_QUEUE_CODE},t,,,300)
 same => n,Hangup()

[rcc-agent-connect]
exten => s,1,NoOp(RCC agent connect call ${RCC_CALL_ID})
 same => n,Dial(${PJSIP_DIAL_CONTACTS(agent${RCC_TENANT_ID}_${RCC_AGENT_ID})},30,tT)
 same => n,Hangup()

[rcc-tenant-1]
exten => _1XXX,1,Dial(PJSIP/agent1_${EXTEN},30,tT)
 same => n,Hangup()

[rcc-hangup]
exten => s,1,NoOp(RCC hangup handler)
 same => n,UserEvent(RCCCallEnded,Channel: ${CHANNEL},RCC_TENANT_ID: ${RCC_TENANT_ID})
 same => n,Return()
