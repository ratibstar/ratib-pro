; RATIB Contact Center — PJSIP WebRTC endpoints (template)
; Copy and adjust per tenant/agent in production.

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089

[agent-template](!)
type=endpoint
context=rcc-tenant-1
disallow=all
allow=opus,ulaw,alaw
webrtc=yes
dtls_auto_generate_cert=yes
media_encryption=dtls
direct_media=no
ice_support=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[agent-template](!)
type=aor
max_contacts=3
remove_existing=yes

[agent-template](!)
type=auth
auth_type=userpass

; Example agent 1 tenant 1:
; [agent1_1001](agent-template)
; auth=agent1_1001
; aors=agent1_1001
; [agent1_1001](agent-template)
; password=SECURE_PASSWORD
; username=agent1_1001
