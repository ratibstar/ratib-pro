openapi: 3.1.0
info:
  title: RATEB POS V2 API
  version: 2.0.0
  description: |
    Additive POS V2 REST API. V1 endpoints under `/pos/api/` remain unchanged.
    All V2 routes require authentication and company context.
  contact:
    name: RATEB ERP Platform
    url: https://rateb.sa

servers:
  - url: https://{host}/api/v2/pos
    description: Bearer-token REST API (implemented)
    variables:
      host:
        default: app.rateb.sa
  - url: https://{host}/admin/ops/pos/api/v2
    description: Session-authenticated JSON API (implemented)
    variables:
      host:
        default: app.rateb.sa

tags:
  - name: Register
  - name: Catalog
  - name: Cart
  - name: Customer
  - name: Discount
  - name: Payment
  - name: Orders
  - name: Returns
  - name: Suspend
  - name: Shift
  - name: Receipt
  - name: Approval
  - name: Hardware
  - name: Session
  - name: Restaurant
  - name: Pharmacy
  - name: Sync
  - name: Audit
  - name: Settings
  - name: Extensions

security:
  - bearerAuth: []
  - sessionAuth: []
  - csrfToken: []

paths:
  /bootstrap:
    get:
      tags: [Register]
      summary: Load register bootstrap context
      description: |
        Implemented endpoint. Bearer API uses `/api/v2/pos/bootstrap`.
        Web session API uses `/admin/ops/pos/api/v2/bootstrap`.
        Unimplemented routes in this document return HTTP 501 with `NOT_IMPLEMENTED`.
      operationId: getRegisterBootstrap
      parameters:
        - $ref: '#/components/parameters/TerminalId'
        - $ref: '#/components/parameters/PosVersion'
      responses:
        '200':
          description: Bootstrap payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapSuccessEnvelope'
        '404':
          description: POS V2 disabled for scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosV2DisabledEnvelope'
        '422':
          description: Bootstrap validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapErrorEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Shift not open (planned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /register:
    get:
      tags: [Register]
      summary: Register session entry (not implemented)
      operationId: getRegisterIndex
      responses:
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotImplementedEnvelope'

  /catalog/search:
    get:
      tags: [Catalog]
      summary: Search product catalog
      operationId: searchCatalog
      parameters:
        - name: query
          in: query
          schema:
            type: string
            maxLength: 100
        - name: category_id
          in: query
          schema:
            type: integer
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/TerminalId'
      responses:
        '200':
          description: Catalog results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSearchSuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogErrorEnvelope'

  /catalog/product/{productId}:
    get:
      tags: [Catalog]
      summary: Get product detail for POS
      operationId: getCatalogProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/TerminalId'
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProductSuccessEnvelope'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogErrorEnvelope'

  /catalog/barcode:
    get:
      tags: [Catalog]
      summary: Lookup product by barcode, SKU, or serial
      operationId: lookupCatalogBarcode
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: barcode
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/TerminalId'
      responses:
        '200':
          description: Matched product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProductSuccessEnvelope'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogErrorEnvelope'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogErrorEnvelope'

  /cart/lines:
    post:
      tags: [Cart]
      summary: Add line to cart
      operationId: addCartLine
      parameters:
        - $ref: '#/components/parameters/TerminalId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddLineRequest'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartSuccessEnvelope'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartErrorEnvelope'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartErrorEnvelope'

  /cart/lines/{lineId}:
    patch:
      tags: [Cart]
      summary: Update cart line
      operationId: updateCartLine
      parameters:
        - name: lineId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLineRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartSuccessEnvelope'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartErrorEnvelope'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartErrorEnvelope'
    delete:
      tags: [Cart]
      summary: Remove cart line
      operationId: removeCartLine
      parameters:
        - name: lineId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartSuccessEnvelope'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartErrorEnvelope'

  /cart/clear:
    post:
      tags: [Cart]
      summary: Clear cart
      operationId: clearCart
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartSuccessEnvelope'

  /cart/price-override:
    post:
      tags: [Cart]
      summary: Override line price
      operationId: overridePrice
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/ApprovalToken'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverridePriceRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '403':
          $ref: '#/components/responses/ApprovalRequired'

  /customer/search:
    get:
      tags: [Customer]
      summary: Search customers
      operationId: searchCustomer
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 20
            default: 10
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSearchResponse'

  /customer/attach:
    post:
      tags: [Customer]
      summary: Attach customer to cart
      operationId: attachCustomer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachCustomerRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'

  /customer/detach:
    post:
      tags: [Customer]
      summary: Detach customer from cart
      operationId: detachCustomer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'

  /discount/apply:
    post:
      tags: [Discount]
      summary: Apply discount
      operationId: applyDiscount
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyDiscountRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '403':
          $ref: '#/components/responses/ApprovalRequired'

  /discount/remove:
    post:
      tags: [Discount]
      summary: Remove discount
      operationId: removeDiscount
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveDiscountRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'

  /charge/initiate:
    post:
      tags: [Payment]
      summary: Initiate charge (open payment sheet)
      operationId: initiateCharge
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateChargeRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSheetResponse'
        '422':
          description: Empty cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /payment/record:
    post:
      tags: [Payment]
      summary: Record payment line
      operationId: recordPayment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPaymentRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentBalanceResponse'

  /payment/complete:
    post:
      tags: [Payment]
      summary: Complete sale
      operationId: completeSale
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSaleRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteSaleResponse'
        '409':
          description: Duplicate idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteSaleResponse'

  /payment/terminal:
    post:
      tags: [Payment]
      summary: Initiate card terminal payment
      operationId: processTerminalPayment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalPaymentRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalPaymentResponse'
        '502':
          description: Terminal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /orders/search:
    get:
      tags: [Orders]
      summary: Search orders for return
      operationId: searchOrders
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnOrderResponse'

  /returns/process:
    post:
      tags: [Returns]
      summary: Process return
      operationId: processReturn
      parameters:
        - $ref: '#/components/parameters/ApprovalToken'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessReturnRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnCompleteResponse'

  /returns/exchange:
    post:
      tags: [Returns]
      summary: Process exchange
      operationId: processExchange
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessExchangeRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeCompleteResponse'

  /suspend:
    post:
      tags: [Suspend]
      summary: Suspend current sale
      operationId: suspendSale
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendSaleRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuspendedSaleResponse'

  /suspend/list:
    get:
      tags: [Suspend]
      summary: List suspended sales
      operationId: listSuspendedSales
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuspendedListResponse'

  /suspend/{suspendedId}/resume:
    post:
      tags: [Suspend]
      summary: Resume suspended sale
      operationId: resumeSale
      parameters:
        - name: suspendedId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'

  /shift/open:
    post:
      tags: [Shift]
      summary: Open shift
      operationId: openShift
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenShiftRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResponse'

  /shift/close:
    post:
      tags: [Shift]
      summary: Close shift
      operationId: closeShift
      parameters:
        - $ref: '#/components/parameters/ApprovalToken'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseShiftRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseShiftResponse'

  /receipt/print:
    post:
      tags: [Receipt]
      summary: Queue receipt print
      operationId: printReceipt
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrintReceiptRequest'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintJobResponse'

  /receipt/reprint:
    post:
      tags: [Receipt]
      summary: Reprint receipt
      operationId: reprintReceipt
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprintReceiptRequest'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintJobResponse'

  /receipt/digital:
    post:
      tags: [Receipt]
      summary: Send digital receipt
      operationId: sendDigitalReceipt
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DigitalReceiptRequest'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalReceiptResponse'

  /approval/request:
    post:
      tags: [Approval]
      summary: Request manager approval
      operationId: requestApproval
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestApprovalRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPendingResponse'

  /approval/grant:
    post:
      tags: [Approval]
      summary: Grant approval
      operationId: grantApproval
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveActionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalTokenResponse'

  /approval/deny:
    post:
      tags: [Approval]
      summary: Deny approval
      operationId: denyApproval
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DenyActionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalDeniedResponse'

  /hardware/drawer/open:
    post:
      tags: [Hardware]
      summary: Open cash drawer
      operationId: openCashDrawer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenDrawerRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrawerResponse'

  /hardware/status:
    get:
      tags: [Hardware]
      summary: Get device status
      operationId: getDeviceStatus
      parameters:
        - $ref: '#/components/parameters/TerminalId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatusResponse'

  /hardware/test-print:
    post:
      tags: [Hardware]
      summary: Test print
      operationId: testPrint
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestPrintRequest'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintJobResponse'

  /session/recover:
    post:
      tags: [Session]
      summary: Recover session after crash
      operationId: recoverSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoverSessionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterBootstrapResponse'

  /session/snapshot:
    post:
      tags: [Session]
      summary: Save cart snapshot
      operationId: saveCartSnapshot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartSnapshotRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'

  /restaurant/tables:
    get:
      tags: [Restaurant]
      summary: Get table map
      operationId: getTableMap
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableMapResponse'

  /restaurant/tables/{tableId}/open:
    post:
      tags: [Restaurant]
      summary: Open table tab
      operationId: openTable
      parameters:
        - name: tableId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenTableRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableSessionResponse'

  /restaurant/split:
    post:
      tags: [Restaurant]
      summary: Split bill
      operationId: splitBill
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SplitBillRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SplitBillResponse'

  /restaurant/merge:
    post:
      tags: [Restaurant]
      summary: Merge tables
      operationId: mergeTables
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeTablesRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableSessionResponse'

  /restaurant/kitchen/send:
    post:
      tags: [Restaurant]
      summary: Send kitchen ticket
      operationId: sendKitchenTicket
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitchenTicketRequest'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitchenTicketResponse'

  /pharmacy/prescription/validate:
    post:
      tags: [Pharmacy]
      summary: Validate prescription
      operationId: validatePrescription
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidatePrescriptionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescriptionValidationResponse'

  /pharmacy/batch/select:
    post:
      tags: [Pharmacy]
      summary: Select batch for line
      operationId: selectBatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectBatchRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'

  /sync/batch:
    post:
      tags: [Sync]
      summary: Process offline sync batch
      operationId: syncOfflineBatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatchRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncBatchResponse'

  /sync/conflicts/{conflictId}/resolve:
    post:
      tags: [Sync]
      summary: Resolve sync conflict
      operationId: resolveSyncConflict
      parameters:
        - name: conflictId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveConflictRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResolutionResponse'

  /audit/timeline:
    get:
      tags: [Audit]
      summary: List audit timeline
      operationId: listAuditTimeline
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditTimelineResponse'

  /settings:
    get:
      tags: [Settings]
      summary: Get V2 POS settings for terminal
      operationId: getPosSettings
      parameters:
        - $ref: '#/components/parameters/TerminalId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosSettingsResponse'

  /license/validate:
    post:
      tags: [Settings]
      summary: Validate terminal license
      operationId: validateLicense
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateLicenseRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseStatusResponse'

  /ext/{extensionId}/{path}:
    get:
      tags: [Extensions]
      summary: Extension API proxy (GET)
      operationId: extensionApiGet
      parameters:
        - $ref: '#/components/parameters/ExtensionId'
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Extension-defined response
    post:
      tags: [Extensions]
      summary: Extension API proxy (POST)
      operationId: extensionApiPost
      parameters:
        - $ref: '#/components/parameters/ExtensionId'
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Extension-defined response

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionAuth:
      type: apiKey
      in: cookie
      name: RATEB_SESSION
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN

  parameters:
    TerminalId:
      name: X-Rateb-Terminal-Id
      in: header
      required: true
      schema:
        type: integer
    SessionId:
      name: X-Rateb-Session-Id
      in: header
      required: true
      schema:
        type: integer
    PosVersion:
      name: X-Rateb-Pos-Version
      in: header
      schema:
        type: string
        enum: ['2']
        default: '2'
    ApprovalToken:
      name: X-Rateb-Approval-Token
      in: header
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 48
        default: 24
    ExtensionId:
      name: extensionId
      in: path
      required: true
      schema:
        type: string

  responses:
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: POS_FORBIDDEN
              message: Permission denied
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
    ApprovalRequired:
      description: Manager approval required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApprovalRequiredResponse'

  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^\d+\.\d{2}$'
          example: '125.50'
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: SAR

    Pagination:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            field:
              type: string
              nullable: true
            details:
              type: object
              additionalProperties: true

    BootstrapSuccessEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/RegisterBootstrapData'
        meta:
          type: object
          required: [version, profile]
          properties:
            version:
              type: string
              example: '2'
            profile:
              type: string
              example: retail

    BootstrapErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

    PosV2DisabledEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [code]
          properties:
            code:
              type: string
              const: POS_V2_DISABLED
            message:
              type: string
            field:
              type: string
              nullable: true
            details:
              type: object
              additionalProperties: true

    NotImplementedEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [code]
          properties:
            code:
              type: string
              const: NOT_IMPLEMENTED

    RegisterBootstrapData:
      type: object
      description: Live bootstrap payload (`RegisterBootstrapResponse::toArray()`).
      additionalProperties: true
      properties:
        catalog:
          $ref: '#/components/schemas/CatalogBootstrap'
        cart:
          $ref: '#/components/schemas/CartResponse'

    CatalogBootstrap:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CatalogCategory'

    CatalogCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sort_order:
          type: integer

    CatalogSearchSuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/CatalogSearchResponse'

    CatalogProductSuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/CatalogProduct'

    CatalogErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

    CartSuccessEnvelope:
      type: object
