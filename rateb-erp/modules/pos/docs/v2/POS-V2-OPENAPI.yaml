          type: integer
        warehouse_id:
          type: integer
        shift_id:
          type: integer
        session_id:
          type: integer
        profile:
          type: string
          enum: [retail, restaurant, pharmacy, fashion, enterprise]
        locale:
          type: string
        permissions:
          type: array
          items:
            type: string

    CartLine:
      type: object
      properties:
        line_id:
          type: string
          format: uuid
        product_id:
          type: integer
        name:
          type: string
        qty:
          type: string
        unit_price:
          $ref: '#/components/schemas/Money'
        line_total:
