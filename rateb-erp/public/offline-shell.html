<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme-scope="erp" data-theme="dark" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1117">
<title>RATEB ERP — Offline</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:2rem;background:#0f1117;color:#e8eaed;text-align:center}
html[data-bs-theme="light"] body{background:#f4f6f8;color:#1a1d24}
h1{font-size:1.25rem;margin:0 0 .75rem}
p{opacity:.9;line-height:1.5;max-width:28rem;margin:.5rem auto}
#shell-root{text-align:initial;max-width:72rem;margin:1rem auto;padding:0 1rem}
#shell-root .rateb-offline-shell-main{padding:1rem 0}
a{color:#8ab4ff}
.rateb-offline-local-session-banner{position:sticky;top:0;z-index:99990;padding:.4rem .75rem;background:#1e3a5f;color:#e8eaed;font:13px/1.4 system-ui,sans-serif;text-align:center}
html[data-bs-theme="light"] .rateb-offline-local-session-banner{background:#dbe7f5;color:#1a1d24}
</style>
<script>
(function () {
  try {
    var mode = localStorage.getItem('rateb_erp_theme') || localStorage.getItem('rateb_theme') || 'dark';
    var bs = mode === 'auto'
      ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      : (mode === 'light' ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', mode);
    document.documentElement.setAttribute('data-bs-theme', bs);
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="offline-status">
  <h1 id="title">Unlock required</h1>
  <p id="msg">Preparing offline unlock…</p>
  <p><a id="retry" href="#">إعادة المحاولة</a></p>
</div>
<div id="shell-root" hidden></div>
<script>
(function () {
  var retry = document.getElementById('retry');
  if (retry) {
    retry.addEventListener('click', function (e) {
      e.preventDefault();
      location.reload();
    });
  }

  function publicBase() {
    try {
      var p = String(location.pathname || '');
      var m = p.match(/^(.*\/public\/)/i);
      if (m && m[1]) {
        return m[1];
      }
    } catch (e) { /* ignore */ }
    return '/rateb-erp/public/';
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.async = false;
      s.onload = function () { resolve(src); };
      s.onerror = function () { reject(new Error('load_failed:' + src)); };
      document.body.appendChild(s);
    });
  }

  var base = publicBase();
  // Cache-bust so SW coexist updates are picked up after identity fixes.
  var v = 'oid-20260712b';
  var t0 = Date.now();
  var slow = setTimeout(function () {
    var msg = document.getElementById('msg');
    if (msg && Date.now() - t0 > 1500) {
      msg.textContent = 'Loading offline scripts from cache…';
    }
  }, 1500);

  loadScript(base + 'assets/offline/rateb-offline.js?v=' + v)
    .then(function () { return loadScript(base + 'assets/offline/erp-offline-shell-auth.js?v=' + v); })
    .then(function () { return loadScript(base + 'assets/offline/erp-offline-shell-rbac.js?v=' + v); })
    .then(function () { clearTimeout(slow); })
    .catch(function () {
      clearTimeout(slow);
      var title = document.getElementById('title');
      var msg = document.getElementById('msg');
      if (title) title.textContent = 'Offline shell error';
      if (msg) msg.textContent = 'Unable to load offline identity scripts. Reconnect, hard-refresh Admin once, then retry offline.';
    });
})();
</script>
</body>
</html>
