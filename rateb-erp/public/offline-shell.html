<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme-scope="erp" data-theme="dark" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1117">
<title>RATEB ERP — Offline</title>
<style>
body{font-family:system-ui,Segoe UI,sans-serif;margin:0;padding:2rem;background:radial-gradient(ellipse at 30% 20%,#1e3a5f 0%,#0f1117 55%,#0a0c10 100%);color:#e8eaed;text-align:center;min-height:100vh;box-sizing:border-box}
html[data-bs-theme="light"] body{background:radial-gradient(ellipse at 30% 20%,#dbe7f5 0%,#f4f6f8 55%,#eef1f5 100%);color:#1a1d24}
h1{font-size:1.25rem;margin:0 0 .75rem}
p{opacity:.9;line-height:1.5;max-width:28rem;margin:.5rem auto}
#shell-root{text-align:initial;max-width:none;margin:0;padding:0;min-height:100vh}
#shell-root .rateb-offline-shell-main{padding:1rem 0}
body.rateb-offline-shell-active{padding:0;text-align:initial;background:#0f1117}
html[data-bs-theme="light"] body.rateb-offline-shell-active{background:#f4f6f8}
body.rateb-offline-shell-active #shell-root{display:block}
.rateb-offline-module-links .list-group-item{background:#1a1d24;color:#e8eaed;border-color:#2a2f3a}
.rateb-offline-rbac-link{display:block;padding:.45rem .75rem;color:#e8eaed;text-decoration:none}
.rateb-offline-rbac-section-title{opacity:.7;font-size:.85rem;padding:.5rem .75rem 0}
a{color:#8ab4ff}
.rateb-offline-local-session-banner{position:sticky;top:0;z-index:99990;padding:.4rem .75rem;background:#1e3a5f;color:#e8eaed;font:13px/1.4 system-ui,sans-serif;text-align:center}
html[data-bs-theme="light"] .rateb-offline-local-session-banner{background:#dbe7f5;color:#1a1d24}
#offline-status{max-width:22rem;margin:10vh auto 0;padding:1.5rem;border-radius:12px;background:rgba(26,29,36,.92);border:1px solid #2a3344}
html[data-bs-theme="light"] #offline-status{background:rgba(255,255,255,.92);border-color:#c5d0de}
</style>
<script>
(function () {
  try {
    var mode = localStorage.getItem('rateb_erp_theme') || localStorage.getItem('rateb_theme') || 'dark';
    var bs = mode === 'auto'
      ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      : (mode === 'light' ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', mode);
    document.documentElement.setAttribute('data-bs-theme', bs);
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="offline-status">
  <h1 id="title">فتح أوفلاين</h1>
  <p id="msg">جاري تجهيز فتح الهوية الأوفلاين…</p>
  <p><a id="retry" href="#">إعادة المحاولة</a></p>
</div>
<div id="shell-root" hidden></div>
<script>
(function () {
  var retry = document.getElementById('retry');
  if (retry) {
    retry.addEventListener('click', function (e) {
      e.preventDefault();
      location.reload();
    });
  }

  // Jump to live Admin only after a real network probe (navigator.onLine is unreliable).
  try {
    if (navigator.onLine === false) {
      /* continue offline unlock */
    } else {
      var base = (function () {
        var p = String(location.pathname || '');
        var m = p.match(/^(.*\/public\/)/i);
        if (m && m[1]) return m[1];
        return '/rateb-erp/public/';
      })();
      var probe = base + 'connectivity-probe.json?_rateb_probe=' + Date.now();
      fetch(probe, {
        method: 'GET',
        credentials: 'same-origin',
        cache: 'no-store',
        headers: { Accept: 'application/json', 'X-Rateb-Connectivity': '1' }
      }).then(function (res) {
        if (!res || !res.ok) {
          return;
        }
        var q = location.search || '';
        var already = /[?&]rateb_live=/.test(q) || /[?&]rateb_force_live=/.test(q);
        if (already) {
          var finish = function () {
            location.replace(location.origin + base + 'admin/?rateb_force_live=' + Date.now());
          };
          var jobs = [];
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all((regs || []).map(function (r) { return r.unregister(); }));
            }));
          }
          if (window.caches && caches.keys) {
            jobs.push(caches.keys().then(function (keys) {
              return Promise.all((keys || []).map(function (k) {
                return /^rateb-/i.test(String(k || '')) ? caches.delete(k) : null;
              }));
            }));
          }
          Promise.all(jobs).then(finish).catch(finish);
          return;
        }
        location.replace(location.origin + base + 'admin/?rateb_live=' + Date.now());
      }).catch(function () { /* stay offline */ });
    }
  } catch (eOnline) { /* continue offline unlock */ }

  function publicBase() {
    try {
      var p = String(location.pathname || '');
      var m = p.match(/^(.*\/public\/)/i);
      if (m && m[1]) {
        return m[1];
      }
      // Branch appliance / PHP built-in server: public/ is the web root.
      var host = String(location.hostname || '');
      if (host === '127.0.0.1' || host === 'localhost' || host === '[::1]') {
        return '/';
      }
      if (/^\/(admin|login|offline-shell\.html|pos)(\/|$)/i.test(p) || p === '/' || p === '') {
        return '/';
      }
    } catch (e) { /* ignore */ }
    return '/rateb-erp/public/';
  }

  function setStatus(titleText, msgText) {
    var title = document.getElementById('title');
    var msg = document.getElementById('msg');
    if (title && titleText) title.textContent = titleText;
    if (msg && msgText) msg.textContent = msgText;
  }

  function loadScript(src, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var done = false;
      var s = document.createElement('script');
      s.src = src;
      s.async = false;
      var ms = typeof timeoutMs === 'number' ? timeoutMs : 4000;
      /* PERF-P0.1 — offline: never wait multi-second for a missing SW cache entry. */
      try {
        if (navigator.onLine === false && ms > 2000) {
          ms = 2000;
        }
      } catch (eOff) { /* ignore */ }
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        try { s.remove(); } catch (e) { /* ignore */ }
        reject(new Error('timeout:' + src));
      }, ms);
      s.onload = function () {
        if (done) return;
        done = true;
        clearTimeout(timer);
        resolve(src);
      };
      s.onerror = function () {
        if (done) return;
        done = true;
        clearTimeout(timer);
        reject(new Error('load_failed:' + src));
      };
      document.body.appendChild(s);
    });
  }

  /** Prefer cached pathname (no ?v=); fall back to cache-busted URL — fail-fast offline. */
  function loadOfflineScript(relPath) {
    var base = publicBase();
    var plain = base + relPath;
    var bust = plain + (plain.indexOf('?') >= 0 ? '&' : '?') + 'v=20260713-offline-nav-guard';
    var tShort = 2000;
    var tLong = 8000;
    try {
      if (navigator.onLine === false) {
        tLong = 2000;
      }
    } catch (eT) { /* ignore */ }
    return loadScript(plain, tLong).catch(function () {
      return loadScript(bust, tShort);
    }).catch(function () {
      /* Only fall back to monolith for bootstrap entry, not for every module. */
      if (/offline-bootstrap\.js$/i.test(relPath) || /tenant-context\.js$/i.test(relPath)) {
        return loadScript(base + 'assets/offline/rateb-offline.min.js', tShort).catch(function () {
          return loadScript(base + 'assets/offline/rateb-offline.js?v=oid-20260713-lean', tShort);
        }).catch(function () {
          return loadScript(base + 'assets/offline/rateb-offline.js', tShort);
        });
      }
      return Promise.reject(new Error('load_failed:' + plain));
    });
  }

  var t0 = Date.now();
  var slow = setTimeout(function () {
    if (Date.now() - t0 > 1200) {
      setStatus('Unlock required', 'Loading offline scripts from cache…');
    }
  }, 1200);

  /* Phase OE: restore tenant identity BEFORE OA/modules/unlock hosts. */
  loadOfflineScript('assets/offline/erp-offline-tenant-context.js')
    .then(function () {
      if (window.RatebOfflineTenantContext && typeof window.RatebOfflineTenantContext.restore === 'function') {
        window.RatebOfflineTenantContext.restore();
      }
      /* Phase OA: bootstrap → auth/rbac modules → shell hosts (same globals as monolith). */
      return loadOfflineScript('assets/offline/offline-bootstrap.js');
    })
    .then(function () {
      if (!(window.RatebOffline && typeof window.RatebOffline.ensure === 'function')) {
        return Promise.reject(new Error('oa_bootstrap_missing'));
      }
      return window.RatebOffline.ensure(['storage', 'auth', 'rbac']);
    })
    .then(function () { return loadOfflineScript('assets/offline/erp-offline-shell-auth.js'); })
    .then(function () { return loadOfflineScript('assets/offline/erp-offline-shell-rbac.js'); })
    .then(function () {
      clearTimeout(slow);
      if (!(window.RatebOfflineAuthLock && typeof window.RatebOfflineAuthLock.requireUnlockIfNeeded === 'function')) {
        var host = String(location.hostname || '');
        var localHint = (host === '127.0.0.1' || host === 'localhost' || host === '[::1]')
          ? ' On this PC: start RATIB ERP (local server on port 8088), then Retry.'
          : ' Reconnect, open Admin once (online), then retry offline.';
        setStatus(
          'Offline shell error',
          'Offline identity scripts are missing from cache.' + localHint
        );
      }
    })
    .catch(function (err) {
      clearTimeout(slow);
      var host = String(location.hostname || '');
      var localHint = (host === '127.0.0.1' || host === 'localhost' || host === '[::1]')
        ? ' Start RATIB ERP local server (port 8088), then Retry.'
        : ' Reconnect, hard-refresh Admin once, then retry offline.';
      setStatus(
        'Offline shell error',
        'Unable to load offline identity scripts (' + String(err && err.message ? err.message : err) + ').' + localHint
      );
    });
})();
</script>
</body>
</html>
