<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme-scope="erp" data-theme="dark" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>RATEB ERP — Offline</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:2rem;background:#0f1117;color:#e8eaed;text-align:center}
html[data-bs-theme="light"] body{background:#f4f6f8;color:#1a1d24}
h1{font-size:1.25rem;margin:0 0 .75rem}
p{opacity:.9;line-height:1.5;max-width:28rem;margin:.5rem auto}
#shell-root{text-align:initial;max-width:72rem;margin:1rem auto;padding:0 1rem}
#shell-root .rateb-offline-shell-main{padding:1rem 0}
a{color:#8ab4ff}
</style>
<script>
(function () {
  try {
    var mode = localStorage.getItem('rateb_erp_theme') || localStorage.getItem('rateb_theme') || 'dark';
    var bs = mode === 'auto'
      ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      : (mode === 'light' ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', mode);
    document.documentElement.setAttribute('data-bs-theme', bs);
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="offline-status">
  <h1 id="title">وضع عدم الاتصال</h1>
  <p id="msg">لا تتوفر نسخة محفوظة من واجهة النظام. افتح لوحة الإدارة مرة وأنت متصل، ثم أعد المحاولة دون إنترنت.</p>
  <p><a id="retry" href="#">إعادة المحاولة</a></p>
</div>
<div id="shell-root" hidden></div>
<script>
(function () {
  var SNAPSHOT_PREFIX = 'erp_shell_chrome';
  var SCOPE_KEY = 'rateb_erp_offline_scope';
  var DB_NAME = 'rateb_erp_offline';
  var title = document.getElementById('title');
  var msg = document.getElementById('msg');
  var statusBox = document.getElementById('offline-status');
  var shellRoot = document.getElementById('shell-root');
  var retry = document.getElementById('retry');
  if (retry) {
    retry.addEventListener('click', function (e) {
      e.preventDefault();
      location.reload();
    });
  }

  /** Public base under …/public/ so scripts resolve when SW serves this HTML at /admin/. */
  function publicBase() {
    try {
      var p = String(location.pathname || '');
      var m = p.match(/^(.*\/public\/)/i);
      if (m && m[1]) {
        return m[1];
      }
    } catch (e) { /* ignore */ }
    return '/rateb-erp/public/';
  }

  function loadShellScripts() {
    var base = publicBase();
    [
      'assets/offline/rateb-offline.js',
      'assets/offline/erp-offline-shell-rbac.js'
    ].forEach(function (rel) {
      var s = document.createElement('script');
      s.src = base + rel;
      s.defer = true;
      document.body.appendChild(s);
    });
  }

  function showUnavailable(detail) {
    if (title) title.textContent = 'Cached shell unavailable';
    if (msg) {
      msg.textContent = detail || 'No tenant-scoped ERP shell chrome is stored. Reconnect, open Admin once with offline read-cache enabled, then retry offline.';
    }
    if (statusBox) statusBox.hidden = false;
    if (shellRoot) {
      shellRoot.hidden = true;
      while (shellRoot.firstChild) shellRoot.removeChild(shellRoot.firstChild);
    }
  }

  function readTenantFromQuery() {
    try {
      var q = new URLSearchParams(location.search || '');
      return {
        company_id: parseInt(q.get('company_id'), 10) || 0,
        branch_id: parseInt(q.get('branch_id'), 10) || 0,
        user_id: parseInt(q.get('user_id'), 10) || 0,
        auth_unlock: false
      };
    } catch (e) {
      return { company_id: 0, branch_id: 0, user_id: 0, auth_unlock: false };
    }
  }

  function readTenantFromLocal() {
    try {
      var raw = localStorage.getItem(SCOPE_KEY);
      if (!raw) {
        return { company_id: 0, branch_id: 0, user_id: 0, auth_unlock: false };
      }
      var o = JSON.parse(raw);
      return {
        company_id: parseInt(o.company_id, 10) || 0,
        branch_id: parseInt(o.branch_id, 10) || 0,
        user_id: parseInt(o.user_id, 10) || 0,
        auth_unlock: !!(o.auth_unlock || (o.flags && o.flags['offline.auth.unlock']))
      };
    } catch (e) {
      return { company_id: 0, branch_id: 0, user_id: 0, auth_unlock: false };
    }
  }

  function readTenantFromConfig() {
    var cfg = window.__RATEB_ERP_SHELL_OFFLINE__ || {};
    var flags = cfg.flags || {};
    return {
      company_id: parseInt(cfg.company_id, 10) || 0,
      branch_id: parseInt(cfg.branch_id, 10) || 0,
      user_id: parseInt(cfg.user_id, 10) || 0,
      auth_unlock: !!(flags['offline.auth.unlock'])
    };
  }

  function snapshotId(scope) {
    if (!scope.company_id || !scope.user_id) return null;
    return SNAPSHOT_PREFIX + ':' + scope.company_id + ':' + scope.branch_id + ':' + scope.user_id;
  }

  function renderSafeShell(html) {
    if (!html || typeof DOMParser === 'undefined') return false;
    var parser = new DOMParser();
    var doc = parser.parseFromString(String(html), 'text/html');
    if (!doc || !doc.body) return false;
    var marker = doc.getElementById('rateb-offline-shell-main')
      || doc.querySelector('.rateb-offline-shell-main');
    if (!marker) return false;

    doc.querySelectorAll('script, iframe, object, embed, link[rel="import"]').forEach(function (el) {
      el.remove();
    });
    doc.querySelectorAll('*').forEach(function (el) {
      var attrs = el.attributes ? Array.prototype.slice.call(el.attributes) : [];
      attrs.forEach(function (attr) {
        var name = String(attr.name || '');
        var val = String(attr.value || '');
        if (/^on/i.test(name)) {
          el.removeAttribute(name);
        } else if ((name === 'href' || name === 'xlink:href' || name === 'src') && /^\s*javascript:/i.test(val)) {
          el.removeAttribute(name);
        } else if (/^data-rateb-/i.test(name) || /^(data-csrf|data-token|data-session)/i.test(name)) {
          el.removeAttribute(name);
        }
      });
    });

    if (!shellRoot) return false;
    while (shellRoot.firstChild) shellRoot.removeChild(shellRoot.firstChild);

    Array.prototype.forEach.call(doc.body.childNodes, function (node) {
      if (node.nodeType === 1 || node.nodeType === 3) {
        shellRoot.appendChild(document.importNode(node, true));
      }
    });
    shellRoot.hidden = false;
    if (statusBox) statusBox.hidden = true;
    markConnectionOffline(shellRoot);
    return shellRoot.childNodes.length > 0;
  }

  /** Never show stale "متصل" / Online inside cached chrome. */
  function markConnectionOffline(rootEl) {
    var scope = rootEl || document;
    var nodes = scope.querySelectorAll
      ? scope.querySelectorAll('[data-rateb-connection-status], #rateb-connection-indicator, .rateb-connection-indicator')
      : [];
    Array.prototype.forEach.call(nodes, function (node) {
      node.classList.add('is-offline');
      node.classList.remove('is-online');
      node.setAttribute('title', 'غير متصل');
      node.setAttribute('aria-label', 'غير متصل');
      var label = node.querySelector('.rateb-connection-indicator__label');
      if (label) {
        label.textContent = 'غير متصل';
      }
    });
  }

  function isUnlocked(scope) {
    try {
      var key = 'rateb_erp_unlock_until:'
        + scope.company_id + ':' + (scope.branch_id || 0) + ':' + scope.user_id;
      var until = parseInt(sessionStorage.getItem(key) || '0', 10) || 0;
      return until > Date.now();
    } catch (e) {
      return false;
    }
  }

  function showLocked() {
    if (title) title.textContent = 'Unlock required';
    if (msg) {
      msg.textContent = 'Cached shell is locked. Open Admin online, unlock with your PIN, then retry offline.';
    }
    if (statusBox) statusBox.hidden = false;
    if (shellRoot) {
      shellRoot.hidden = true;
      while (shellRoot.firstChild) shellRoot.removeChild(shellRoot.firstChild);
    }
  }

  function loadSnapshot(id, scope) {
    if (!window.indexedDB || !id) {
      showUnavailable();
      return;
    }
    if (scope.auth_unlock && !isUnlocked(scope)) {
      showLocked();
      return;
    }
    var req = indexedDB.open(DB_NAME);
    req.onerror = function () { showUnavailable(); };
    req.onsuccess = function () {
      try {
        var db = req.result;
        if (!db.objectStoreNames.contains('snapshots')) {
          showUnavailable();
          return;
        }
        var tx = db.transaction('snapshots', 'readonly');
        var get = tx.objectStore('snapshots').get(id);
        get.onerror = function () { showUnavailable(); };
        get.onsuccess = function () {
          var row = get.result;
          if (!row || !row.html || !renderSafeShell(row.html)) {
            showUnavailable('No cached chrome for this user. Reconnect, open Admin once, then retry offline.');
            return;
          }
          markConnectionOffline(document);
        };
      } catch (e) {
        showUnavailable();
      }
    };
  }

  var scope = readTenantFromConfig();
  if (!scope.company_id || !scope.user_id) {
    scope = readTenantFromLocal();
  }
  if (!scope.company_id || !scope.user_id) {
    scope = readTenantFromQuery();
  }
  window.__RATEB_ERP_SHELL_OFFLINE__ = window.__RATEB_ERP_SHELL_OFFLINE__ || {};
  window.__RATEB_ERP_SHELL_OFFLINE__.company_id = scope.company_id;
  window.__RATEB_ERP_SHELL_OFFLINE__.branch_id = scope.branch_id;
  window.__RATEB_ERP_SHELL_OFFLINE__.user_id = scope.user_id;
  window.__RATEB_ERP_SHELL_OFFLINE__.flags = window.__RATEB_ERP_SHELL_OFFLINE__.flags || {
    'offline.enabled': true,
    'offline.read_cache': true,
    'offline.auth.unlock': !!scope.auth_unlock
  };

  var id = snapshotId(scope);
  if (!id) {
    showUnavailable('Tenant scope (company_id + user_id) required to load cached shell.');
  } else {
    loadSnapshot(id, scope);
  }
  loadShellScripts();
})();
</script>
</body>
</html>
