<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme-scope="erp" data-theme="dark" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1117">
<title>RATEB ERP — Offline</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:2rem;background:#0f1117;color:#e8eaed;text-align:center}
html[data-bs-theme="light"] body{background:#f4f6f8;color:#1a1d24}
h1{font-size:1.25rem;margin:0 0 .75rem}
p{opacity:.9;line-height:1.5;max-width:28rem;margin:.5rem auto}
#shell-root{text-align:initial;max-width:none;margin:0;padding:0;min-height:100vh}
#shell-root .rateb-offline-shell-main{padding:1rem 0}
body.rateb-offline-shell-active{padding:0;text-align:initial}
body.rateb-offline-shell-active #shell-root{display:block}
.rateb-offline-module-links .list-group-item{background:#1a1d24;color:#e8eaed;border-color:#2a2f3a}
.rateb-offline-rbac-link{display:block;padding:.45rem .75rem;color:#e8eaed;text-decoration:none}
.rateb-offline-rbac-section-title{opacity:.7;font-size:.85rem;padding:.5rem .75rem 0}
a{color:#8ab4ff}
.rateb-offline-local-session-banner{position:sticky;top:0;z-index:99990;padding:.4rem .75rem;background:#1e3a5f;color:#e8eaed;font:13px/1.4 system-ui,sans-serif;text-align:center}
html[data-bs-theme="light"] .rateb-offline-local-session-banner{background:#dbe7f5;color:#1a1d24}
</style>
<script>
(function () {
  try {
    var mode = localStorage.getItem('rateb_erp_theme') || localStorage.getItem('rateb_theme') || 'dark';
    var bs = mode === 'auto'
      ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      : (mode === 'light' ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', mode);
    document.documentElement.setAttribute('data-bs-theme', bs);
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="offline-status">
  <h1 id="title">Unlock required</h1>
  <p id="msg">Preparing offline unlock…</p>
  <p><a id="retry" href="#">إعادة المحاولة</a></p>
</div>
<div id="shell-root" hidden></div>
<script>
(function () {
  var retry = document.getElementById('retry');
  if (retry) {
    retry.addEventListener('click', function (e) {
      e.preventDefault();
      location.reload();
    });
  }

  function publicBase() {
    try {
      var p = String(location.pathname || '');
      var m = p.match(/^(.*\/public\/)/i);
      if (m && m[1]) {
        return m[1];
      }
    } catch (e) { /* ignore */ }
    return '/rateb-erp/public/';
  }

  function setStatus(titleText, msgText) {
    var title = document.getElementById('title');
    var msg = document.getElementById('msg');
    if (title && titleText) title.textContent = titleText;
    if (msg && msgText) msg.textContent = msgText;
  }

  function loadScript(src, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var done = false;
      var s = document.createElement('script');
      s.src = src;
      s.async = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        try { s.remove(); } catch (e) { /* ignore */ }
        reject(new Error('timeout:' + src));
      }, typeof timeoutMs === 'number' ? timeoutMs : 4000);
      s.onload = function () {
        if (done) return;
        done = true;
        clearTimeout(timer);
        resolve(src);
      };
      s.onerror = function () {
        if (done) return;
        done = true;
        clearTimeout(timer);
        reject(new Error('load_failed:' + src));
      };
      document.body.appendChild(s);
    });
  }

  /** Prefer cached pathname (no ?v=); fall back to cache-busted URL. */
  function loadOfflineScript(relPath) {
    var base = publicBase();
    var plain = base + relPath;
    var bust = plain + (plain.indexOf('?') >= 0 ? '&' : '?') + 'v=oid-20260712c';
    return loadScript(plain, 3500).catch(function () {
      return loadScript(bust, 3500);
    });
  }

  var t0 = Date.now();
  var slow = setTimeout(function () {
    if (Date.now() - t0 > 1200) {
      setStatus('Unlock required', 'Loading offline scripts from cache…');
    }
  }, 1200);

  loadOfflineScript('assets/offline/rateb-offline.js')
    .then(function () { return loadOfflineScript('assets/offline/erp-offline-shell-auth.js'); })
    .then(function () { return loadOfflineScript('assets/offline/erp-offline-shell-rbac.js'); })
    .then(function () {
      clearTimeout(slow);
      if (!(window.RatebOfflineAuthLock && typeof window.RatebOfflineAuthLock.requireUnlockIfNeeded === 'function')) {
        setStatus(
          'Offline shell error',
          'Offline identity scripts are missing from cache. Reconnect, open Admin once (online), then retry offline.'
        );
      }
    })
    .catch(function (err) {
      clearTimeout(slow);
      setStatus(
        'Offline shell error',
        'Unable to load offline identity scripts (' + String(err && err.message ? err.message : err) + '). Reconnect, hard-refresh Admin once, then retry offline.'
      );
    });
})();
</script>
</body>
</html>
