name: Temporary read-only campaign save error

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: rateb.sa
    timeout-minutes: 10
    steps:
      - name: Read production save error
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/rateb-readonly-key"
          export KEY_PATH
          python3 - << 'PY'
          import os, stat
          key = (os.environ.get("DEPLOY_SSH_PRIVATE_KEY") or "").strip()
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")
          path = os.environ["KEY_PATH"]
          with open(path, "w", encoding="utf-8", newline="\n") as handle:
              handle.write(key)
              if not key.endswith("\n"):
                  handle.write("\n")
          os.chmod(path, stat.S_IRUSR | stat.S_IWUSR)
          PY
          PORT="${DEPLOY_SSH_PORT:-22}"
          ssh -i "${KEY_PATH}" -p "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}" bash -s > ai-save-error.txt << 'BASH'
          set +e
          echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          php -r 'echo "SAVE_SHA=".hash_file("sha256", "/home/admin/domains/ai.rateb.sa/campaign-save.php"), "\n";'
          echo "LOG_CANDIDATES_START"
          find /home/admin /usr/local/php83 /var/log/httpd /var/log/php-fpm -type f \( -name '*error*' -o -name 'php*log' -o -name '*fpm*.log' \) 2>/dev/null | head -40
          echo "LOG_CANDIDATES_END"
          php << 'PHP'
          <?php
          $c = require '/home/admin/domains/ai.rateb.sa/config/database.php';
          $pdo = new PDO(
              "mysql:host={$c['host']};dbname={$c['database']};charset={$c['charset']}",
              $c['username'],
              $c['password'],
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION, PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC, PDO::ATTR_EMULATE_PREPARES => false]
          );
          $userId = (int) $pdo->query('SELECT id FROM users ORDER BY id DESC LIMIT 1')->fetchColumn();
          echo "USER_ID_PRESENT=" . ($userId > 0 ? 'yes' : 'no') . "\n";
          $sql = "INSERT INTO campaigns (user_id,title,product_name,description,price,target_customer,status,created_at,updated_at) VALUES (?,?,?,?,?,?, 'draft', NOW(), NOW())";
          try {
              $pdo->beginTransaction();
              $stmt = $pdo->prepare($sql);
              $stmt->execute([$userId, 'Production generation check', 'RATEB AI Campaign', 'A short production check for campaign generation.', '100 SAR', 'Small business owners']);
              $pdo->rollBack();
              echo "INSERT_RESULT=ok\n";
          } catch (Throwable $e) {
              if ($pdo->inTransaction()) {
                  $pdo->rollBack();
              }
              $message = preg_replace('/(password|pwd)\s*[=:]\s*\S+/i', '$1=[redacted]', $e->getMessage());
              echo "ERROR_CLASS=" . $e::class . "\n";
              echo "SQLSTATE=" . $e->getCode() . "\n";
              echo "ERROR_MESSAGE=" . $message . "\n";
          }
          $cols = $pdo->query("SELECT COLUMN_NAME, IS_NULLABLE, COLUMN_DEFAULT, DATA_TYPE, EXTRA FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'campaigns' ORDER BY ORDINAL_POSITION");
          foreach ($cols as $col) {
              $default = $col['COLUMN_DEFAULT'];
              $defaultText = $default === null ? 'NULL' : $default;
              echo "COL {$col['COLUMN_NAME']} nullable={$col['IS_NULLABLE']} default={$defaultText} type={$col['DATA_TYPE']} extra={$col['EXTRA']}\n";
          }
          PHP
          BASH
          rm -f "${KEY_PATH}"

      - name: Upload error report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-save-error
          path: ai-save-error.txt
          retention-days: 1
          if-no-files-found: warn
