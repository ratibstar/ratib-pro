name: Temporary campaign smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: rateb.sa
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run production campaign smoke test
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          KEY_PATH="${RUNNER_TEMP}/rateb-readonly-key"
          export KEY_PATH
          python3 - << 'PY'
          import os, stat
          key = (os.environ.get("DEPLOY_SSH_PRIVATE_KEY") or "").strip()
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")
          path = os.environ["KEY_PATH"]
          with open(path, "w", encoding="utf-8", newline="\n") as handle:
              handle.write(key)
              if not key.endswith("\n"):
                  handle.write("\n")
          os.chmod(path, stat.S_IRUSR | stat.S_IWUSR)
          PY
          PORT="${DEPLOY_SSH_PORT:-22}"
          REMOTE="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          SSH=(ssh -i "${KEY_PATH}" -p "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          WORK="${RUNNER_TEMP}/smoke"
          mkdir -p "$WORK"
          python3 - << 'PY'
          import os, pathlib, secrets, struct, zlib
          work = pathlib.Path(os.environ["RUNNER_TEMP"]) / "smoke"
          def chunk(tag, data):
              return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xFFFFFFFF)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", 1, 1, 8, 2, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(b"\x00\xff\x00\x00")) + chunk(b"IEND", b"")
          (work / "tiny.png").write_bytes(png)
          (work / "email").write_text("ai-smoke-" + secrets.token_hex(4) + "@rateb.sa", encoding="utf-8")
          (work / "email-b").write_text("ai-smoke-b-" + secrets.token_hex(4) + "@rateb.sa", encoding="utf-8")
          (work / "password").write_text(secrets.token_urlsafe(18), encoding="utf-8")
          os.chmod(work / "password", 0o600)
          PY
          ffmpeg -y -loglevel error -f lavfi -i color=c=black:s=32x32:d=0.2 -c:v libx264 -pix_fmt yuv420p -movflags +faststart "$WORK/tiny.mp4"
          ffmpeg -y -loglevel error -f lavfi -i sine=frequency=440:duration=0.2 -c:a pcm_s16le "$WORK/tiny.wav"
          BASE=https://ai.rateb.sa
          COOKIE="$WORK/cookies"
          CSRF="$WORK/csrf"
          extract_csrf() {
            python3 - "$1" "$2" "$CSRF" << 'PY'
          import re, sys
          html = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          match = re.search(r'name="' + re.escape(sys.argv[2]) + r'" value="([^"]+)"', html)
          if not match:
              raise SystemExit("csrf missing")
          open(sys.argv[3], "w", encoding="utf-8").write(match.group(1))
          PY
          }
          expect_redirect() {
            grep -Eq ' 30[127]' "$1"
          }
          no_media_error() {
            if grep -q 'media_error=' "$1"; then echo "UPLOAD_FAIL"; exit 1; fi
          }
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/register.html" "$BASE/register.php"
          extract_csrf "$WORK/register.html" csrf_token
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/register.hdr" -o /dev/null \
            --data-urlencode "csrf_token@${CSRF}" --data-urlencode "name=Smoke Check" \
            --data-urlencode "email@${WORK}/email" --data-urlencode "password@${WORK}/password" \
            "$BASE/register.php"
          grep -qi 'dashboard.php' "$WORK/register.hdr"
          echo "REGISTER=yes"
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/logout.hdr" -o /dev/null "$BASE/logout.php"
          grep -qi 'login.php' "$WORK/logout.hdr"
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/login.html" "$BASE/login.php"
          extract_csrf "$WORK/login.html" csrf_token
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/login.hdr" -o /dev/null \
            --data-urlencode "csrf_token@${CSRF}" --data-urlencode "email@${WORK}/email" \
            --data-urlencode "password@${WORK}/password" "$BASE/login.php"
          grep -qi 'dashboard.php' "$WORK/login.hdr"
          echo "LOGIN=yes"
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/dash.html" "$BASE/dashboard.php"
          grep -q 'dash-kpis' "$WORK/dash.html"
          grep -q 'id="theme"' "$WORK/dash.html"
          grep -q 'id="lang"' "$WORK/dash.html"
          echo "DASHBOARD=yes"
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/new.html" "$BASE/campaign-new.php"
          extract_csrf "$WORK/new.html" csrf
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/save.hdr" -o /dev/null \
            --data-urlencode "csrf@${CSRF}" --data-urlencode "title=Smoke campaign" \
            --data-urlencode "product_name=RATEB AI Campaign" --data-urlencode "description=A short production check." \
            --data-urlencode "price=100" --data-urlencode "target_customer=Small business owners" \
            --data-urlencode "status=draft" "$BASE/campaign-save.php"
          expect_redirect "$WORK/save.hdr"
          CAMPAIGN_ID=$(python3 - "$WORK/save.hdr" << 'PY'
          import re, sys
          match = re.search(r'campaign\.php\?id=(\d+)', open(sys.argv[1], encoding="utf-8", errors="replace").read())
          print(match.group(1) if match else "")
          PY
          )
          test -n "$CAMPAIGN_ID"
          echo "CREATE_CAMPAIGN=${CAMPAIGN_ID}"
          "${SSH[@]}" "${REMOTE}" "export CAMPAIGN_ID=${CAMPAIGN_ID}; php" << 'PHP'
          <?php
          require '/home/admin/domains/ai.rateb.sa/app/bootstrap.php';
          $id = (int) getenv('CAMPAIGN_ID');
          $stmt = db()->prepare('SELECT status FROM campaigns WHERE id=?');
          $stmt->execute([$id]);
          $status = (string) $stmt->fetchColumn();
          echo 'STATUS_CREATED=' . $status . "\n";
          if ($status !== 'draft') exit(1);
          PHP
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/campaign.html" "$BASE/campaign.php?id=${CAMPAIGN_ID}"
          extract_csrf "$WORK/campaign.html" csrf
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/update.hdr" -o /dev/null \
            --data-urlencode "csrf@${CSRF}" --data-urlencode "campaign_id=${CAMPAIGN_ID}" \
            --data-urlencode "title=Smoke campaign" --data-urlencode "product_name=RATEB AI Campaign" \
            --data-urlencode "description=A short production check." --data-urlencode "price=100" \
            --data-urlencode "target_customer=Small business owners" --data-urlencode "objective=Increase trial signups" \
            --data-urlencode "budget=2500" --data-urlencode "start_date=2026-10-10" --data-urlencode "end_date=2026-10-20" \
            --data-urlencode "status=draft" "$BASE/campaign-update.php"
          expect_redirect "$WORK/update.hdr"
          "${SSH[@]}" "${REMOTE}" "export CAMPAIGN_ID=${CAMPAIGN_ID}; php" << 'PHP'
          <?php
          require '/home/admin/domains/ai.rateb.sa/app/bootstrap.php';
          $id = (int) getenv('CAMPAIGN_ID');
          $stmt = db()->prepare('SELECT status, objective, budget, start_date, end_date FROM campaigns WHERE id=?');
          $stmt->execute([$id]);
          $row = $stmt->fetch();
          echo 'STATUS_EDITED=' . $row['status'] . "\n";
          echo 'OBJECTIVE=' . ($row['objective'] === 'Increase trial signups' ? 'yes' : 'no') . "\n";
          echo 'BUDGET=' . $row['budget'] . "\n";
          echo 'DATES=' . $row['start_date'] . '/' . $row['end_date'] . "\n";
          if ($row['status'] !== 'draft' || $row['objective'] !== 'Increase trial signups' || (string) $row['budget'] !== '2500.00') exit(1);
          PHP
          echo "EDIT=yes"
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/campaign.html" "$BASE/campaign.php?id=${CAMPAIGN_ID}"
          grep -q 'Increase trial signups' "$WORK/campaign.html"
          for token in 'data-tab="overview"' 'data-tab="ai"' 'data-tab="media"' 'data-tab="planner"' 'data-tab="variations"' 'data-tab="brand"' 'id="generateForm"' 'id="generate-image"' 'id="voice"' 'id="media"'; do
            grep -q "$token" "$WORK/campaign.html"
          done
          echo "CAMPAIGN_DETAILS=yes"
          extract_csrf "$WORK/campaign.html" csrf
          code=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/text.json" -w '%{http_code}' --max-time 120 \
            --data-urlencode "csrf@${CSRF}" --data-urlencode "campaign_id=${CAMPAIGN_ID}" --data-urlencode "lang=en" \
            "$BASE/app/ai/generate.php" || true)
          python3 - "$WORK/text.json" "$code" << 'PY'
          import json, sys
          data = json.loads(open(sys.argv[1], encoding="utf-8").read() or "{}")
          print("TEXT_HTTP=" + sys.argv[2])
          print("TEXT_OK=" + ("yes" if data.get("ok") else "no"))
          if not data.get("ok"):
              raise SystemExit(1)
          PY
          "${SSH[@]}" "${REMOTE}" "export CAMPAIGN_ID=${CAMPAIGN_ID}; php" << 'PHP'
          <?php
          require '/home/admin/domains/ai.rateb.sa/app/bootstrap.php';
          $id = (int) getenv('CAMPAIGN_ID');
          $stmt = db()->prepare('SELECT status FROM campaigns WHERE id=?');
          $stmt->execute([$id]);
          $status = (string) $stmt->fetchColumn();
          $types = db()->prepare('SELECT output_type FROM campaign_outputs WHERE campaign_id=?');
          $types->execute([$id]);
          $names = array_column($types->fetchAll(), 'output_type');
          $need = ['strategy','ad_copy','social_posts','whatsapp','product_description','video_ideas','voiceover','content_plan_7_days'];
          $count = count(array_intersect($need, $names));
          echo 'STATUS_AFTER_TEXT=' . $status . "\n";
          echo 'TEXT_TYPES=' . $count . "\n";
          if ($status !== 'in_progress' || $count !== 8) exit(1);
          PHP
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/campaign.html" "$BASE/campaign.php?id=${CAMPAIGN_ID}"
          extract_csrf "$WORK/campaign.html" csrf
          code=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/voice.json" -w '%{http_code}' --max-time 120 \
            --data-urlencode "csrf@${CSRF}" --data-urlencode "campaign_id=${CAMPAIGN_ID}" --data-urlencode "lang=ar" \
            "$BASE/app/ai/voice.php" || true)
          python3 - "$WORK/voice.json" "$code" << 'PY'
          import json, re, sys
          data = json.loads(open(sys.argv[1], encoding="utf-8").read() or "{}")
          error = re.sub(r"(?:sk-|gsk_)[A-Za-z0-9_\-]+", "[redacted]", str(data.get("error") or ""))[:160]
          print("VOICE_HTTP=" + sys.argv[2])
          print("VOICE_OK=" + ("yes" if data.get("ok") else "no"))
          if error:
              print("VOICE_ERROR=" + error)
          if not data.get("ok"):
              raise SystemExit(1)
          PY
          code=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/nocsrf.json" -w '%{http_code}' \
            --data-urlencode "campaign_id=${CAMPAIGN_ID}" "$BASE/app/ai/image.php")
          echo "CSRF_MISSING_HTTP=${code}"
          test "$code" = "419"
          code=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/image.json" -w '%{http_code}' --max-time 60 \
            --data-urlencode "csrf@${CSRF}" --data-urlencode "campaign_id=${CAMPAIGN_ID}" \
            "$BASE/app/ai/image.php" || true)
          python3 - "$WORK/image.json" "$code" "$WORK/job" << 'PY'
          import json, sys
          data = json.loads(open(sys.argv[1], encoding="utf-8").read() or "{}")
          job = str(data.get("job_id") or "")
          print("IMAGE_SUBMIT_HTTP=" + sys.argv[2])
          print("IMAGE_PENDING=" + ("yes" if data.get("pending") and len(job) == 36 else "no"))
          if not data.get("pending"):
              raise SystemExit(1)
          open(sys.argv[3], "w", encoding="utf-8").write(job)
          PY
          JOB=$(cat "$WORK/job")
          state=pending
          for attempt in $(seq 1 240); do
            sleep 3
            code=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/image.json" -w '%{http_code}' --max-time 60 \
              --data-urlencode "csrf@${CSRF}" --data-urlencode "campaign_id=${CAMPAIGN_ID}" \
              --data-urlencode "job_id=${JOB}" "$BASE/app/ai/image.php" || true)
            state=$(python3 - "$WORK/image.json" "$code" << 'PY'
          import json, sys
          data = json.loads(open(sys.argv[1], encoding="utf-8").read() or "{}")
          if data.get("ok"):
              print("done")
              print("IMAGE_HTTP=" + sys.argv[2])
              print("IMAGE_OK=yes")
              print("IMAGE_MODEL=" + str(data.get("model") or ""))
          elif data.get("pending"):
              print("pending")
          else:
              print("failed")
              print("IMAGE_HTTP=" + sys.argv[2])
              print("IMAGE_OK=no")
          PY
            )
            first=${state%%$'\n'*}
            if [ "$first" = "done" ]; then printf '%s\n' "$state"; break; fi
            if [ "$first" = "pending" ]; then
              if [ $((attempt % 20)) -eq 0 ]; then echo "IMAGE_STILL_PENDING=${attempt}"; fi
              continue
            fi
            printf '%s\n' "$state"
            exit 1
          done
          if [ "${state%%$'\n'*}" != "done" ]; then echo "IMAGE_ERROR=still queued"; exit 1; fi
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/campaign.html" "$BASE/campaign.php?id=${CAMPAIGN_ID}"
          extract_csrf "$WORK/campaign.html" csrf
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/up-image.hdr" -o /dev/null \
            -F "csrf=<${CSRF}" -F "campaign_id=${CAMPAIGN_ID}" -F "kind=image" \
            -F "file=@${WORK}/tiny.png;type=image/png;filename=tiny.png" "$BASE/app/media/upload.php"
          expect_redirect "$WORK/up-image.hdr"; no_media_error "$WORK/up-image.hdr"; echo "UPLOAD_IMAGE=yes"
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/up-video.hdr" -o /dev/null \
            -F "csrf=<${CSRF}" -F "campaign_id=${CAMPAIGN_ID}" -F "kind=video" \
            -F "file=@${WORK}/tiny.mp4;type=video/mp4;filename=tiny.mp4" "$BASE/app/media/upload.php"
          expect_redirect "$WORK/up-video.hdr"; no_media_error "$WORK/up-video.hdr"; echo "UPLOAD_VIDEO=yes"
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/up-audio.hdr" -o /dev/null \
            -F "csrf=<${CSRF}" -F "campaign_id=${CAMPAIGN_ID}" -F "kind=audio" \
            -F "file=@${WORK}/tiny.wav;type=audio/wav;filename=tiny.wav" "$BASE/app/media/upload.php"
          expect_redirect "$WORK/up-audio.hdr"; no_media_error "$WORK/up-audio.hdr"; echo "UPLOAD_AUDIO=yes"
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/item.hdr" -o /dev/null \
            --data-urlencode "csrf@${CSRF}" --data-urlencode "campaign_id=${CAMPAIGN_ID}" \
            --data-urlencode "title=Launch post" --data-urlencode "body=A scheduled social post." \
            --data-urlencode "item_date=2026-10-12" --data-urlencode "planner_status=review" \
            --data-urlencode "approval_status=draft" "$BASE/app/content/save.php"
          expect_redirect "$WORK/item.hdr"
          echo "PLANNER_SAVE=yes"
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/campaign.html" "$BASE/campaign.php?id=${CAMPAIGN_ID}#planner"
          ITEM_ID=$(python3 - "$WORK/campaign.html" << 'PY'
          import re, sys
          html = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          for form in re.findall(r'<form method="post" action="/app/content/save.php".*?</form>', html, re.S):
              match = re.search(r'name="id" value="(\d+)"', form)
              if match:
                  print(match.group(1))
                  break
          PY
          )
          test -n "$ITEM_ID"
          extract_csrf "$WORK/campaign.html" csrf
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/approve.hdr" -o /dev/null \
            --data-urlencode "csrf@${CSRF}" --data-urlencode "campaign_id=${CAMPAIGN_ID}" \
            --data-urlencode "id=${ITEM_ID}" --data-urlencode "title=Launch post" \
            --data-urlencode "body=A scheduled social post." --data-urlencode "item_date=2026-10-12" \
            --data-urlencode "planner_status=scheduled" --data-urlencode "approval_status=approved" \
            "$BASE/app/content/save.php"
          expect_redirect "$WORK/approve.hdr"
          echo "APPROVAL=yes"
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/var.hdr" -o /dev/null \
            --data-urlencode "csrf@${CSRF}" --data-urlencode "campaign_id=${CAMPAIGN_ID}" \
            "$BASE/app/content/variation-save.php"
          expect_redirect "$WORK/var.hdr"
          echo "VARIATION_SAVE=yes"
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/brand.html" "$BASE/brand.php"
          extract_csrf "$WORK/brand.html" csrf
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/brand.hdr" -o /dev/null \
            -F "csrf=<${CSRF}" -F "brand_name=RATEB" -F "tone=Clear and direct" \
            -F "contact=hello@rateb.sa" -F "preferred_language=ar" -F "primary_color=#0f766e" \
            -F "secondary_color=#111827" -F "logo=@${WORK}/tiny.png;type=image/png;filename=logo.png" \
            "$BASE/app/brand/save.php"
          grep -q 'brand.php?saved=1' "$WORK/brand.hdr"
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/brand.html" "$BASE/brand.php"
          extract_csrf "$WORK/brand.html" csrf
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/brand2.hdr" -o /dev/null \
            --data-urlencode "csrf@${CSRF}" --data-urlencode "brand_name=RATEB" \
            --data-urlencode "tone=Warm and concise" --data-urlencode "contact=hello@rateb.sa" \
            --data-urlencode "preferred_language=en" --data-urlencode "primary_color=#0f766e" \
            --data-urlencode "secondary_color=#111827" "$BASE/app/brand/save.php"
          grep -q 'brand.php?saved=1' "$WORK/brand2.hdr"
          echo "BRAND=yes"
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/campaign.html" "$BASE/campaign.php?id=${CAMPAIGN_ID}"
          extract_csrf "$WORK/campaign.html" csrf
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/ready.hdr" -o /dev/null \
            --data-urlencode "csrf@${CSRF}" --data-urlencode "campaign_id=${CAMPAIGN_ID}" \
            --data-urlencode "title=Smoke campaign" --data-urlencode "product_name=RATEB AI Campaign" \
            --data-urlencode "description=A short production check." --data-urlencode "price=100" \
            --data-urlencode "target_customer=Small business owners" --data-urlencode "objective=Increase trial signups" \
            --data-urlencode "budget=2500" --data-urlencode "start_date=2026-10-10" --data-urlencode "end_date=2026-10-20" \
            --data-urlencode "status=ready" "$BASE/campaign-update.php"
          expect_redirect "$WORK/ready.hdr"
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/done.hdr" -o /dev/null \
            --data-urlencode "csrf@${CSRF}" --data-urlencode "campaign_id=${CAMPAIGN_ID}" \
            --data-urlencode "title=Smoke campaign" --data-urlencode "product_name=RATEB AI Campaign" \
            --data-urlencode "description=A short production check." --data-urlencode "price=100" \
            --data-urlencode "target_customer=Small business owners" --data-urlencode "objective=Increase trial signups" \
            --data-urlencode "budget=2500" --data-urlencode "start_date=2026-10-10" --data-urlencode "end_date=2026-10-20" \
            --data-urlencode "status=completed" "$BASE/campaign-update.php"
          expect_redirect "$WORK/done.hdr"
          COOKIE_B="$WORK/cookies-b"
          curl -sS -c "$COOKIE_B" -b "$COOKIE_B" -o "$WORK/register-b.html" "$BASE/register.php"
          extract_csrf "$WORK/register-b.html" csrf_token
          curl -sS -c "$COOKIE_B" -b "$COOKIE_B" -D "$WORK/register-b.hdr" -o /dev/null \
            --data-urlencode "csrf_token@${CSRF}" --data-urlencode "name=Other User" \
            --data-urlencode "email@${WORK}/email-b" --data-urlencode "password@${WORK}/password" \
            "$BASE/register.php"
          grep -qi 'dashboard.php' "$WORK/register-b.hdr"
          code=$(curl -sS -c "$COOKIE_B" -b "$COOKIE_B" -o /dev/null -w '%{http_code}' "$BASE/campaign.php?id=${CAMPAIGN_ID}")
          echo "FOREIGN_CAMPAIGN_HTTP=${code}"
          test "$code" = "404"
          curl -sS -c "$COOKIE_B" -b "$COOKIE_B" -o "$WORK/new-b.html" "$BASE/campaign-new.php"
          extract_csrf "$WORK/new-b.html" csrf
          code=$(curl -sS -c "$COOKIE_B" -b "$COOKIE_B" -o /dev/null -w '%{http_code}' \
            --data-urlencode "csrf@${CSRF}" --data-urlencode "campaign_id=${CAMPAIGN_ID}" \
            --data-urlencode "title=Stolen" --data-urlencode "product_name=Stolen" \
            --data-urlencode "description=Stolen" --data-urlencode "target_customer=Stolen" \
            --data-urlencode "status=completed" "$BASE/campaign-update.php")
          echo "FOREIGN_UPDATE_HTTP=${code}"
          test "$code" = "404"
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/dash.html" "$BASE/dashboard.php"
          grep -q 'Smoke campaign' "$WORK/dash.html"
          echo "DASHBOARD_LIST=yes"
          curl -sS -o "$WORK/app.js" "$BASE/public/assets/js/app.js"
          grep -q 'rateb-theme' "$WORK/app.js"
          grep -q 'نظرة عامة' "$WORK/app.js"
          grep -q "tab_overview: 'Overview'" "$WORK/app.js"
          echo "I18N_THEME=yes"
          "${SSH[@]}" "${REMOTE}" "export CAMPAIGN_ID=${CAMPAIGN_ID}; php" << 'PHP'
          <?php
          require '/home/admin/domains/ai.rateb.sa/app/bootstrap.php';
          $id = (int) getenv('CAMPAIGN_ID');
          $stmt = db()->prepare('SELECT status FROM campaigns WHERE id=?');
          $stmt->execute([$id]);
          $status = (string) $stmt->fetchColumn();
          echo 'STATUS_FINAL=' . $status . "\n";
          $item = db()->prepare('SELECT approval_status, planner_status FROM campaign_items WHERE campaign_id=?');
          $item->execute([$id]);
          $row = $item->fetch();
          echo 'ITEM=' . ($row['planner_status'] ?? '') . '/' . ($row['approval_status'] ?? '') . "\n";
