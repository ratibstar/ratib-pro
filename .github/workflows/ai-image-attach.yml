name: AI image attach

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: rateb.sa
    timeout-minutes: 15
    env:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v5
      - name: Upload and test image preview and attach
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import os
          from pathlib import Path
          key = os.environ.get("DEPLOY_SSH_PRIVATE_KEY", "")
          if "-----BEGIN" not in key:
              raise SystemExit("SSH key missing")
          if "\\n" in key and "\n" not in key.split("-----BEGIN", 1)[1][:30]:
              key = key.replace("\\n", "\n")
          path = Path.home() / ".ssh"
          path.mkdir(mode=0o700, exist_ok=True)
          file = path / "ai_key"
          file.write_text(key if key.endswith("\n") else key + "\n", encoding="utf-8")
          file.chmod(0o600)
          PY
          HOST="$DEPLOY_SSH_HOST"
          USER="$DEPLOY_SSH_USER"
          PORT="$DEPLOY_SSH_PORT"
          ROOT=/home/admin/domains/ai.rateb.sa
          for file in campaign.php app/media/library.php public/assets/js/app.js public/assets/css/app.css; do
            scp -i "$HOME/.ssh/ai_key" -P "$PORT" -o StrictHostKeyChecking=accept-new "ai-rateb-sa-source/$file" "$USER@$HOST:$ROOT/$file"
          done
          ssh -i "$HOME/.ssh/ai_key" -p "$PORT" -o StrictHostKeyChecking=accept-new "$USER@$HOST" "php -l $ROOT/campaign.php && php -l $ROOT/app/media/library.php"
          TOKEN=$(python3 -c 'import secrets; print(secrets.token_hex(6))')
          ssh -i "$HOME/.ssh/ai_key" -p "$PORT" -o StrictHostKeyChecking=accept-new "$USER@$HOST" "cat > $ROOT/oc-$TOKEN.php" << 'PHP'
          <?php
          foreach (['/campaign.php', '/app/media/library.php'] as $file) {
              if (function_exists('opcache_invalidate')) opcache_invalidate(__DIR__ . $file, true);
          }
          echo 'OPCACHE=ok';
          PHP
          curl -fsS "https://ai.rateb.sa/oc-$TOKEN.php"; echo
          ssh -i "$HOME/.ssh/ai_key" -p "$PORT" -o StrictHostKeyChecking=accept-new "$USER@$HOST" "rm -f $ROOT/oc-$TOKEN.php"
          python3 - << 'PY'
          import base64, http.cookiejar, re, secrets, urllib.parse, urllib.request
          base = "https://ai.rateb.sa"
          email = "img4-" + secrets.token_hex(4) + "@example.com"
          password = secrets.token_urlsafe(18)
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          plain = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar), NoRedirect)
          def request(url, data=None, timeout=60, follow=True):
              req = urllib.request.Request(url, data=data)
              tool = opener if follow else plain
              try:
                  with tool.open(req, timeout=timeout) as response:
                      return response.status, response.geturl(), response.read(), response.headers
              except urllib.error.HTTPError as error:
                  return error.code, error.headers.get("Location", error.geturl()), error.read(), error.headers
          def csrf(html, field):
              match = re.search(r'name="' + re.escape(field) + r'" value="([a-f0-9]+)"', html)
              if not match:
                  raise RuntimeError("missing token")
              return match.group(1)
          def form(pairs):
              return urllib.parse.urlencode(pairs).encode()
          code, url, body, headers = request(base + "/register.php")
          html = body.decode("utf-8", "replace")
          request(base + "/register.php", form({"csrf_token": csrf(html, "csrf_token"), "name": "Attach", "email": email, "password": password}))
          jar.set_cookie(http.cookiejar.Cookie(0, "rateb_ui_lang", "ar", None, False, "ai.rateb.sa", True, False, "/", True, True, None, False, None, None, {}))
          def post_new(fields):
              code, url, body, headers = request(base + "/campaign-new.php")
              html = body.decode("utf-8", "replace")
              code, url, body, headers = request(base + "/campaign-new.php", form({"csrf": csrf(html, "csrf"), **fields}))
              return code, url, body.decode("utf-8", "replace")
          post_new({"step": "understand", "idea": "عندي عطر جديد وأبغى أطلقه في الرياض وأزيد مبيعات الواتساب.", "campaign_language": "ar"})
          code, url, html = post_new({"step": "continue"})
          steps = 0
          while "view=ask" in url and steps < 4:
              answer = "النساء" if "مين تبي" in html else ""
              code, url, html = post_new({"step": "answer", "answer": answer})
              steps += 1
          code, url, body, headers = request(base + "/campaign-new.php", form({"csrf": csrf(html, "csrf"), "step": "confirm"}))
          match = re.search(r"id=(\d+)", url)
          campaign_id = match.group(1) if match else ""
          open("/tmp/idea-flow-email", "w").write(email)
          def page():
              code, url, body, headers = request(base + "/campaign.php?id=" + campaign_id)
              return body.decode("utf-8", "replace")
          def generate(stage):
              html = page()
              request(base + "/app/ai/generate.php", form({"csrf": csrf(html, "csrf"), "campaign_id": campaign_id, "stage": stage}), 50)
          generate("strategy")
          html = page()
          request(base + "/app/content/approve.php", form({"csrf": csrf(html, "csrf"), "campaign_id": campaign_id, "kind": "strategy"}))
          generate("copy")
          html = page()
          output = re.search(r'name="output_id" value="(\d+)"', html)
          request(base + "/app/content/approve.php", form({"csrf": csrf(html, "csrf"), "campaign_id": campaign_id, "output_id": output.group(1) if output else "0"}))
          html = page()
          attach_form = 'name="file"' in html and "أرفق الصورة" in html and 'id="demo-viewer"' in html
          print("ATTACH_FORM=" + ("PASS" if attach_form else "FAIL"), flush=True)
          jpeg = base64.b64decode("")
          boundary = "----rateb" + secrets.token_hex(8)
          token = csrf(html, "csrf")
          parts = []
          for name, value in (("csrf", token), ("campaign_id", campaign_id), ("kind", "image"), ("panel", "images")):
              parts.append(("--" + boundary + "\r\nContent-Disposition: form-data; name=\"" + name + "\"\r\n\r\n" + value + "\r\n").encode())
          parts.append(("--" + boundary + "\r\nContent-Disposition: form-data; name=\"file\"; filename=\"photo.jpg\"\r\nContent-Type: image/jpeg\r\n\r\n").encode() + jpeg + b"\r\n")
          parts.append(("--" + boundary + "--\r\n").encode())
          code, url, body, headers = request(base + "/app/media/upload.php", b"".join(parts), follow=False)
          location = headers.get("Location", "") if headers else ""
          code2, url2, body2, headers2 = request(base + location if location.startswith("http") else base + location)
          page_html = body2.decode("utf-8", "replace")
          shown = code in (302, 303) and "#images" in location and "image-preview" in page_html and "file.php?id=" in page_html
          print("ATTACH_SAVED=" + ("PASS" if shown else "FAIL " + str(code) + " " + location), flush=True)
          print("FLOW=" + ("PASS" if attach_form and shown else "FAIL"))
          raise SystemExit(0 if attach_form and shown else 1)
          PY
      - name: Clean the test account
        if: always()
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import os
          from pathlib import Path
          key = os.environ.get("DEPLOY_SSH_PRIVATE_KEY", "")
          if "-----BEGIN" not in key:
              raise SystemExit(0)
          if "\\n" in key and "\n" not in key.split("-----BEGIN", 1)[1][:30]:
              key = key.replace("\\n", "\n")
          path = Path.home() / ".ssh"
          path.mkdir(mode=0o700, exist_ok=True)
          file = path / "ai_key"
          file.write_text(key if key.endswith("\n") else key + "\n", encoding="utf-8")
          file.chmod(0o600)
          PY
          if [ -f /tmp/idea-flow-email ]; then
            scp -i "$HOME/.ssh/ai_key" -P "$DEPLOY_SSH_PORT" -o StrictHostKeyChecking=accept-new /tmp/idea-flow-email "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:/tmp/idea-flow-email"
          fi
          ssh -i "$HOME/.ssh/ai_key" -p "$DEPLOY_SSH_PORT" -o StrictHostKeyChecking=accept-new "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" "cat > /tmp/idea-flow-check.php" << 'PHP'
          <?php
          $root = '/home/admin/domains/ai.rateb.sa';
          $ini = file_get_contents($root . '/.user.ini');
          if (!preg_match('/auto_prepend_file\s*=\s*"?([^"\r\n]+)/', $ini, $match)) exit(0);
          require trim($match[1], " \"'");
          require $root . '/config/bootstrap.php';
          if (!is_file('/tmp/idea-flow-email')) { echo "CLEANUP=skipped\n"; exit(0); }
          $email = trim(file_get_contents('/tmp/idea-flow-email'));
          $user = $pdo->prepare('SELECT id FROM users WHERE email = ?');
          $user->execute([$email]);
          $id = (int) $user->fetchColumn();
          if ($id > 0) {
              $campaigns = $pdo->prepare('SELECT id FROM campaigns WHERE user_id = ?');
              $campaigns->execute([$id]);
              foreach ($campaigns->fetchAll() as $campaign) {
                  $campaignId = (int) $campaign['id'];
                  $files = $pdo->prepare('SELECT stored_name FROM campaign_media WHERE campaign_id = ?');
                  $files->execute([$campaignId]);
                  foreach ($files as $file) {
                      $path = '/home/admin/.campaign-media/' . $campaignId . '/' . $file['stored_name'];
                      if (is_file($path)) unlink($path);
                  }
                  foreach (['campaign_media','campaign_outputs','campaign_items','campaign_variations','campaign_briefs'] as $table) {
                      $pdo->prepare("DELETE FROM {$table} WHERE campaign_id = ?")->execute([$campaignId]);
                  }
                  $pdo->prepare('DELETE FROM campaigns WHERE id = ? AND user_id = ?')->execute([$campaignId, $id]);
              }
              $pdo->prepare('DELETE FROM usage_events WHERE user_id = ?')->execute([$id]);
              $pdo->prepare('DELETE FROM subscriptions WHERE user_id = ?')->execute([$id]);
              $pdo->prepare('DELETE FROM users WHERE id = ?')->execute([$id]);
          }
          echo "CLEANUP=ok\n";
          PHP
          ssh -i "$HOME/.ssh/ai_key" -p "$DEPLOY_SSH_PORT" -o StrictHostKeyChecking=accept-new "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" "php /tmp/idea-flow-check.php; rm -f /tmp/idea-flow-check.php /tmp/idea-flow-email"
