name: Temporary professional demo check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: rateb.sa
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy professional examples
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/rateb-readonly-key"
          export KEY_PATH
          python3 - << 'PY'
          import os, stat
          key = (os.environ.get("DEPLOY_SSH_PRIVATE_KEY") or "").strip()
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")
          path = os.environ["KEY_PATH"]
          with open(path, "w", encoding="utf-8", newline="\n") as handle:
              handle.write(key)
              if not key.endswith("\n"):
                  handle.write("\n")
          os.chmod(path, stat.S_IRUSR | stat.S_IWUSR)
          PY
          PORT="${DEPLOY_SSH_PORT:-22}"
          REMOTE="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          SSH=(ssh -i "${KEY_PATH}" -p "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          SCP=(scp -i "${KEY_PATH}" -P "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          ROOT=/home/admin/domains/ai.rateb.sa
          BASE=https://ai.rateb.sa
          "${SSH[@]}" "${REMOTE}" "mkdir -p ${ROOT}/public/assets/demo"
          "${SCP[@]}" ai-rateb-sa-source/index.php "${REMOTE}:${ROOT}/index.php"
          "${SCP[@]}" ai-rateb-sa-source/dashboard.php "${REMOTE}:${ROOT}/dashboard.php"
          "${SCP[@]}" ai-rateb-sa-source/public/assets/css/app.css "${REMOTE}:${ROOT}/public/assets/css/app.css"
          "${SCP[@]}" ai-rateb-sa-source/public/assets/js/app.js "${REMOTE}:${ROOT}/public/assets/js/app.js"
          "${SCP[@]}" ai-rateb-sa-source/public/assets/demo/demo-perfume.jpg ai-rateb-sa-source/public/assets/demo/demo-hospitality.jpg ai-rateb-sa-source/public/assets/demo/demo-evening.jpg ai-rateb-sa-source/public/assets/demo/demo-story.jpg ai-rateb-sa-source/public/assets/demo/demo-social.jpg ai-rateb-sa-source/public/assets/demo/demo-campaign.jpg ai-rateb-sa-source/public/assets/demo/voice-calm.mp3 ai-rateb-sa-source/public/assets/demo/voice-warm.mp3 ai-rateb-sa-source/public/assets/demo/voice-clear.mp3 ai-rateb-sa-source/public/assets/demo/voice-deep.mp3 ai-rateb-sa-source/public/assets/demo/reel-product.mp4 ai-rateb-sa-source/public/assets/demo/reel-social.mp4 ai-rateb-sa-source/public/assets/demo/reel-story.mp4 "${REMOTE}:${ROOT}/public/assets/demo/"
          "${SSH[@]}" "${REMOTE}" "php -l ${ROOT}/index.php && php -l ${ROOT}/dashboard.php"
          WORK="${RUNNER_TEMP}/pro"
          mkdir -p "$WORK"
          printf '%s\n' '<?php foreach (["index.php","dashboard.php"] as $file) { $path="/home/admin/domains/ai.rateb.sa/".$file; echo basename($file)."=".(function_exists("opcache_invalidate") && opcache_invalidate($path, true) ? "yes" : "no").PHP_EOL; }' > "$WORK/refresh.php"
          "${SCP[@]}" "$WORK/refresh.php" "${REMOTE}:${ROOT}/pro-refresh.php"
          curl -sS "$BASE/pro-refresh.php" || true
          echo
          "${SSH[@]}" "${REMOTE}" "rm -f ${ROOT}/pro-refresh.php"
          code=$(curl -sS -o "$WORK/home.html" -w '%{http_code}' "$BASE/")
          echo "HOME_HTTP=${code}"
          test "$code" = "200"
          grep -q 'id="samples"' "$WORK/home.html"
          grep -q 'voice-deep.mp3' "$WORK/home.html"
          grep -q 'reel-story.mp4' "$WORK/home.html"
          grep -q 'demo-perfume.jpg' "$WORK/home.html"
          echo "HOME_SAMPLES=yes"
          for asset in demo-perfume.jpg demo-hospitality.jpg demo-evening.jpg demo-story.jpg demo-social.jpg demo-campaign.jpg voice-calm.mp3 voice-warm.mp3 voice-clear.mp3 voice-deep.mp3 reel-product.mp4 reel-social.mp4 reel-story.mp4; do
            asset_code=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/public/assets/demo/${asset}")
            echo "ASSET_${asset}=${asset_code}"
            test "$asset_code" = "200"
          done
          echo "PRO_DEMO=pass"
          rm -f "${KEY_PATH}"
