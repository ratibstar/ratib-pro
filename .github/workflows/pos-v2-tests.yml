name: POS V2 Tests

on:
  push:
    paths:
      - 'rateb-erp/modules/pos/**'
      - 'rateb-erp/app/Core/**'
      - 'rateb-erp/migrations/**'
      - '.github/workflows/pos-v2-tests.yml'
  pull_request:
    paths:
      - 'rateb-erp/modules/pos/**'
      - 'rateb-erp/app/Core/**'
      - 'rateb-erp/migrations/**'
      - '.github/workflows/pos-v2-tests.yml'
  workflow_dispatch:

jobs:
  pos-v2-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rateb_erp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      RATEB_ERP_DB_NAME: rateb_erp_test
      RATEB_ERP_DB_HOST: 127.0.0.1
      RATEB_ERP_DB_USER: root
      RATEB_ERP_DB_PASS: root
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: root
      POS_V2_INTEGRATION_SEED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, json

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo "MySQL is up"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time"
          exit 1

      - name: Run ERP migrations
        id: migrations
        continue-on-error: true
        working-directory: rateb-erp
        run: |
          set -o pipefail
          php -r "if (!defined('RATEB_ERP_DB_HOST')) define('RATEB_ERP_DB_HOST', getenv('RATEB_ERP_DB_HOST') ?: '127.0.0.1'); if (!defined('RATEB_ERP_DB_USER')) define('RATEB_ERP_DB_USER', getenv('RATEB_ERP_DB_USER') ?: 'root'); if (!defined('RATEB_ERP_DB_PASS')) define('RATEB_ERP_DB_PASS', getenv('RATEB_ERP_DB_PASS') ?: 'root'); require 'migrations/run.php';" 2>&1 | tee "$GITHUB_WORKSPACE/migration-ci.log"

      - name: Upload migration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-v2-migration-log
          path: migration-ci.log
          if-no-files-found: ignore

      - name: Require migrations success
        if: steps.migrations.outcome != 'success'
        run: exit 1

      - name: Run all POS V2 test runners
        working-directory: rateb-erp
        run: php modules/pos/tests/run-all-pos-v2-tests.php

      - name: Upload POS sync simulation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-sync-simulation-report
          path: rateb-erp/modules/pos/tests/reports/pos-sync-simulation-latest.json
          if-no-files-found: ignore

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-v2-benchmark-report
          path: rateb-erp/modules/pos/tests/reports/benchmark-latest.json
          if-no-files-found: ignore
