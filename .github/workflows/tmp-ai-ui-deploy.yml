name: Temporary campaign UI smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    environment: rateb.sa
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Publish UI polish and smoke-test pages
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/rateb-readonly-key"
          export KEY_PATH
          python3 - << 'PY'
          import os, stat
          key = (os.environ.get("DEPLOY_SSH_PRIVATE_KEY") or "").strip()
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")
          path = os.environ["KEY_PATH"]
          with open(path, "w", encoding="utf-8", newline="\n") as handle:
              handle.write(key)
              if not key.endswith("\n"):
                  handle.write("\n")
          os.chmod(path, stat.S_IRUSR | stat.S_IWUSR)
          PY
          PORT="${DEPLOY_SSH_PORT:-22}"
          REMOTE="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          SSH=(ssh -i "${KEY_PATH}" -p "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          ROOT=/home/admin/domains/ai.rateb.sa
          "${SSH[@]}" "${REMOTE}" "sha256sum ${ROOT}/config/ai.php ${ROOT}/app/ai/generate.php ${ROOT}/app/ai/voice.php ${ROOT}/app/ai/image.php > /tmp/ui-before.txt"
          scp -i "${KEY_PATH}" -P "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            ai-rateb-sa-source/campaign.php \
            ai-rateb-sa-source/dashboard.php \
            ai-rateb-sa-source/campaign-new.php \
            ai-rateb-sa-source/public/assets/js/app.js \
            ai-rateb-sa-source/public/assets/css/app.css \
            "${REMOTE}:/tmp/"
          "${SSH[@]}" "${REMOTE}" "mv /tmp/campaign.php ${ROOT}/campaign.php && mv /tmp/dashboard.php ${ROOT}/dashboard.php && mv /tmp/campaign-new.php ${ROOT}/campaign-new.php && mv /tmp/app.js ${ROOT}/public/assets/js/app.js && mv /tmp/app.css ${ROOT}/public/assets/css/app.css && php -l ${ROOT}/campaign.php && sha256sum ${ROOT}/config/ai.php ${ROOT}/app/ai/generate.php ${ROOT}/app/ai/voice.php ${ROOT}/app/ai/image.php > /tmp/ui-after.txt && cmp /tmp/ui-before.txt /tmp/ui-after.txt && echo PROTECTED_UNCHANGED=yes"
          TOKEN=$(openssl rand -hex 16)
          "${SSH[@]}" "${REMOTE}" "cat > ${ROOT}/.ai-refresh-${TOKEN}.php" << EOF
          <?php
          if ((\$_GET['t'] ?? '') !== '${TOKEN}') { http_response_code(404); exit; }
          header('Content-Type: text/plain; charset=UTF-8');
          foreach (['campaign.php','dashboard.php','campaign-new.php'] as \$name) {
            echo \$name . '=' . (function_exists('opcache_invalidate') && opcache_invalidate('${ROOT}/' . \$name, true) ? 'yes' : 'no') . "\\n";
          }
          EOF
          curl -fsS "https://ai.rateb.sa/.ai-refresh-${TOKEN}.php?t=${TOKEN}"
          echo
          "${SSH[@]}" "${REMOTE}" "rm -f ${ROOT}/.ai-refresh-${TOKEN}.php"
          WORK="${RUNNER_TEMP}/ui"
          mkdir -p "$WORK"
          python3 - << 'PY'
          import os, pathlib, secrets
          work = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ui"
          (work / "email").write_text("ai-ui-" + secrets.token_hex(4) + "@rateb.sa", encoding="utf-8")
          (work / "password").write_text(secrets.token_urlsafe(18), encoding="utf-8")
          os.chmod(work / "password", 0o600)
          PY
          BASE=https://ai.rateb.sa
          COOKIE="$WORK/cookies"
          CSRF="$WORK/csrf"
          extract_csrf() {
            python3 - "$1" "$2" "$CSRF" << 'PY'
          import re, sys
          html = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          match = re.search(r'name="' + re.escape(sys.argv[2]) + r'" value="([^"]+)"', html)
          if not match:
              raise SystemExit("csrf missing")
          open(sys.argv[3], "w", encoding="utf-8").write(match.group(1))
          PY
          }
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/register.html" "$BASE/register.php"
          extract_csrf "$WORK/register.html" csrf_token
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/register.hdr" -o /dev/null \
            --data-urlencode "csrf_token@${CSRF}" --data-urlencode "name=UI Check" \
            --data-urlencode "email@${WORK}/email" --data-urlencode "password@${WORK}/password" \
            "$BASE/register.php"
          grep -qi 'dashboard.php' "$WORK/register.hdr"
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/dash.html" "$BASE/dashboard.php"
          grep -q 'dash-kpis' "$WORK/dash.html"
          grep -q 'status-draft' "$WORK/dash.html"
          echo "DASHBOARD_UI=yes"
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/new.html" "$BASE/campaign-new.php"
          grep -q 'form-section' "$WORK/new.html"
          grep -q 'name="objective"' "$WORK/new.html"
          grep -q 'name="status"' "$WORK/new.html"
          echo "NEW_CAMPAIGN_UI=yes"
          extract_csrf "$WORK/new.html" csrf
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/save.hdr" -o /dev/null \
            --data-urlencode "csrf@${CSRF}" --data-urlencode "title=UI check" \
            --data-urlencode "product_name=RATEB AI Campaign" --data-urlencode "description=A short production check." \
            --data-urlencode "price=100" --data-urlencode "target_customer=Small business owners" \
            --data-urlencode "status=draft" "$BASE/campaign-save.php"
          CAMPAIGN_ID=$(python3 - "$WORK/save.hdr" << 'PY'
          import re, sys
          match = re.search(r'campaign\.php\?id=(\d+)', open(sys.argv[1], encoding='utf-8', errors='replace').read())
          print(match.group(1) if match else "")
          PY
          )
          test -n "$CAMPAIGN_ID"
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/campaign.html" "$BASE/campaign.php?id=${CAMPAIGN_ID}"
          for token in 'data-tab="overview"' 'data-tab="ai"' 'data-tab="media"' 'data-tab="planner"' 'data-tab="variations"' 'data-tab="brand"' 'id="generateForm"' 'id="generate-image"' 'id="voice"' 'id="variationForm"' 'id="media"' 'kpi-grid' 'class="progress"'; do
            grep -q "$token" "$WORK/campaign.html"
          done
          echo "CAMPAIGN_UI=yes"
          curl -sS -o "$WORK/app.js" "$BASE/public/assets/js/app.js"
          grep -q 'initTabs' "$WORK/app.js"
          grep -q 'نظرة عامة' "$WORK/app.js"
          grep -q 'rateb-theme' "$WORK/app.js"
          echo "I18N_THEME=yes"
          curl -sS -o "$WORK/app.css" "$BASE/public/assets/css/app.css"
          grep -q 'kpi-grid' "$WORK/app.css"
          grep -q 'tabs-ready' "$WORK/app.css"
          echo "CSS_UI=yes"
          rm -f "${KEY_PATH}" "$WORK/password" "$CSRF" "$COOKIE"
