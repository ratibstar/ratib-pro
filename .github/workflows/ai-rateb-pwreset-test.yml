name: ai password reset test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: rateb.sa
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Upload and test password reset
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH_HOST:-}" ] || [ -z "${DEPLOY_SSH_USER:-}" ] || [ -z "${DEPLOY_SSH_PRIVATE_KEY:-}" ]; then
            echo "SSH_SECRETS=missing"
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          KEY="$RUNNER_TEMP/sshkey"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$KEY"
          if ! grep -q "BEGIN" "$KEY"; then
            printf '%b\n' "${DEPLOY_SSH_PRIVATE_KEY//\\n/$'\n'}" > "$KEY"
          fi
          chmod 600 "$KEY"
          ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          export SSH_KEY="$KEY"
          python3 - << 'PY'
          import os, re, secrets, subprocess, urllib.error, urllib.parse, urllib.request
          from http.cookiejar import CookieJar
          from pathlib import Path

          host = os.environ["DEPLOY_SSH_HOST"]
          user = os.environ["DEPLOY_SSH_USER"]
          port = os.environ["DEPLOY_SSH_PORT"]
          key = os.environ["SSH_KEY"]
          root = "/home/admin/domains/ai.rateb.sa"
          src = Path("ai-rateb-sa-source")
          tmp = Path(os.environ["RUNNER_TEMP"])
          remote = f"{user}@{host}"
          ssh_base = ["ssh", "-i", key, "-p", port, "-o", "StrictHostKeyChecking=accept-new", remote]
          scp_base = ["scp", "-i", key, "-P", port, "-o", "StrictHostKeyChecking=accept-new"]

          def run(cmd):
              result = subprocess.run(cmd, capture_output=True, text=True)
              if result.returncode != 0:
                  print("CMD_FAIL")
                  err = (result.stderr or result.stdout or "")[-400:]
                  print(err)
                  raise SystemExit(1)
              return result.stdout

          files = [
              "app/schema.php",
              "app/auth/reset-lib.php",
              "app/auth/forgot-password.php",
              "app/auth/reset-password.php",
              "app/auth/login.php",
              "forgot-password.php",
              "reset-password.php",
              "public/assets/js/app.js",
          ]
          for rel in files:
              run(scp_base + [str(src / rel), f"{remote}:{root}/{rel}"])
              if rel.endswith(".php"):
                  print(run(ssh_base + [f"php -l {root}/{rel}"]).strip())

          oc_name = "pwreset-oc-" + secrets.token_hex(8) + ".php"
          oc_local = tmp / oc_name
          oc_local.write_text(
              "<?php\n$files = " + repr([f"{root}/{rel}" for rel in files if rel.endswith('.php')]) + ";\n"
              "foreach ($files as $file) { opcache_invalidate($file, true); }\n"
              "echo 'OPCACHE=ok';\n",
              encoding="utf-8",
          )
          run(scp_base + [str(oc_local), f"{remote}:{root}/{oc_name}"])
          print(urllib.request.urlopen(f"https://ai.rateb.sa/{oc_name}", timeout=30).read().decode())
          run(ssh_base + [f"rm -f {root}/{oc_name}"])

          checker = tmp / "pwreset-check.php"
          checker.write_text(r'''<?php
          declare(strict_types=1);
          $root = '/home/admin/domains/ai.rateb.sa';
          $ini = (string) file_get_contents($root . '/.user.ini');
          if (!preg_match('/auto_prepend_file\s*=\s*"?([^"\r\n]+)"?/', $ini, $m)) { fwrite(STDERR, "NO_PREPEND\n"); exit(1); }
          require trim($m[1]);
          require $root . '/config/bootstrap.php';
          $action = $argv[1] ?? '';
          $email = '';
          if (($argv[2] ?? '') !== '' && is_file($argv[2])) { $email = strtolower(trim((string) file_get_contents($argv[2]))); }
          $user = $pdo->prepare('SELECT id FROM users WHERE email = ? LIMIT 1');
          $user->execute([$email]);
          $userId = (int) $user->fetchColumn();
          if ($action === 'counts') {
              $unknown = strtolower(trim((string) ($argv[3] ?? '')));
              $rows = $pdo->prepare('SELECT COUNT(*) FROM password_resets WHERE user_id = ?');
              $rows->execute([$userId]);
              echo 'KNOWN_ROWS=' . (int) $rows->fetchColumn() . "\n";
              $other = $pdo->prepare('SELECT COUNT(*) FROM users WHERE email = ?');
              $other->execute([$unknown]);
              echo 'UNKNOWN_USERS=' . (int) $other->fetchColumn() . "\n";
              exit(0);
          }
          if ($action === 'insert' || $action === 'hash') {
              $kind = $argv[3] ?? '';
              $tokenPath = (string) ($argv[4] ?? '');
              $token = trim((string) @file_get_contents($tokenPath));
              if (preg_match('/^[a-f0-9]{64}$/', $token) !== 1 || $userId < 1) {
                  $emailPath = (string) ($argv[2] ?? '');
                  $prefix = (int) $pdo->query("SELECT COUNT(*) FROM users WHERE email LIKE 'pwreset-%'")->fetchColumn();
                  echo 'TOKEN_BAD USER=' . $userId . ' ARGC=' . $argc . ' EMAILFILE=' . (is_file($emailPath) ? '1' : '0') . ' EMAILSIZE=' . (is_file($emailPath) ? (string) filesize($emailPath) : '0') . ' EMAILLEN=' . strlen($email) . ' PREFIX=' . $prefix . "\n";
                  exit(1);
              }
              $hash = hash('sha256', $token);
              if ($action === 'insert') {
                  $when = $kind === 'expired' ? 'DATE_SUB(NOW(), INTERVAL 5 MINUTE)' : 'DATE_ADD(NOW(), INTERVAL 60 MINUTE)';
                  $pdo->prepare("INSERT INTO password_resets (user_id, token_hash, expires_at) VALUES (?, ?, $when)")->execute([$userId, $hash]);
                  echo "INSERT_OK\n";
                  exit(0);
              }
              $stored = $pdo->prepare('SELECT token_hash FROM password_resets WHERE token_hash = ? LIMIT 1');
              $stored->execute([$hash]);
              $value = (string) $stored->fetchColumn();
              echo 'HASH_OK=' . ($value !== '' && hash_equals($value, $hash) && !hash_equals($value, $token) ? '1' : '0') . "\n";
              exit(0);
          }
          if ($action === 'used') {
              $token = trim((string) file_get_contents((string) ($argv[3] ?? '')));
              $row = $pdo->prepare('SELECT used_at IS NOT NULL FROM password_resets WHERE token_hash = ? LIMIT 1');
              $row->execute([hash('sha256', $token)]);
              echo 'USED=' . ((int) $row->fetchColumn() === 1 ? '1' : '0') . "\n";
              exit(0);
          }
          if ($action === 'cleanup') {
              if ($userId > 0) {
                  $ids = $pdo->prepare('SELECT id FROM campaigns WHERE user_id = ?');
                  $ids->execute([$userId]);
                  foreach ($ids->fetchAll(PDO::FETCH_COLUMN) as $cid) {
                      foreach (['campaign_media', 'campaign_outputs', 'campaign_items', 'campaign_variations'] as $table) {
                          $pdo->prepare("DELETE FROM {$table} WHERE campaign_id = ?")->execute([(int) $cid]);
                      }
                  }
                  $pdo->prepare('DELETE FROM campaigns WHERE user_id = ?')->execute([$userId]);
                  $pdo->prepare('DELETE FROM password_resets WHERE user_id = ?')->execute([$userId]);
                  $pdo->prepare('DELETE FROM users WHERE id = ?')->execute([$userId]);
              }
              echo "CLEANUP=ok\n";
              exit(0);
          }
          echo "BAD_ACTION\n";
          exit(1);
          ''', encoding='utf-8')
          remote_checker = "/home/admin/.secrets/pwreset-check.php"
          run(scp_base + [str(checker), f"{remote}:{remote_checker}"])
          run(ssh_base + [f"chmod 600 {remote_checker}"])

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          jar = CookieJar()
          open_follow = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          open_stop = urllib.request.build_opener(NoRedirect, urllib.request.HTTPCookieProcessor(jar))

          def call(path, data=None, follow=True):
              url = "https://ai.rateb.sa" + path
              body = None if data is None else urllib.parse.urlencode(data).encode()
              req = urllib.request.Request(url, data=body)
              opener = open_follow if follow else open_stop
              try:
                  resp = opener.open(req, timeout=40)
                  raw = resp.read().decode("utf-8", "replace")
                  return resp.status, resp.geturl(), raw, dict(resp.headers)
              except urllib.error.HTTPError as error:
                  raw = error.read().decode("utf-8", "replace")
                  return error.code, error.headers.get("Location", url), raw, dict(error.headers)

          def field(html, name):
              match = re.search(r'name="' + name + r'" value="([^"]*)"', html)
              return match.group(1) if match else ""

          def norm(html):
              return re.sub(r'name="csrf_token" value="[^"]*"', "csrf", html)

          email = "pwreset-" + secrets.token_hex(4) + "@rateb.sa"
          unknown = "missing-" + secrets.token_hex(4) + "@rateb.sa"
          old_password = secrets.token_urlsafe(12)
          new_password = secrets.token_urlsafe(12)
          valid = secrets.token_hex(32)
          expired = secrets.token_hex(32)
          invalid = secrets.token_hex(32)
          email_file = tmp / "pwreset-email.txt"
          valid_file = tmp / "pwreset-valid.txt"
          expired_file = tmp / "pwreset-expired.txt"
          email_file.write_text(email, encoding="utf-8")
          valid_file.write_text(valid, encoding="utf-8")
          expired_file.write_text(expired, encoding="utf-8")
          suffix = secrets.token_hex(4)
          remote_email = f"/home/admin/.secrets/pwreset-email-{suffix}.txt"
          remote_valid = f"/home/admin/.secrets/pwreset-valid-{suffix}.txt"
          remote_expired = f"/home/admin/.secrets/pwreset-expired-{suffix}.txt"
          failures = []

          def check(name, ok):
              print(f"{name}={'yes' if ok else 'no'}")
              if not ok:
                  failures.append(name)

          try:
              code, url, html, _ = call("/register.php")
              token = field(html, "csrf_token")
              code, url, html, _ = call("/register.php", {"csrf_token": token, "name": "Reset Test", "email": email, "password": old_password})
              check("REGISTER", code == 200 and "/dashboard.php" in url)
              call("/logout.php")
              code, url, html, _ = call("/login.php")
              check("LOGIN_FORGOT_LINK", code == 200 and 'href="/forgot-password.php"' in html and "Forgot password?" in html)
              code, url, html, _ = call("/forgot-password.php")
              check("FORGOT_PAGE", code == 200 and 'name="email"' in html and "reset-password.php" not in html)
              token = field(html, "csrf_token")
              code_a, _, body_a, _ = call("/forgot-password.php", {"csrf_token": token, "email": email})
              code_b, _, body_b, _ = call("/forgot-password.php", {"csrf_token": token, "email": unknown})
              check("SAME_RESPONSE", code_a == 200 and code_b == 200 and norm(body_a) == norm(body_b) and "reset_requested" in body_a and "reset-password.php" not in body_a and valid not in body_a)
              code, _, text, _ = call("/forgot-password.php", {"csrf_token": "0" * 64, "email": email}, follow=False)
              check("CSRF_FORGOT", code == 419 and "Invalid request." in text)
              for local, remote_path in ((email_file, remote_email), (valid_file, remote_valid), (expired_file, remote_expired)):
                  run(scp_base + [str(local), f"{remote}:{remote_path}"])
                  run(ssh_base + [f"chmod 600 {remote_path}"])
              print(run(ssh_base + [f"php {remote_checker} counts {remote_email} {unknown}"]).strip())
              counts = run(ssh_base + [f"php {remote_checker} counts {remote_email} {unknown}"])
              check("KNOWN_ROW", "KNOWN_ROWS=0" not in counts and "UNKNOWN_USERS=0" in counts)
              print(run(ssh_base + [f"php {remote_checker} insert valid {remote_email} {remote_valid}"]).strip())
              print(run(ssh_base + [f"php {remote_checker} insert expired {remote_email} {remote_expired}"]).strip())
              print(run(ssh_base + [f"php {remote_checker} hash hash {remote_email} {remote_valid}"]).strip())
              code, _, html, _ = call("/reset-password.php?token=" + invalid, follow=False)
              check("INVALID_TOKEN", code == 200 and "reset_invalid" in html and "reset=1" not in html)
              code, _, html, _ = call("/login.php")
              token = field(html, "csrf_token")
              code, location, html, _ = call("/reset-password.php", {"csrf_token": token, "token": expired, "password": new_password}, follow=False)
              check("EXPIRED_TOKEN", code == 200 and "reset_invalid" in html and "reset=1" not in location)
              code, _, html, _ = call("/reset-password.php?token=" + valid)
              token = field(html, "csrf_token")
              check("VALID_FORM", code == 200 and 'name="token"' in html and "reset_invalid" not in html)
              code, location, html, _ = call("/reset-password.php", {"csrf_token": "0" * 64, "token": valid, "password": new_password}, follow=False)
              check("CSRF_RESET", code == 419 and "Invalid request." in html)
              code, _, html, _ = call("/reset-password.php?token=" + valid)
              token = field(html, "csrf_token")
              code, location, html, _ = call("/reset-password.php", {"csrf_token": token, "token": valid, "password": new_password}, follow=False)
              check("VALID_RESET", code == 302 and "/login.php?reset=1" in location)
              code, url, html, _ = call("/login.php?reset=1")
              check("RESET_MESSAGE", code == 200 and "reset_success" in html)
              code, _, html, _ = call("/login.php")
              token = field(html, "csrf_token")
              code, location, html, _ = call("/reset-password.php", {"csrf_token": token, "token": valid, "password": secrets.token_urlsafe(12)}, follow=False)
              check("REUSE", code == 200 and "reset_invalid" in html and "reset=1" not in location)
              print(run(ssh_base + [f"php {remote_checker} used {remote_email} {remote_valid}"]).strip())
              code, _, html, _ = call("/login.php")
              token = field(html, "csrf_token")
              code, location, html, _ = call("/login.php", {"csrf_token": token, "email": email, "password": old_password}, follow=False)
              check("OLD_PASSWORD", code == 200 and "invalid_login" in html and "dashboard.php" not in location)
              code, _, html, _ = call("/login.php")
              token = field(html, "csrf_token")
              code, url, html, _ = call("/login.php", {"csrf_token": token, "email": email, "password": new_password})
              check("NEW_PASSWORD", code == 200 and "/dashboard.php" in url)
              code, url, html, _ = call("/dashboard.php")
              check("DASHBOARD", code == 200 and "/dashboard.php" in url and "campaign-new.php" in html)
              code, _, html, _ = call("/campaign-new.php")
              csrf = field(html, "csrf")
              code, location, html, _ = call("/campaign-save.php", {"csrf": csrf, "title": "Reset check", "product_name": "Sample", "description": "Password reset regression", "status": "draft"}, follow=False)
              check("CAMPAIGN_SAVE", code == 302 and "/campaign.php?id=" in location)
              code, url, html, _ = call(location if location.startswith("/") else "/campaign.php")
              check("CAMPAIGN_PAGE", code == 200 and "Reset check" in html)
          finally:
              print(run(ssh_base + [f"php {remote_checker} cleanup {remote_email}"]).strip())
              run(ssh_base + [f"rm -f {remote_checker} {remote_email} {remote_valid} {remote_expired}"])
              for path in (email_file, valid_file, expired_file, oc_local, checker):
                  path.unlink(missing_ok=True)
          if failures:
              print("FAILURES=" + ",".join(failures))
              raise SystemExit(1)
          print("PASSWORD_RESET_TEST=pass")
          PY
