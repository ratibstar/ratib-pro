name: Temporary deploy ai.rateb.sa verified files

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: rateb.sa
    timeout-minutes: 20
    steps:
      - name: Checkout payload
        uses: actions/checkout@v5

      - name: Deploy verified files only
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH_HOST}" ] || [ -z "${DEPLOY_SSH_USER}" ] || [ -z "${DEPLOY_SSH_PRIVATE_KEY}" ]; then
            echo "::error::SSH secret is missing"
            exit 1
          fi
          test -f tmp-ai-rateb-deploy/index.php
          test -f tmp-ai-rateb-deploy/config/session.php
          test -f tmp-ai-rateb-deploy/config/guard.php
          test ! -e tmp-ai-rateb-deploy/config/database.php
          test ! -e tmp-ai-rateb-deploy/config/ai.php
          test ! -e tmp-ai-rateb-deploy/test.html
          test ! -e tmp-ai-rateb-deploy/db-test.php
          KEY_PATH="${RUNNER_TEMP}/rateb-readonly-key"
          export KEY_PATH
          python3 - << 'PY'
          import os, stat
          key = (os.environ.get("DEPLOY_SSH_PRIVATE_KEY") or os.environ.get("SSH_PRIVATE_KEY") or "").strip()
          if not key:
              raise SystemExit("SSH private key secret is missing")
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")
          path = os.environ["KEY_PATH"]
          with open(path, "w", encoding="utf-8", newline="\n") as handle:
              handle.write(key)
              if not key.endswith("\n"):
                  handle.write("\n")
          os.chmod(path, stat.S_IRUSR | stat.S_IWUSR)
          PY
          cleanup() { rm -f "${KEY_PATH}"; }
          trap cleanup EXIT
          PORT="${DEPLOY_SSH_PORT:-22}"
          SSH_OPTS="ssh -i ${KEY_PATH} -p ${PORT} -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          REMOTE="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          REPORT="${GITHUB_WORKSPACE}/ai-rateb-deploy-report.txt"
          ssh -i "${KEY_PATH}" -p "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new "${REMOTE}" bash -s > "${REPORT}" << 'BASH'
          set -euo pipefail
          TARGET=/home/admin/domains/ai.rateb.sa
          if [ ! -d "$TARGET" ] || [ -L "$TARGET" ]; then
            echo "TARGET_KIND=NOT_A_DIRECTORY"
            exit 2
          fi
          RESOLVED=$(readlink -f "$TARGET")
          echo "TARGET_RESOLVED=$RESOLVED"
          if [ "$RESOLVED" != "$TARGET" ]; then
            echo "TARGET_MISMATCH=yes"
            exit 3
          fi
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          BACKUP="/home/admin/domains/ai.rateb.sa-file-backup-${STAMP}"
          mkdir "$BACKUP"
          echo "BACKUP=$BACKUP"
          cd "$TARGET"
          DB_BEFORE=$(sha256sum config/database.php | awk '{print $1}')
          AI_BEFORE=$(sha256sum config/ai.php | awk '{print $1}')
          HTML_BEFORE=$(sha256sum test.html | awk '{print $1}')
          echo "DATABASE_HASH_BEFORE=$DB_BEFORE"
          echo "AI_HASH_BEFORE=$AI_BEFORE"
          echo "TEST_HTML_HASH_BEFORE=$HTML_BEFORE"
          for f in \
            config/bootstrap.php app/bootstrap.php index.php dashboard.php \
            campaign-new.php campaign.php app/ai/generate.php \
            app/auth/login.php app/auth/register.php app/auth/logout.php \
            public/assets/css/theme.css public/assets/css/app.css public/assets/js/app.js \
            assets/app.css
          do
            if [ -f "$f" ]; then
              mkdir -p "$BACKUP/$(dirname "$f")"
              cp -a "$f" "$BACKUP/$f"
              echo "BACKED_UP $f"
            else
              echo "NO_BACKUP_NEW $f"
            fi
          done
          BASH
          find tmp-ai-rateb-deploy -type f | sed 's|^tmp-ai-rateb-deploy/||' > "${RUNNER_TEMP}/ai-rateb-files.txt"
          test "$(wc -l < "${RUNNER_TEMP}/ai-rateb-files.txt")" -eq 16
          grep -q 'config/database.php' "${RUNNER_TEMP}/ai-rateb-files.txt" && exit 4
          grep -q 'config/ai.php' "${RUNNER_TEMP}/ai-rateb-files.txt" && exit 4
          rsync -a --no-owner --no-group \
            --files-from="${RUNNER_TEMP}/ai-rateb-files.txt" \
            -e "${SSH_OPTS}" \
            tmp-ai-rateb-deploy/ \
            "${REMOTE}:/home/admin/domains/ai.rateb.sa/"
          ssh -i "${KEY_PATH}" -p "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new "${REMOTE}" bash -s >> "${REPORT}" << 'BASH'
          set -euo pipefail
          cd /home/admin/domains/ai.rateb.sa
          DB_AFTER=$(sha256sum config/database.php | awk '{print $1}')
          AI_AFTER=$(sha256sum config/ai.php | awk '{print $1}')
          HTML_AFTER=$(sha256sum test.html | awk '{print $1}')
          echo "DATABASE_HASH_AFTER=$DB_AFTER"
          echo "AI_HASH_AFTER=$AI_AFTER"
          echo "TEST_HTML_HASH_AFTER=$HTML_AFTER"
          test "$DB_AFTER" = "5afc681e1982ed40734678fba966feb15426cb26ffec465cb263e73049b4556d"
          test "$AI_AFTER" = "574f6c27b1d726dff89c6408df4b83ecfa197fcb2b4f6f032bf5a307ac1e2bd1"
          echo "PROTECTED_FILES=UNCHANGED"
          test -f config/session.php
          test -f config/guard.php
          echo "NEW_FILES=PRESENT"
          BASH
          python3 - << 'PY'
          import re
          text = open("ai-rateb-deploy-report.txt", encoding="utf-8").read()
          def grab(name):
              match = re.search(rf"^{name}=(\S+)", text, re.M)
              if not match:
                  raise SystemExit("missing " + name)
              return match.group(1)
          pairs = [
              ("DATABASE_HASH_BEFORE", "DATABASE_HASH_AFTER"),
              ("AI_HASH_BEFORE", "AI_HASH_AFTER"),
              ("TEST_HTML_HASH_BEFORE", "TEST_HTML_HASH_AFTER"),
          ]
          for before, after in pairs:
              if grab(before) != grab(after):
                  raise SystemExit("protected file changed: " + before)
          print("PROTECTED_MATCH=yes")
          PY
          echo "deploy_report_ready"

      - name: Verify public pages
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install puppeteer --silent
          node << 'NODE'
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const lines = [];
          function say(s) { lines.push(s); console.log(s); fs.appendFileSync('ai-rateb-deploy-report.txt', s + '\n'); }
          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage']
            });
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', (err) => errors.push(String(err)));
            page.on('console', (msg) => {
              if (msg.type() === 'error') errors.push(msg.text());
            });
            async function open(url) {
              errors.length = 0;
              const response = await page.goto(url, { waitUntil: 'networkidle0', timeout: 60000 });
              const status = response ? response.status() : 0;
              const body = await page.content();
              const fatal = /Fatal error|Uncaught PDOException|Uncaught Error/i.test(body);
              say('URL=' + page.url());
              say('STATUS=' + status);
              say('FATAL=' + (fatal ? 'yes' : 'no'));
              say('LANG_BTN=' + (await page.$('#lang') ? 'yes' : 'no'));
              say('THEME_BTN=' + (await page.$('#theme') ? 'yes' : 'no'));
              say('CONSOLE_ERRORS=' + errors.length);
              errors.forEach((item) => say('CONSOLE=' + item.slice(0, 180)));
              return status;
            }
            await open('https://ai.rateb.sa/');
            await page.click('#lang');
            say('AFTER_AR_DIR=' + await page.evaluate(() => document.documentElement.dir));
            say('AFTER_AR_LANG=' + await page.evaluate(() => document.documentElement.lang));
            await page.click('#lang');
            say('AFTER_EN_DIR=' + await page.evaluate(() => document.documentElement.dir));
            say('AFTER_EN_LANG=' + await page.evaluate(() => document.documentElement.lang));
            await page.click('#theme');
            say('AFTER_DARK=' + await page.evaluate(() => document.documentElement.dataset.theme));
            await page.click('#theme');
            say('AFTER_LIGHT=' + await page.evaluate(() => document.documentElement.dataset.theme));
            for (const path of ['/login.php', '/register.php', '/dashboard.php', '/campaign-new.php', '/campaign.php?id=1']) {
              say('PAGE=' + path);
              await open('https://ai.rateb.sa' + path);
            }
            await browser.close();
          })().catch((err) => {
            fs.appendFileSync('ai-rateb-deploy-report.txt', 'VERIFY_FAIL\n');
            process.exit(1);
          });
          NODE

      - name: Upload deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-rateb-deploy-report
          path: ai-rateb-deploy-report.txt
          retention-days: 1
          if-no-files-found: warn
