name: Temporary wave background check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: rateb.sa
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy wave backgrounds
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/rateb-readonly-key"
          export KEY_PATH
          python3 - << 'PY'
          import os, stat
          key = (os.environ.get("DEPLOY_SSH_PRIVATE_KEY") or "").strip()
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")
          path = os.environ["KEY_PATH"]
          with open(path, "w", encoding="utf-8", newline="\n") as handle:
              handle.write(key)
              if not key.endswith("\n"):
                  handle.write("\n")
          os.chmod(path, stat.S_IRUSR | stat.S_IWUSR)
          PY
          PORT="${DEPLOY_SSH_PORT:-22}"
          REMOTE="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          SSH=(ssh -i "${KEY_PATH}" -p "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          SCP=(scp -i "${KEY_PATH}" -P "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          ROOT=/home/admin/domains/ai.rateb.sa
          BASE=https://ai.rateb.sa
          "${SCP[@]}" ai-rateb-sa-source/public/assets/css/app.css "${REMOTE}:${ROOT}/public/assets/css/app.css"
          "${SCP[@]}" ai-rateb-sa-source/index.php "${REMOTE}:${ROOT}/index.php"
          "${SCP[@]}" ai-rateb-sa-source/dashboard.php "${REMOTE}:${ROOT}/dashboard.php"
          "${SCP[@]}" ai-rateb-sa-source/brand.php "${REMOTE}:${ROOT}/brand.php"
          "${SCP[@]}" ai-rateb-sa-source/campaign.php "${REMOTE}:${ROOT}/campaign.php"
          "${SCP[@]}" ai-rateb-sa-source/campaign-new.php "${REMOTE}:${ROOT}/campaign-new.php"
          "${SCP[@]}" ai-rateb-sa-source/app/auth/login.php "${REMOTE}:${ROOT}/app/auth/login.php"
          "${SCP[@]}" ai-rateb-sa-source/app/auth/register.php "${REMOTE}:${ROOT}/app/auth/register.php"
          "${SSH[@]}" "${REMOTE}" "php -l ${ROOT}/index.php && php -l ${ROOT}/dashboard.php && php -l ${ROOT}/brand.php && php -l ${ROOT}/campaign.php && php -l ${ROOT}/campaign-new.php && php -l ${ROOT}/app/auth/login.php && php -l ${ROOT}/app/auth/register.php"
          WORK="${RUNNER_TEMP}/waves"
          mkdir -p "$WORK"
          printf '%s\n' '<?php foreach (["index.php","dashboard.php","brand.php","campaign.php","campaign-new.php","app/auth/login.php","app/auth/register.php"] as $file) { $path="/home/admin/domains/ai.rateb.sa/".$file; echo $file."=".(function_exists("opcache_invalidate") && opcache_invalidate($path, true) ? "yes" : "no").PHP_EOL; }' > "$WORK/refresh.php"
          "${SCP[@]}" "$WORK/refresh.php" "${REMOTE}:${ROOT}/wave-refresh.php"
          curl -sS "$BASE/wave-refresh.php" || true
          echo
          "${SSH[@]}" "${REMOTE}" "rm -f ${ROOT}/wave-refresh.php"
          code=$(curl -sS -o "$WORK/home.html" -w '%{http_code}' "$BASE/")
          echo "HOME_HTTP=${code}"
          test "$code" = "200"
          grep -q 'app.css?v=waves' "$WORK/home.html"
          css=$(curl -sS -o "$WORK/app.css" -w '%{http_code}' "$BASE/public/assets/css/app.css?v=waves")
          echo "CSS_HTTP=${css}"
          test "$css" = "200"
          grep -q 'color-drift' "$WORK/app.css"
          grep -q 'wave-slide' "$WORK/app.css"
          grep -q 'data-theme=dark] body.studio::before' "$WORK/app.css"
          login=$(curl -sS -o "$WORK/login.html" -w '%{http_code}' "$BASE/login.php")
          register=$(curl -sS -o "$WORK/register.html" -w '%{http_code}' "$BASE/register.php")
          echo "LOGIN_HTTP=${login}"
          echo "REGISTER_HTTP=${register}"
          test "$login" = "200"
          test "$register" = "200"
          grep -q 'app.css?v=waves' "$WORK/login.html"
          grep -q 'app.css?v=waves' "$WORK/register.html"
          echo "WAVES=pass"
          rm -f "${KEY_PATH}"
