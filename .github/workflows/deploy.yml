name: Deploy PHP App to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        id: secrets
        run: |
          missing=0
          [ -z "${{ secrets.CPANEL_HOST }}" ] && echo "::error::Missing CPANEL_HOST" && missing=1
          [ -z "${{ secrets.CPANEL_USER }}" ] && echo "::error::Missing CPANEL_USER" && missing=1
          [ -z "${{ secrets.CPANEL_API_TOKEN }}" ] && echo "::error::Missing CPANEL_API_TOKEN" && missing=1
          [ -z "${{ secrets.CPANEL_REPO_ROOT }}" ] && echo "::error::Missing CPANEL_REPO_ROOT (e.g. /home/outratib/repositories/ratib-pro or /home/outratib/public_html)" && missing=1
          if [ -n "${{ secrets.CPANEL_SFTP_PASSWORD }}" ] && [ -n "${{ secrets.CPANEL_SFTP_HOST }}" ]; then
            echo "sftp_configured=true" >> "$GITHUB_OUTPUT"
            echo "SFTP fallback: configured"
          else
            echo "sftp_configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Optional: add CPANEL_SFTP_HOST + CPANEL_SFTP_USER + CPANEL_SFTP_PASSWORD for direct upload to public_html"
          fi
          exit "$missing"

      - name: Build marker (this commit)
        id: build
        run: |
          EXPECTED="$(tr -d '\r\n' < public/ratib-build.txt)"
          echo "expected=${EXPECTED}" >> "$GITHUB_OUTPUT"
          echo "Deploying build marker: ${EXPECTED}"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: cPanel Git pull + .cpanel.yml deploy
        id: cpanel
        continue-on-error: true
        run: |
          set -uo pipefail
          CPANEL_PORT="${{ secrets.CPANEL_PORT }}"
          CPANEL_PORT="${CPANEL_PORT:-2083}"
          CPANEL_BASE="https://${{ secrets.CPANEL_HOST }}:${CPANEL_PORT}"
          AUTH="Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_API_TOKEN }}"
          REPO="$(printf '%s' '${{ secrets.CPANEL_REPO_ROOT }}' | tr -d '\r\n' | xargs)"
          BRANCH="$(printf '%s' '${{ github.ref_name }}' | tr -d '\r\n' | xargs)"
          [ -z "$BRANCH" ] && BRANCH=main

          api() {
            curl -sS --get --connect-timeout 25 --max-time 180 \
              -H "$AUTH" \
              --data-urlencode "repository_root=$REPO" \
              --data-urlencode "branch=$BRANCH" \
              "${CPANEL_BASE}/execute/$1" 2>&1
          }

          echo "=== VersionControl/list (debug) ==="
          api VersionControl/list | head -c 4000 || true
          echo ""
          echo "=== repository_root=${REPO} branch=${BRANCH} ==="

          echo "=== VersionControl/update (git pull) ==="
          UPDATE_RESP="$(api VersionControl/update)"
          echo "$UPDATE_RESP"
          UPDATE_OK="$(printf '%s' "$UPDATE_RESP" | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin)
          except Exception:
              print(0); sys.exit(0)
          r=d.get('result',d) or {}
          st=r.get('status', d.get('status', 0))
          print(1 if int(st or 0)==1 else 0)
          " 2>/dev/null || echo 0)"

          echo "=== VersionControlDeployment/create (.cpanel.yml → public_html sync) ==="
          DEPLOY_RESP="$(api VersionControlDeployment/create)"
          echo "$DEPLOY_RESP"
          DEPLOY_OK="$(printf '%s' "$DEPLOY_RESP" | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin)
          except Exception:
              print(0); sys.exit(0)
          r=d.get('result',d) or {}
          st=r.get('status', d.get('status', 0))
          print(1 if int(st or 0)==1 else 0)
          " 2>/dev/null || echo 0)"

          echo "update_ok=${UPDATE_OK} deploy_ok=${DEPLOY_OK}" >> "$GITHUB_OUTPUT"
          if [ "$UPDATE_OK" = "1" ] || [ "$DEPLOY_OK" = "1" ]; then
            echo "cpanel_ok=true" >> "$GITHUB_OUTPUT"
            echo "::notice::cPanel Git pull/deploy API succeeded"
          else
            echo "cpanel_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::cPanel Git API failed for repository_root=${REPO}"
            echo "::warning::Fix CPANEL_REPO_ROOT in GitHub secrets OR add CPANEL_SFTP_* secrets for direct public_html upload"
          fi

      - name: SFTP upload to public_html (recommended)
        id: sftp
        if: steps.secrets.outputs.sftp_configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.CPANEL_SFTP_HOST }}
          username: ${{ secrets.CPANEL_SFTP_USER || secrets.CPANEL_USER }}
          password: ${{ secrets.CPANEL_SFTP_PASSWORD }}
          port: ${{ secrets.CPANEL_SFTP_PORT || 22 }}
          protocol: sftp
          local-dir: ./
          server-dir: ${{ secrets.CPANEL_SFTP_REMOTE_DIR || '/home/outratib/public_html/' }}
          exclude: |
            **/.git*
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/.cursor/**
            **/archive/**
          log-level: standard
          dangerous-clean-slate: false

      - name: PHP curl fallback (if SFTP not configured)
        id: curl_deploy
        if: steps.secrets.outputs.sftp_configured != 'true'
        continue-on-error: true
        env:
          RATIB_DEPLOY_SYNC_KEY: ${{ secrets.RATIB_DEPLOY_SYNC_KEY }}
        run: |
          KEY="${RATIB_DEPLOY_SYNC_KEY:-ratib-deploy-sync-2026}"
          OUT="$(curl -fsSL --max-time 180 \
            "https://out.ratib.sa/ratib-profile-check.php?deploy=1&key=${KEY}" 2>&1)" || true
          echo "$OUT"
          if echo "$OUT" | grep -qE 'Summary: ok=[1-9]'; then
            echo "curl_deploy_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "curl_deploy_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PHP curl deploy cannot write on this host (expected). Add SFTP secrets or fix cPanel Git path."
          fi

      - name: Wait for live site
        run: sleep 25

      - name: Verify live site has THIS commit's build marker
        id: verify
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.build.outputs.expected }}"
          COMMIT="${{ steps.build.outputs.commit }}"
          SITE="${{ secrets.CPANEL_SITE_URL || 'https://out.ratib.sa' }}"

          http_code() {
            curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 15 --max-time 45 "$1" 2>/dev/null || echo "000"
          }

          LIVE_MARKER=""
          LIVE_STAMP=""
          LIVE_ROOT=""
          ok=0

          for n in 1 2 3 4 5 6; do
            H="$(http_code "${SITE}/pages/home.php")"
            DEPLOY_ROOT="$(curl -fsSL --max-time 45 "${SITE}/pages/deploy-root.php" 2>/dev/null || true)"
            PROBE="$(curl -fsSL --max-time 45 "${SITE}/pages/home.php?ratib_deploy_probe=1" 2>/dev/null || true)"
            LIVE_MARKER="$(printf '%s' "$DEPLOY_ROOT$PROBE" | sed -n 's/^git_marker=//p' | head -1 | tr -d '\r')"
            LIVE_STAMP="$(printf '%s' "$DEPLOY_ROOT" | sed -n 's/^stamp_file=//p' | head -1 | tr -d '\r')"
            LIVE_ROOT="$(printf '%s' "$DEPLOY_ROOT" | sed -n 's/^probe_root=//p' | head -1 | tr -d '\r')"
            P_FOLLOW="$(curl -sS -o /dev/null -w "%{http_code}" -L --max-redirs 5 --max-time 45 "${SITE}/profile" 2>/dev/null || echo 000)"

            echo "try=$n home=$H profile_follow=$P_FOLLOW live_marker=${LIVE_MARKER:-<empty>} want=${EXPECTED}"

            if [ "$H" = "200" ] && [ "$P_FOLLOW" = "200" ] && [ -n "$LIVE_MARKER" ] && [ "$LIVE_MARKER" = "$EXPECTED" ]; then
              ok=1
              break
            fi
            sleep 15
          done

          echo "live_marker=${LIVE_MARKER}" >> "$GITHUB_OUTPUT"
          echo "live_root=${LIVE_ROOT}" >> "$GITHUB_OUTPUT"

          if [ "$ok" -ne 1 ]; then
            echo "::error::Live site does NOT have build marker '${EXPECTED}' (got '${LIVE_MARKER:-missing}')."
            echo "::error::GitHub push did not reach public_html. Fix:"
            echo "  1) Add GitHub secrets: CPANEL_SFTP_HOST, CPANEL_SFTP_PASSWORD, CPANEL_SFTP_REMOTE_DIR=/home/outratib/public_html/"
            echo "  2) OR cPanel → Git Version Control → path = CPANEL_REPO_ROOT → Deploy HEAD Commit"
            echo "  probe_root=${LIVE_ROOT} stamp=${LIVE_STAMP} commit=${COMMIT}"
            echo "cpanel_ok=${{ steps.cpanel.outputs.cpanel_ok }} sftp_configured=${{ steps.secrets.outputs.sftp_configured }}"
            if [ "${{ steps.cpanel.outputs.cpanel_ok }}" != "true" ] && [ "${{ steps.secrets.outputs.sftp_configured }}" != "true" ]; then
              echo "::error::Neither cPanel Git nor SFTP deployed files — job cannot succeed until one path works."
            fi
            exit 1
          fi

          echo "::notice::Deploy verified — live marker matches ${EXPECTED}"
