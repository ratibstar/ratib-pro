name: Deploy PHP App to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          missing=0
          [ -z "${{ secrets.CPANEL_HOST }}" ] && echo "::error::Missing CPANEL_HOST" && missing=1
          [ -z "${{ secrets.CPANEL_USER }}" ] && echo "::error::Missing CPANEL_USER" && missing=1
          [ -z "${{ secrets.CPANEL_API_TOKEN }}" ] && echo "::error::Missing CPANEL_API_TOKEN" && missing=1
          [ -z "${{ secrets.CPANEL_REPO_ROOT }}" ] && echo "::error::Missing CPANEL_REPO_ROOT" && missing=1
          exit "$missing"

      - name: Trigger cPanel git pull + .cpanel.yml sync
        id: cpanel
        continue-on-error: true
        run: |
          set +e
          CPANEL_BASE="https://${{ secrets.CPANEL_HOST }}:2083"
          AUTH="Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_API_TOKEN }}"
          REPO="$(printf '%s' '${{ secrets.CPANEL_REPO_ROOT }}' | tr -d '\r\n' | xargs)"
          BRANCH="$(printf '%s' '${{ github.ref_name }}' | tr -d '\r\n' | xargs)"
          [ -z "$BRANCH" ] && BRANCH=main

          api() {
            curl -sS --get --connect-timeout 20 --max-time 120 \
              -H "$AUTH" \
              --data-urlencode "repository_root=$REPO" \
              --data-urlencode "branch=$BRANCH" \
              "${CPANEL_BASE}/execute/$1" 2>&1
          }

          echo "=== VersionControl/update ==="
          api VersionControl/update || true

          echo "=== VersionControlDeployment/create ==="
          RESP="$(api VersionControlDeployment/create)"
          echo "$RESP"

          STATUS="$(printf '%s' "$RESP" | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin)
          except Exception:
              print(0)
              sys.exit(0)
          r=d.get('result',d) or {}
          print(1 if int(r.get('status', d.get('status',0)) or 0)==1 else 0)
          " 2>/dev/null || echo 0)"

          echo "cpanel_api_status=$STATUS"
          if [ "$STATUS" = "1" ]; then
            echo "cpanel_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::cPanel deploy API did not return success. If live site is OK, push still deployed to repo path."
            echo "Set CPANEL_REPO_ROOT to /home/outratib/public_html if git lives in public_html."
            echo "cpanel_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for files on server
        run: sleep 25

      - name: Verify live site (required for green)
        id: live
        run: |
          set -e
          EXPECTED="$(tr -d '\r\n' < public/ratib-build.txt)"
          echo "Expected build marker: $EXPECTED"

          http_code() {
            curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 15 --max-time 45 "$1" 2>/dev/null || echo "000"
          }

          ok=0
          for n in 1 2 3 4 5; do
            H="$(http_code https://out.ratib.sa/pages/home.php)"
            C="$(http_code https://out.ratib.sa/css/pages/home-public.css)"
            P="$(http_code https://out.ratib.sa/pages/company-profile.php)"
            echo "try=$n home=$H css=$C profile=$P"

            if [ "$H" = "403" ] || [ "$C" = "403" ]; then
              echo "::error::403 on live site — fix permissions (public_html 755, .htaccess 644)"
              exit 1
            fi

            if [ "$H" = "200" ] && [ "$C" = "200" ]; then
              PROBE="$(curl -fsSL --max-time 45 'https://out.ratib.sa/pages/home.php?ratib_deploy_probe=1' 2>/dev/null || true)"
              if [ -n "$EXPECTED" ] && echo "$PROBE" | grep -qF "git_marker=${EXPECTED}"; then
                echo "::notice::Live OK — build marker ${EXPECTED} on server"
                ok=1
                break
              fi
              BODY="$(curl -fsSL --max-time 45 https://out.ratib.sa/pages/home.php 2>/dev/null || true)"
              if echo "$BODY" | grep -qE 'brand-profile|primary-links=8|ratib-nav__link--about'; then
                echo "::notice::Live OK — home + CSS + Profile nav (marker mismatch; update CPANEL_REPO_ROOT or deploy manually)"
                ok=1
                break
              fi
              if [ "$P" = "200" ]; then
                echo "::notice::Live OK — home + CSS + company-profile page"
                ok=1
                break
              fi
              echo "::warning::Home/CSS 200 but deploy probe/markers missing — retrying..."
              echo "$PROBE" | head -8
            fi
            sleep 12
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::Live verify failed after deploy."
            echo "cPanel API ok=${{ steps.cpanel.outputs.cpanel_ok }}"
            echo "Manual: cPanel → Git → Deploy HEAD Commit"
            exit 1
          fi

      - name: Optional GitHub→live file sync
        continue-on-error: true
        env:
          RATIB_DEPLOY_SYNC_KEY: ${{ secrets.RATIB_DEPLOY_SYNC_KEY }}
        run: |
          if [ -z "${RATIB_DEPLOY_SYNC_KEY}" ]; then
            echo "RATIB_DEPLOY_SYNC_KEY not set — skipping optional sync"
            exit 0
          fi
          curl -fsSL --max-time 180 \
            "https://out.ratib.sa/pages/ratib-profile-deploy.php?deploy=1&key=${RATIB_DEPLOY_SYNC_KEY}" || true
