name: Deploy PHP App to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Full upload (~5 min). Default = fast deploy (baseline + commit-changed paths, ~1–2 min)."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      infra_only:
        description: "Upload only scripts/infra-deploy-23-files.list (PHP/sql/sh). Use after a failed infra bundle push."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Upload to public_html (Fileman + progress %)
        id: fileman
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_REMOTE_BASE: ${{ secrets.CPANEL_SFTP_REMOTE_DIR || '/home/outratib/public_html' }}
          CPANEL_DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.infra_only == 'true' && 'list' || (github.event_name == 'workflow_dispatch' && inputs.full_sync == 'true' && 'critical' || 'fast') }}
        run: bash scripts/github-cpanel-fileman-deploy.sh

      - name: Verify live site (~20s)
        if: steps.fileman.outcome == 'success'
        run: |
          SITE="${{ secrets.CPANEL_SITE_URL || 'https://out.ratib.sa' }}"
          # home.php 302-redirects to /home — must follow redirects (-L). /home must NOT hit country_slug=home.
          code() { curl -sS -o /dev/null -w "%{http_code}" -L --connect-timeout 8 --max-time 20 "$1" 2>/dev/null || echo 000; }
          P="$(code "${SITE}/profile/")"
          G="$(code "${SITE}/js/pages/ratib-profile-nav-guard.js")"
          H="$(code "${SITE}/home")"
          HLEG="$(code "${SITE}/pages/home.php")"
          REG="${SITE}/home?open=register&plan=gold&years=1&_deploy_verify=1"
          if [ -n "$LIVE_BUILD" ]; then
            REG="${SITE}/home?v=${LIVE_BUILD}&open=register&plan=gold&years=1&_deploy_verify=1"
          fi
          HR="$(code "${REG}")"
          BODY="$(curl -sS -L --connect-timeout 8 --max-time 25 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${REG}" 2>/dev/null | head -c 250000 || true)"
          echo "profile/=$P home=$H home.php(legacy)=$HLEG register=$HR guard.js=$G"
          GOV_BYTES="$(curl -sS -L --connect-timeout 8 --max-time 20 "${SITE}/public/cms-bundle-gov-control-v2.png" 2>/dev/null | wc -c | tr -d ' ')"
          GOV_MAGIC="$(curl -sS -L --connect-timeout 8 --max-time 20 "${SITE}/public/cms-bundle-gov-control-v2.png" 2>/dev/null | head -c 3 | xxd -p 2>/dev/null || echo 000000)"
          echo "gov-control-v2 bytes=${GOV_BYTES} magic=${GOV_MAGIC}"
          if [ "${GOV_BYTES:-0}" -lt 80000 ] || [ "${GOV_BYTES:-0}" -gt 150000 ]; then
            echo "::error::gov-control-v2 bundle wrong size (${GOV_BYTES} bytes) — image deploy broken"
            exit 1
          fi
          if [ "$GOV_MAGIC" != "ffd8ff" ] && [ "$GOV_MAGIC" != "89504e" ]; then
            echo "::error::gov-control-v2 not a valid image (magic ${GOV_MAGIC})"
            exit 1
          fi
          # Bypass LiteSpeed HTML cache: use canonical ?v= from disk (uploaded last in fast deploy).
          LIVE_BUILD="$(curl -sS -L --connect-timeout 8 --max-time 15 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            "${SITE}/public/ratib-build.txt?deploy_verify=$(date +%s)" 2>/dev/null | tr -d '\r\n' || true)"
          if ! echo "$LIVE_BUILD" | grep -q 'rateb-'; then
            LIVE_BUILD="$(curl -sS -L --connect-timeout 8 --max-time 20 -H 'Cache-Control: no-cache' \
              "${SITE}/pages/ratib-rebrand-status.php" 2>/dev/null | sed -n 's/^build=//p' | head -1 | tr -d '\r\n' || true)"
          fi
          echo "live_build=${LIVE_BUILD}"
          HOME_URL="${SITE}/home"
          if [ -n "$LIVE_BUILD" ]; then
            HOME_URL="${HOME_URL}?v=${LIVE_BUILD}&_deploy_verify=1"
          else
            HOME_URL="${HOME_URL}?_deploy_verify=1"
          fi
          HOME_RAW="$(curl -sS -L --connect-timeout 8 --max-time 25 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            "${HOME_URL}" 2>/dev/null | head -c 250000 || true)"
          BRAND_FAIL=0
          echo "$HOME_RAW" | grep -qi 'Ratib Company' && { echo "::error::home still contains Ratib Company"; BRAND_FAIL=1; }
          echo "$HOME_RAW" | grep -q 'Workforce Intelligence</span>' && { echo "::error::home hero still uses Workforce Intelligence (stale CMS title)"; BRAND_FAIL=1; }
          echo "$HOME_RAW" | grep -q 'Software Foundation for Information Technology' && { echo "::error::home still shows Software Foundation legal line"; BRAND_FAIL=1; }
          echo "$HOME_RAW" | grep -qE 'Telemetry Enterprise Base|ratib-brand-full__word--w3' && echo "hero_expansion=ok" || { echo "::error::home hero missing Telemetry Enterprise Base expansion"; BRAND_FAIL=1; }
          echo "$HOME_RAW" | grep -qi 'country_slug=home\|Country not found' && { echo "::error::/home wrongly routed as country slug (check .htaccess home rule order)"; BRAND_FAIL=1; }
          echo "$HOME_RAW" | grep -q 'ratib-public-header-pin' && echo "header_pin_markup=ok" || { echo "::error::home missing ratib-public-header-pin (sticky header chrome)"; BRAND_FAIL=1; }
          if [ -n "$LIVE_BUILD" ]; then
            echo "rebrand_build_marker=ok"
          else
            echo "::warning::ratib-build.txt empty or unreachable; verify HTML rebrand= comment matches git"
          fi
          [ "$BRAND_FAIL" -eq 1 ] && exit 1
          if [ "$P" = "200" ] && [ "$G" = "200" ] && [ "$H" = "200" ] && [ "$HR" = "200" ]; then
            HOMECSS="$(code "${SITE}/css/pages/home-public.css")"
            echo "home-public.css=$HOMECSS"
            if [ "$HOMECSS" != "200" ]; then
              echo "::error::css/pages/home-public.css returned $HOMECSS (check .htaccess does not rewrite /css/pages/ as country_slug)"
              exit 1
            fi
            if echo "$BODY" | grep -qi '<!DOCTYPE'; then
              if echo "$BODY" | grep -q 'register-section-hidden ratib-register-wrap'; then
                echo "::error::register section still hidden with open=register (deploy home.php?)"
                exit 1
              fi
              if echo "$BODY" | grep -q 'openRegister.:true'; then
                echo "::notice::Deploy OK (home HTML + openRegister)"
                exit 0
              fi
              echo "::notice::Deploy OK (home returns HTML after redirect)"
              exit 0
            fi
            echo "::error::home.php returned 200 but not HTML (likely PHP fatal): ${BODY:0:160}"
            exit 1
          fi
          echo "::error::verify failed profile/=$P home=$H home.php(legacy)=$HLEG guard.js=$G body=${BODY:0:160}"
          exit 1

      - name: Deploy failed
        if: steps.fileman.outcome != 'success'
        run: |
          echo "::error::Fileman upload failed — see [N/TOTAL] % lines above"
          exit 1
