name: Deploy PHP App to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  trigger-cpanel-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for deploy marker verification)
        uses: actions/checkout@v4

      - name: Validate cPanel API secrets
        run: |
          if [ -z "${{ secrets.CPANEL_HOST }}" ]; then echo "Missing CPANEL_HOST"; exit 1; fi
          if [ -z "${{ secrets.CPANEL_USER }}" ]; then echo "Missing CPANEL_USER"; exit 1; fi
          if [ -z "${{ secrets.CPANEL_API_TOKEN }}" ]; then echo "Missing CPANEL_API_TOKEN"; exit 1; fi
          if [ -z "${{ secrets.CPANEL_REPO_ROOT }}" ]; then echo "Missing CPANEL_REPO_ROOT"; exit 1; fi

      - name: Deploy to cPanel (webhook + UAPI git deploy)
        id: cpanel_deploy
        run: |
          HOOK_URL="$(printf '%s' "${{ secrets.CPANEL_DEPLOY_HOOK_URL }}" | tr -d '\r\n' | xargs)"
          if [ -n "$HOOK_URL" ]; then
            curl -sS -L --connect-timeout 20 --max-time 180 --retry 2 \
              -o /dev/null -w "webhook_http=%{http_code}\n" "$HOOK_URL" || true
          fi

          CPANEL_BASE_URL="https://${{ secrets.CPANEL_HOST }}:2083"
          AUTH_HEADER="Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_API_TOKEN }}"

          call_cpanel_api() {
            local endpoint="$1"
            shift
            curl -fsSL --get --retry 5 --retry-all-errors --retry-delay 3 \
              --connect-timeout 15 --max-time 120 \
              -H "$AUTH_HEADER" \
              "$@" \
              "${CPANEL_BASE_URL}/execute/${endpoint}"
          }

          CLEAN_REPO_ROOT="$(printf '%s' "${{ secrets.CPANEL_REPO_ROOT }}" | tr -d '\r\n' | xargs)"
          CLEAN_BRANCH="$(printf '%s' "${{ github.ref_name }}" | tr -d '\r\n' | xargs)"
          [ -z "$CLEAN_BRANCH" ] && CLEAN_BRANCH="main"

          SYNC_RESPONSE="$(call_cpanel_api "VersionControl/update" \
            --data-urlencode "repository_root=$CLEAN_REPO_ROOT" \
            --data-urlencode "branch=$CLEAN_BRANCH")"
          echo "cPanel sync API response:"
          echo "$SYNC_RESPONSE"

          RESPONSE="$(call_cpanel_api "VersionControlDeployment/create" \
            --data-urlencode "repository_root=$CLEAN_REPO_ROOT")"
          echo "cPanel deploy API response:"
          echo "$RESPONSE"

          STATUS="$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('result',d) or {}; print(r.get('status', d.get('status',0)))")"
          LOG_PATH="$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('result',d) or {}; data=(r.get('data', d.get('data',{})) or {}); print(data.get('log_path',''))")"
          echo "deploy_status=$STATUS log=$LOG_PATH"

          if [ "$STATUS" != "1" ]; then
            echo "::error::cPanel VersionControlDeployment failed (status=$STATUS). In cPanel open Git → Deploy HEAD Commit and read log: $LOG_PATH"
            exit 1
          fi

      - name: Live sync fallback (public_html via curl)
        env:
          DEPLOY_KEY: ${{ secrets.RATIB_DEPLOY_SYNC_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::notice::RATIB_DEPLOY_SYNC_KEY not set — skip live curl sync (cPanel sync only)"
            exit 0
          fi
          echo "Waiting 45s for cPanel deploy task..."
          sleep 45
          BODY="$(curl -fsSL --connect-timeout 20 --max-time 300 \
            "https://out.ratib.sa/pages/ratib-profile-deploy.php?deploy=1&key=${DEPLOY_KEY}" 2>/dev/null || true)"
          if ! echo "$BODY" | grep -q 'RATIB Profile deploy'; then
            BODY="$(curl -fsSL --connect-timeout 20 --max-time 300 \
              "https://out.ratib.sa/ratib-profile-check.php?deploy=1&key=${DEPLOY_KEY}" 2>/dev/null || true)"
          fi
          echo "$BODY"
          if echo "$BODY" | grep -q 'chrome_primary_links_8=yes'; then
            echo "::notice::Live curl sync OK"
            exit 0
          fi
          echo "::warning::Live curl sync did not confirm Profile — check ratib-profile-check.php on server"

      - name: Verify live public_html has Profile
        continue-on-error: true
        run: |
          EXPECTED="$(tr -d '\r\n' < public/ratib-build.txt)"
          echo "Expected build marker: $EXPECTED"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            BODY="$(curl -fsSL --connect-timeout 15 --max-time 45 \
              "https://out.ratib.sa/ratib-profile-check.php" 2>/dev/null || true)"
            if echo "$BODY" | grep -qi 'unable to read htaccess\|403 Forbidden'; then
              echo "::warning::Site returns 403 — fix .htaccess permissions in cPanel (644) on public_html/.htaccess"
              break
            fi
            if echo "$BODY" | grep -qE '\[OK\].*(brand-profile|primary-links=8|nav-inject)'; then
              if ! echo "$BODY" | grep -q '\[MISSING\] pages/company-profile.php'; then
                echo "::notice::Live Profile deploy verified (ratib-profile-check)"
                ok=1
                break
              fi
            fi
            PROBE="$(curl -fsSL --connect-timeout 15 --max-time 45 \
              "https://out.ratib.sa/pages/home.php?ratib_deploy_probe=1" 2>/dev/null || true)"
            if echo "$PROBE" | grep -q 'company_profile_php=yes' && echo "$PROBE" | grep -q 'chrome_about_link=yes'; then
              echo "::notice::Live Profile deploy verified (home probe)"
              ok=1
              break
            fi
            echo "Attempt $attempt — not live yet, waiting 25s..."
            sleep 25
          done
          if [ "$ok" -eq 1 ]; then exit 0; fi
          echo "::error::Live site still missing Profile after deploy."
          echo "1) cPanel → Git → repo path must match secret CPANEL_REPO_ROOT"
          echo "2) .cpanel.yml must run scripts/cpanel-deploy-sync.sh → /home/outratib/public_html"
          echo "3) Or set GitHub secret RATIB_DEPLOY_SYNC_KEY and upload ratib-profile-check.php"
          exit 1
