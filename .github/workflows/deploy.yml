name: Deploy PHP App to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          missing=0
          [ -z "${{ secrets.CPANEL_HOST }}" ] && echo "::error::Missing CPANEL_HOST" && missing=1
          [ -z "${{ secrets.CPANEL_USER }}" ] && echo "::error::Missing CPANEL_USER" && missing=1
          [ -z "${{ secrets.CPANEL_API_TOKEN }}" ] && echo "::error::Missing CPANEL_API_TOKEN" && missing=1
          [ -z "${{ secrets.CPANEL_REPO_ROOT }}" ] && echo "::error::Missing CPANEL_REPO_ROOT" && missing=1
          exit "$missing"

      - name: Trigger cPanel git pull + .cpanel.yml sync
        id: cpanel
        continue-on-error: true
        run: |
          set +e
          CPANEL_BASE="https://${{ secrets.CPANEL_HOST }}:2083"
          AUTH="Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_API_TOKEN }}"
          REPO="$(printf '%s' '${{ secrets.CPANEL_REPO_ROOT }}' | tr -d '\r\n' | xargs)"
          BRANCH="$(printf '%s' '${{ github.ref_name }}' | tr -d '\r\n' | xargs)"
          [ -z "$BRANCH" ] && BRANCH=main

          api() {
            curl -sS --get --connect-timeout 20 --max-time 120 \
              -H "$AUTH" \
              --data-urlencode "repository_root=$REPO" \
              --data-urlencode "branch=$BRANCH" \
              "${CPANEL_BASE}/execute/$1" 2>&1
          }

          echo "=== VersionControl/update ==="
          api VersionControl/update || true

          echo "=== VersionControlDeployment/create ==="
          RESP="$(api VersionControlDeployment/create)"
          echo "$RESP"

          STATUS="$(printf '%s' "$RESP" | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin)
          except Exception:
              print(0)
              sys.exit(0)
          r=d.get('result',d) or {}
          print(1 if int(r.get('status', d.get('status',0)) or 0)==1 else 0)
          " 2>/dev/null || echo 0)"

          if [ "$STATUS" = "1" ]; then
            echo "cpanel_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::cPanel deploy API did not return success."
            echo "Set CPANEL_REPO_ROOT=/home/outratib/public_html if git is in public_html."
            echo "cpanel_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub→live file sync (curl deploy)
        id: curl_deploy
        continue-on-error: true
        env:
          RATIB_DEPLOY_SYNC_KEY: ${{ secrets.RATIB_DEPLOY_SYNC_KEY }}
        run: |
          KEY="${RATIB_DEPLOY_SYNC_KEY:-ratib-deploy-sync-2026}"
          OUT="$(curl -fsSL --max-time 180 \
            "https://out.ratib.sa/ratib-profile-check.php?deploy=1&key=${KEY}" 2>&1)" || true
          echo "$OUT"
          if echo "$OUT" | grep -q 'Summary: ok=0'; then
            echo "curl_deploy_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PHP curl deploy wrote 0 files (use cPanel Git Deploy or File Manager upload)"
          elif echo "$OUT" | grep -qE 'Summary: ok=[1-9]'; then
            echo "curl_deploy_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "curl_deploy_ok=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for files on server
        run: sleep 20

      - name: Verify live public site
        run: |
          set -e
          EXPECTED="$(tr -d '\r\n' < public/ratib-build.txt)"
          echo "Repo build marker: $EXPECTED"

          http_code() {
            curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 15 --max-time 45 "$1" 2>/dev/null || echo "000"
          }

          ok=0
          WARN=0
          for n in 1 2 3 4 5; do
            H="$(http_code https://out.ratib.sa/pages/home.php)"
            C="$(http_code https://out.ratib.sa/css/pages/home-public.css)"
            A="$(http_code https://out.ratib.sa/css/pages/about-enterprise.css)"
            P="$(http_code https://out.ratib.sa/profile)"
            echo "try=$n home=$H css=$C about-css=$A profile=$P"

            if [ "$H" = "403" ] || [ "$C" = "403" ]; then
              echo "::error::403 on live site — public_html 755, .htaccess 644"
              exit 1
            fi

            if [ "$H" != "200" ] || [ "$C" != "200" ]; then
              sleep 10
              continue
            fi

            PROBE="$(curl -fsSL --max-time 45 'https://out.ratib.sa/pages/home.php?ratib_deploy_probe=1' 2>/dev/null || true)"
            LIVE_MARKER="$(printf '%s' "$PROBE" | sed -n 's/^git_marker=//p' | head -1 | tr -d '\r')"
            PROFILE_HTML="$(curl -fsSL --max-time 45 'https://out.ratib.sa/profile' 2>/dev/null || true)"
            MEGA="$(curl -fsSL --max-time 45 https://out.ratib.sa/js/pages/ratib-mega-nav.js 2>/dev/null || true)"

            # Hard requirement: public site responds
            if [ "$P" = "200" ] || [ "$(http_code https://out.ratib.sa/pages/company-profile.php)" = "200" ]; then
              ok=1
            fi

            # Warnings (do not fail the job — cPanel often lags behind GitHub)
            if [ -n "$EXPECTED" ] && [ "$LIVE_MARKER" != "$EXPECTED" ]; then
              echo "::warning::Stale build marker on server: got=${LIVE_MARKER} want=${EXPECTED}"
              WARN=1
            fi
            if echo "$PROFILE_HTML" | grep -q '/profile/css/'; then
              echo "::warning::Profile page CSS paths wrong — upload pages/about.php + includes/ratib-public-base-url.php"
              WARN=1
            fi
            if ! echo "$MEGA" | grep -qE 'fixProfileHrefs|ratibProfileNavGuardInline'; then
              echo "::warning::Profile nav JS not updated — upload js/pages/ratib-mega-nav.js"
              WARN=1
            fi
            if [ "$A" != "200" ]; then
              echo "::warning::about-enterprise.css HTTP $A"
              WARN=1
            fi

            if [ "$ok" -eq 1 ]; then
              if [ "$WARN" -eq 0 ]; then
                echo "::notice::Live OK — site up and deploy markers match"
              else
                echo "::notice::Live OK — site up (manual cPanel/File Manager sync still needed for latest code)"
              fi
              break
            fi
            sleep 10
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::Public site unreachable (home/css/profile not OK)."
            echo "cPanel API ok=${{ steps.cpanel.outputs.cpanel_ok }}"
            echo "curl_deploy ok=${{ steps.curl_deploy.outputs.curl_deploy_ok }}"
            exit 1
          fi

          CP="$(http_code https://out.ratib.sa/control-panel/pages/login.php)"
          if [ "$CP" = "500" ]; then
            echo "::warning::Control panel login is HTTP 500 (not a deploy gate)"
          else
            echo "::notice::Control panel login HTTP ${CP}"
          fi
