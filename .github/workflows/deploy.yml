name: Deploy PHP App to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Full 24-file upload (~5 min). Default = fast 6-file deploy (~1 min)."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Upload to public_html (Fileman + progress %)
        id: fileman
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_REMOTE_BASE: ${{ secrets.CPANEL_SFTP_REMOTE_DIR || '/home/outratib/public_html' }}
          CPANEL_DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.full_sync == 'true' && 'critical' || 'fast' }}
        run: bash scripts/github-cpanel-fileman-deploy.sh

      - name: Verify live site (~20s)
        if: steps.fileman.outcome == 'success'
        run: |
          SITE="${{ secrets.CPANEL_SITE_URL || 'https://out.ratib.sa' }}"
          code() { curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 8 --max-time 15 "$1" 2>/dev/null || echo 000; }
          P="$(code "${SITE}/profile/")"
          G="$(code "${SITE}/js/pages/ratib-profile-nav-guard.js")"
          H="$(code "${SITE}/pages/home.php")"
          BODY="$(curl -sS --connect-timeout 8 --max-time 20 "${SITE}/pages/home.php" 2>/dev/null | head -c 400 || true)"
          echo "profile/=$P home.php=$H guard.js=$G"
          if [ "$P" = "200" ] && [ "$G" = "200" ] && [ "$H" = "200" ]; then
            if echo "$BODY" | grep -q '<!DOCTYPE'; then
              echo "::notice::Deploy OK (home returns HTML)"
              exit 0
            fi
            echo "::error::home.php returned 200 but not HTML (likely PHP fatal JSON): ${BODY:0:120}"
            exit 1
          fi
          echo "::error::verify failed profile/=$P home.php=$H guard.js=$G body=${BODY:0:120}"
          exit 1

      - name: Deploy failed
        if: steps.fileman.outcome != 'success'
        run: |
          echo "::error::Fileman upload failed — see [N/TOTAL] % lines above"
          exit 1
