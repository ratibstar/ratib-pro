name: Deploy PHP App to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Upload all code files (slow, ~10 min). Default is critical-only (~90s)."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build marker
        id: build
        run: |
          echo "expected=$(tr -d '\r\n' < public/ratib-build.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload critical files to public_html (~90s)
        id: fileman
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_REMOTE_BASE: ${{ secrets.CPANEL_SFTP_REMOTE_DIR || '/home/outratib/public_html' }}
          CPANEL_SKIP_BULK: ${{ github.event_name == 'workflow_dispatch' && inputs.full_sync == 'true' && '0' || '1' }}
          CPANEL_FILEMAN_WORKERS: "4"
        run: bash scripts/github-cpanel-fileman-fast.sh

      - name: Verify live site (~20s)
        run: |
          set -euo pipefail
          SITE="${{ secrets.CPANEL_SITE_URL || 'https://out.ratib.sa' }}"
          FILEMAN_OK="${{ steps.fileman.outcome == 'success' && 'yes' || 'no' }}"

          if [ "$FILEMAN_OK" != "yes" ]; then
            echo "::error::Fileman upload failed — open previous step log for CRITICAL_FAIL lines"
            exit 1
          fi

          code() { curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 25 "$1" 2>/dev/null || echo 000; }

          sleep 5
          H="$(code "${SITE}/pages/home.php")"
          P="$(code "${SITE}/profile/")"
          GUARD="$(code "${SITE}/js/pages/ratib-profile-nav-guard.js")"
          echo "home=$H profile/=$P guard_js=$GUARD"

          if [ "$P" != "200" ]; then
            echo "::error::/profile/ not OK (HTTP $P)"
            exit 1
          fi

          if [ "$GUARD" = "200" ]; then
            echo "::notice::Deploy OK — profile + guard.js on server"
            exit 0
          fi

          if [ "$H" = "200" ]; then
            echo "::warning::guard.js HTTP $GUARD (profile page OK) — nav still works via inline scripts"
            echo "::notice::Deploy OK — critical files uploaded"
            exit 0
          fi

          echo "::error::Site check failed home=$H profile=$P guard=$GUARD"
          exit 1
