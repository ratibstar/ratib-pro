name: Deploy PHP App (DirectAdmin rsync / cPanel)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Full upload (~5 min). Default = fast deploy (baseline + commit-changed paths, ~1–2 min)."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      infra_only:
        description: "Upload only scripts/infra-deploy-23-files.list (PHP/sql/sh). Use after a failed infra bundle push."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: rateb.sa
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Deploy to public_html
        id: deploy
        env:
          DEPLOY_BACKEND: ${{ secrets.DEPLOY_BACKEND || 'rsync' }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
          DEPLOY_REMOTE_BASE: ${{ secrets.DEPLOY_REMOTE_BASE || secrets.CPANEL_SFTP_REMOTE_DIR || '/home/admin/public_html' }}
          DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.infra_only == 'true' && 'list' || (github.event_name == 'workflow_dispatch' && inputs.full_sync == 'true' && 'critical' || 'fast') }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_REMOTE_BASE: ${{ secrets.CPANEL_SFTP_REMOTE_DIR || '/home/admin/public_html' }}
          CPANEL_DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.infra_only == 'true' && 'list' || (github.event_name == 'workflow_dispatch' && inputs.full_sync == 'true' && 'critical' || 'fast') }}
          RATEB_ERP_MIGRATE_TOKEN: ${{ secrets.RATEB_ERP_MIGRATE_TOKEN || secrets.CPANEL_API_TOKEN }}
        run: |
          MODE="${DEPLOY_MODE}"
          export DEPLOY_MODE="${MODE}" CPANEL_DEPLOY_MODE="${MODE}"
          if [ "${DEPLOY_BACKEND}" = "cpanel" ] && [ -n "${CPANEL_API_TOKEN:-}" ]; then
            echo "backend=cpanel (Fileman API)"
            bash scripts/github-cpanel-fileman-deploy.sh
          else
            echo "backend=rsync (DirectAdmin / SSH)"
            bash scripts/github-rsync-deploy.sh
          fi

      - name: Run RATEB ERP migrations
        if: steps.deploy.outcome == 'success'
        env:
          CPANEL_SITE_URL: ${{ secrets.DEPLOY_SITE_URL || secrets.CPANEL_SITE_URL || 'https://rateb.sa' }}
          RATEB_ERP_MIGRATE_TOKEN: ${{ secrets.RATEB_ERP_MIGRATE_TOKEN || secrets.CPANEL_API_TOKEN }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: bash scripts/run-rateb-erp-migrations.sh

      - name: Restore super-admin auth if missing
        if: steps.deploy.outcome == 'success'
        env:
          DEPLOY_SITE_URL: ${{ secrets.DEPLOY_SITE_URL || secrets.CPANEL_SITE_URL || 'https://rateb.sa' }}
          CPANEL_SITE_URL: ${{ secrets.DEPLOY_SITE_URL || secrets.CPANEL_SITE_URL || 'https://rateb.sa' }}
          RATEB_ERP_MIGRATE_TOKEN: ${{ secrets.RATEB_ERP_MIGRATE_TOKEN || secrets.CPANEL_API_TOKEN }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          RATEB_RESTORE_SUPER_ADMINS_AUTO: "1"
        run: bash scripts/run-restore-super-admins.sh

      - name: Run RCC migrations
        if: steps.deploy.outcome == 'success'
        env:
          DEPLOY_SITE_URL: ${{ secrets.DEPLOY_SITE_URL || secrets.CPANEL_SITE_URL || 'https://rateb.sa' }}
          CPANEL_SITE_URL: ${{ secrets.DEPLOY_SITE_URL || secrets.CPANEL_SITE_URL || 'https://rateb.sa' }}
          RCC_MIGRATE_TOKEN: ${{ secrets.RCC_MIGRATE_TOKEN || secrets.RATEB_ERP_MIGRATE_TOKEN || secrets.CPANEL_API_TOKEN }}
          RATEB_ERP_MIGRATE_TOKEN: ${{ secrets.RATEB_ERP_MIGRATE_TOKEN || secrets.CPANEL_API_TOKEN }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: bash scripts/run-rcc-migrations.sh

      - name: Start RCC Realtime Hub (WebSocket)
        if: steps.deploy.outcome == 'success'
        env:
          DEPLOY_SITE_URL: ${{ secrets.DEPLOY_SITE_URL || secrets.CPANEL_SITE_URL || 'https://rateb.sa' }}
          CPANEL_SITE_URL: ${{ secrets.DEPLOY_SITE_URL || secrets.CPANEL_SITE_URL || 'https://rateb.sa' }}
          RATEB_ERP_MIGRATE_TOKEN: ${{ secrets.RATEB_ERP_MIGRATE_TOKEN || secrets.CPANEL_API_TOKEN }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
          DEPLOY_REMOTE_BASE: ${{ secrets.DEPLOY_REMOTE_BASE || secrets.CPANEL_SFTP_REMOTE_DIR || '/home/admin/domains/rateb.sa/public_html' }}
        run: bash scripts/run-rcc-realtime-hub.sh

      - name: Purge LiteSpeed cache
        if: steps.deploy.outcome == 'success'
        run: |
          SITE="${{ secrets.DEPLOY_SITE_URL || secrets.CPANEL_SITE_URL || 'https://rateb.sa' }}"
          PURGE="$(curl -sS -o /dev/null -w "%{http_code}" -L --connect-timeout 15 --max-time 30 \
            "${SITE}/pages/rateb-purge-cache.php?key=rateb-deploy-sync-2026" 2>/dev/null || echo 000)"
          echo "litespeed_purge_http=${PURGE}"
          if [ "$PURGE" != "302" ] && [ "$PURGE" != "200" ]; then
            echo "::warning::LiteSpeed purge returned HTTP ${PURGE} — purge manually in cPanel if /home still shows old HTML"
          fi

      - name: Run RATEB ERP enterprise certification
        if: steps.deploy.outcome == 'success'
        env:
          DEPLOY_SITE_URL: ${{ secrets.DEPLOY_SITE_URL || secrets.CPANEL_SITE_URL || 'https://rateb.sa' }}
          CPANEL_SITE_URL: ${{ secrets.DEPLOY_SITE_URL || secrets.CPANEL_SITE_URL || 'https://rateb.sa' }}
          RATEB_ERP_MIGRATE_TOKEN: ${{ secrets.RATEB_ERP_MIGRATE_TOKEN || secrets.CPANEL_API_TOKEN }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          RATEB_ENTERPRISE_SEED: ${{ vars.RATEB_ENTERPRISE_SEED || '0' }}
        run: bash scripts/run-rateb-erp-enterprise-cert.sh

      - name: Verify live site (~20s)
        if: steps.deploy.outcome == 'success'
        run: |
          SITE="${{ secrets.DEPLOY_SITE_URL || secrets.CPANEL_SITE_URL || 'https://rateb.sa' }}"
          # Unified marketing at / — /home 301→/. Must follow redirects (-L).
          code() {
            local out code_try=1 max_tries=4
            while [ "$code_try" -le "$max_tries" ]; do
              out="$(curl -sS -o /dev/null -w "%{http_code}" -L --connect-timeout 12 --max-time 45 \
                -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$1" 2>/dev/null || true)"
              if [ -n "$out" ] && [ "$out" != "000" ]; then
                echo "$out"
                return 0
              fi
              code_try=$((code_try + 1))
              sleep 3
            done
            echo "${out:-000}"
          }
          LIVE_BUILD="$(curl -sS -L --connect-timeout 8 --max-time 15 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            "${SITE}/public/rateb-build.txt?deploy_verify=$(date +%s)" 2>/dev/null | tr -d '\r\n' || true)"
          if ! echo "$LIVE_BUILD" | grep -q 'rateb-'; then
            LIVE_BUILD="$(curl -sS -L --connect-timeout 8 --max-time 20 -H 'Cache-Control: no-cache' \
              "${SITE}/pages/rateb-rebrand-status.php" 2>/dev/null | sed -n 's/^build=//p' | head -1 | tr -d '\r\n' || true)"
          fi
          P="$(code "${SITE}/profile/?_deploy_verify=$(date +%s)")"
          if [ "$P" = "000" ]; then
            P="$(code "${SITE}/pages/about.php?_deploy_verify=$(date +%s)")"
            echo "::warning::profile/ unreachable from CI; using pages/about.php HTTP=$P"
          fi
          G="$(code "${SITE}/js/pages/rateb-profile-nav-guard.js")"
          ROOT="$(code "${SITE}/")"
          H="$(code "${SITE}/home")"
          HLEG="$(code "${SITE}/pages/home.php")"
          REG_URL="${SITE}/site/register?_deploy_verify=1"
          HR="$(code "${REG_URL}")"
          REG_BODY="$(curl -sS -L --connect-timeout 10 --max-time 35 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${REG_URL}" 2>/dev/null | head -c 250000 || true)"
          echo "profile/=$P root/=$ROOT home(redirect)=$H home.php(legacy)=$HLEG register=$HR guard.js=$G live_build=${LIVE_BUILD}"
          GOV_URL="${SITE}/public/cms-bundle-gov-control-v2.png?deploy_verify=$(date +%s)"
          GOV_HTTP="$(code "${GOV_URL}")"
          GOV_BYTES="$(curl -sS -L --connect-timeout 8 --max-time 20 -H 'Cache-Control: no-cache' "${GOV_URL}" 2>/dev/null | wc -c | tr -d ' ')"
          GOV_MAGIC="$(curl -sS -L --connect-timeout 8 --max-time 20 -H 'Cache-Control: no-cache' "${GOV_URL}" 2>/dev/null | head -c 3 | xxd -p 2>/dev/null || echo 000000)"
          echo "gov-control-v2 http=${GOV_HTTP} bytes=${GOV_BYTES} magic=${GOV_MAGIC}"
          if [ "${GOV_BYTES:-0}" -lt 80000 ] || [ "${GOV_BYTES:-0}" -gt 150000 ]; then
            echo "::error::gov-control-v2 bundle wrong size (${GOV_BYTES} bytes) — image deploy broken"
            exit 1
          fi
          if [ "$GOV_MAGIC" != "ffd8ff" ] && [ "$GOV_MAGIC" != "89504e" ]; then
            echo "::error::gov-control-v2 not a valid image (magic ${GOV_MAGIC})"
            exit 1
          fi
          HOME_URL="${SITE}/?_deploy_verify=1"
          HOME_RAW="$(curl -sS -L --connect-timeout 8 --max-time 25 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            "${HOME_URL}" 2>/dev/null | head -c 250000 || true)"
          BRAND_FAIL=0
          if ! grep -qi '<!DOCTYPE' <<< "$HOME_RAW"; then
            echo "::error::marketing home (/) did not return HTML (body=${HOME_RAW:0:200})"
            exit 1
          fi
          if grep -qi 'RATEB Company' <<< "$HOME_RAW"; then
            echo "::error::home still contains RATEB Company"
            BRAND_FAIL=1
          fi
          if grep -q 'Workforce Intelligence</span>' <<< "$HOME_RAW"; then
            echo "::error::home hero still uses Workforce Intelligence (stale CMS title)"
            BRAND_FAIL=1
          fi
          if grep -q 'Software Foundation for Information Technology' <<< "$HOME_RAW"; then
            echo "::error::home still shows Software Foundation legal line"
            BRAND_FAIL=1
          fi
          if grep -q 'rateb-marketing' <<< "$HOME_RAW" && grep -q 'rateb-mkt-hero' <<< "$HOME_RAW"; then
            echo "marketing_shell=ok"
          else
            echo "::error::unified marketing home missing rateb-marketing / rateb-mkt-hero"
            BRAND_FAIL=1
          fi
          if grep -q 'rateb-mkt-header' <<< "$HOME_RAW"; then
            echo "marketing_header=ok"
          else
            echo "::error::unified home missing rateb-mkt-header"
            BRAND_FAIL=1
          fi
          if grep -qE 'locale/en|locale/ar' <<< "$HOME_RAW"; then
            echo "locale_switch=ok"
          else
            echo "::error::unified home missing EN/AR locale switch links"
            BRAND_FAIL=1
          fi
          if grep -q 'data-mkt-theme' <<< "$HOME_RAW"; then
            echo "theme_toggle=ok"
          else
            echo "::error::unified home missing light/dark theme toggle"
            BRAND_FAIL=1
          fi
          if grep -qiE 'country_slug=home|Country not found' <<< "$HOME_RAW"; then
            echo "::error::/home wrongly routed as country slug (check .htaccess home rule order)"
            BRAND_FAIL=1
          fi
          ERP_HEALTH_CLEAN="$(curl -sS -o /tmp/erp-health.json -w "%{http_code}" --connect-timeout 8 --max-time 30 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            "${SITE}/rateb-erp/public/erp-health.php" 2>/dev/null || echo "000")"
          ERP_HEALTH_CANON="$(curl -sS -o /dev/null -w "%{http_code}" -L --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            "${SITE}/erp-health.php?deploy_verify=$(date +%s)" 2>/dev/null || echo "000")"
          echo "erp-health-clean=$ERP_HEALTH_CLEAN erp-health-canonical=$ERP_HEALTH_CANON"
          if [ "$ERP_HEALTH_CLEAN" != "200" ] || [ "$ERP_HEALTH_CANON" != "200" ]; then
            echo "::error::ERP health probes failed (clean=$ERP_HEALTH_CLEAN canonical=$ERP_HEALTH_CANON)"
            BRAND_FAIL=1
          elif ! grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/erp-health.json 2>/dev/null; then
            echo "::error::ERP health body missing status ok: $(head -c 180 /tmp/erp-health.json 2>/dev/null)"
            BRAND_FAIL=1
          else
            echo "erp_health=ok"
          fi
          ERP_PROBE_BLOCKED="$(curl -sS -o /tmp/erp-health-probe.json -w "%{http_code}" --connect-timeout 8 --max-time 15 \
            "${SITE}/rateb-erp/public/erp-health.php?probe=branch-ops" 2>/dev/null || echo "000")"
          if [ "$ERP_PROBE_BLOCKED" = "200" ]; then
            echo "::error::ERP branch-ops health probe must be blocked (got HTTP 200)"
            BRAND_FAIL=1
          else
            echo "erp_health_probe_blocked=ok"
          fi
          if [ -n "$LIVE_BUILD" ]; then
            echo "rebrand_build_marker=ok"
          else
            echo "::warning::rateb-build.txt empty or unreachable; verify HTML rebrand= comment matches git"
          fi
          [ "$BRAND_FAIL" -eq 1 ] && exit 1
          REGISTER_OK=0
          if [ "$HR" = "200" ]; then
            REGISTER_OK=1
          elif grep -qi '<!DOCTYPE' <<< "$REG_BODY"; then
            echo "::warning::register HTTP=$HR but body is HTML (treating as OK)"
            REGISTER_OK=1
          fi
          if [ "$P" = "200" ] && [ "$G" = "200" ] && [ "$ROOT" = "200" ] && [ "$H" = "200" ] && [ "$REGISTER_OK" -eq 1 ]; then
            MKTCSS="$(code "${SITE}/rateb-erp/public/assets/css/marketing.css")"
            echo "marketing.css=$MKTCSS"
            if [ "$MKTCSS" != "200" ]; then
              echo "::error::rateb-erp/public/assets/css/marketing.css returned $MKTCSS"
              exit 1
            fi
            if grep -qi '<!DOCTYPE' <<< "$REG_BODY"; then
              if grep -q 'rateb-mkt-form' <<< "$REG_BODY"; then
                echo "::notice::Deploy OK (unified marketing + site/register form)"
                exit 0
              fi
              echo "::notice::Deploy OK (unified marketing home HTML)"
              exit 0
            fi
            echo "::error::site/register returned non-HTML (likely PHP fatal): ${REG_BODY:0:160}"
            exit 1
          fi
          echo "::error::verify failed profile/=$P root/=$ROOT home=$H home.php(legacy)=$HLEG guard.js=$G register=$HR body=${REG_BODY:0:160}"
          exit 1

      - name: Deploy failed
        if: steps.deploy.outcome != 'success'
        run: |
          echo "::error::Deploy failed — see rsync / Fileman logs above"
          exit 1
