name: Deploy PHP App to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  trigger-cpanel-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate cPanel API secrets
        run: |
          if [ -z "${{ secrets.CPANEL_HOST }}" ]; then echo "Missing CPANEL_HOST"; exit 1; fi
          if [ -z "${{ secrets.CPANEL_USER }}" ]; then echo "Missing CPANEL_USER"; exit 1; fi
          if [ -z "${{ secrets.CPANEL_API_TOKEN }}" ]; then echo "Missing CPANEL_API_TOKEN"; exit 1; fi
          if [ -z "${{ secrets.CPANEL_REPO_ROOT }}" ]; then echo "Missing CPANEL_REPO_ROOT"; exit 1; fi

      - name: Deploy to cPanel
        run: |
          CPANEL_BASE_URL="https://${{ secrets.CPANEL_HOST }}:2083"
          AUTH_HEADER="Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_API_TOKEN }}"

          call_cpanel_api() {
            local ep="$1"
            shift
            curl -fsSL --get --retry 3 --retry-delay 2 \
              --connect-timeout 15 --max-time 90 \
              -H "$AUTH_HEADER" \
              "$@" \
              "${CPANEL_BASE_URL}/execute/${ep}"
          }

          CLEAN_REPO_ROOT="$(printf '%s' "${{ secrets.CPANEL_REPO_ROOT }}" | tr -d '\r\n' | xargs)"
          CLEAN_BRANCH="$(printf '%s' "${{ github.ref_name }}" | tr -d '\r\n' | xargs)"
          [ -z "$CLEAN_BRANCH" ] && CLEAN_BRANCH="main"

          call_cpanel_api "VersionControl/update" \
            --data-urlencode "repository_root=$CLEAN_REPO_ROOT" \
            --data-urlencode "branch=$CLEAN_BRANCH" || true

          RESPONSE="$(call_cpanel_api "VersionControlDeployment/create" \
            --data-urlencode "repository_root=$CLEAN_REPO_ROOT")"
          echo "$RESPONSE"
          STATUS="$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('result',d) or {}; print(r.get('status', d.get('status',0)))")"
          if [ "$STATUS" != "1" ]; then
            echo "::error::cPanel deploy failed (status=$STATUS). In cPanel: Git → Deploy HEAD Commit"
            exit 1
          fi

      - name: Wait for cPanel task
        run: sleep 20

      - name: Live health check (must pass for green)
        run: |
          check() {
            curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 12 --max-time 30 "$1" 2>/dev/null || echo "000"
          }
          for attempt in 1 2 3; do
            HOME_CODE="$(check https://out.ratib.sa/pages/home.php)"
            CSS_CODE="$(check https://out.ratib.sa/css/pages/home-public.css)"
            echo "attempt=$attempt home=$HOME_CODE css=$CSS_CODE"
            if [ "$HOME_CODE" = "200" ] && [ "$CSS_CODE" = "200" ]; then
              echo "::notice::Site healthy (home + CSS OK)"
              exit 0
            fi
            if [ "$HOME_CODE" = "403" ] || [ "$CSS_CODE" = "403" ]; then
              echo "::error::403 Forbidden — Apache cannot read .htaccess or CSS."
              echo "cPanel File Manager → public_html → .htaccess → Permissions 644"
              echo "Then recurse: folders 755, files 644 on public_html"
              echo "Or open: https://out.ratib.sa/pages/ratib-fix-perms.php?run=1&key=ratib-deploy-sync-2026"
              exit 1
            fi
            sleep 15
          done
          echo "::error::Site not healthy after deploy (home or CSS not 200). Fix permissions before pushing again."
          exit 1

      - name: Optional Profile curl sync
        if: ${{ secrets.RATIB_DEPLOY_SYNC_KEY != '' }}
        continue-on-error: true
        run: |
          curl -fsSL --max-time 120 \
            "https://out.ratib.sa/pages/ratib-profile-deploy.php?deploy=1&key=${{ secrets.RATIB_DEPLOY_SYNC_KEY }}" || true
