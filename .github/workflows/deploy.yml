name: Deploy PHP App to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel older runs when you push again — stops the long queue.
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build marker
        id: build
        run: |
          EXPECTED="$(tr -d '\r\n' < public/ratib-build.txt)"
          echo "expected=${EXPECTED}" >> "$GITHUB_OUTPUT"
          echo "Deploy marker: ${EXPECTED}"

      - name: Upload ALL files to public_html (Fileman parallel sync)
        id: fileman
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_REMOTE_BASE: ${{ secrets.CPANEL_SFTP_REMOTE_DIR || '/home/outratib/public_html' }}
          CPANEL_FILEMAN_WORKERS: "12"
        run: bash scripts/github-cpanel-fileman-fast.sh

      - name: cPanel Git pull (background, optional)
        id: cpanel
        continue-on-error: true
        run: |
          CPANEL_PORT="${{ secrets.CPANEL_PORT }}"
          CPANEL_PORT="${CPANEL_PORT:-2083}"
          AUTH="Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_API_TOKEN }}"
          REPO="$(printf '%s' '${{ secrets.CPANEL_REPO_ROOT }}' | tr -d '\r\n' | xargs)"
          BRANCH="${{ github.ref_name }}"
          BASE="https://${{ secrets.CPANEL_HOST }}:${CPANEL_PORT}/execute"
          curl -sS --max-time 60 -H "$AUTH" --get \
            --data-urlencode "repository_root=$REPO" \
            --data-urlencode "branch=$BRANCH" \
            "${BASE}/VersionControl/update" | head -c 800 || true
          curl -sS --max-time 90 -H "$AUTH" --get \
            --data-urlencode "repository_root=$REPO" \
            --data-urlencode "branch=$BRANCH" \
            "${BASE}/VersionControlDeployment/create" | head -c 800 || true
          echo "cpanel_ok=true" >> "$GITHUB_OUTPUT"

      - name: Quick verify (~30s max)
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.build.outputs.expected }}"
          SITE="${{ secrets.CPANEL_SITE_URL || 'https://out.ratib.sa' }}"
          FILEMAN_OK="${{ steps.fileman.outcome == 'success' && 'yes' || 'no' }}"

          code() { curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 8 --max-time 20 "$1" 2>/dev/null || echo 000; }

          for n in 1 2 3; do
            MARKER="$(curl -fsSL --max-time 15 "${SITE}/public/ratib-build.txt" 2>/dev/null | tr -d '\r\n' || true)"
            H="$(code "${SITE}/pages/home.php")"
            P="$(code "${SITE}/profile/")"
            echo "try=$n home=$H profile/=$P marker=${MARKER:-?} want=${EXPECTED} fileman=${FILEMAN_OK}"

            if [ "$FILEMAN_OK" = "yes" ] && [ "$H" = "200" ] && [ "$P" = "200" ]; then
              if [ "$MARKER" = "$EXPECTED" ]; then
                echo "::notice::Deploy OK — marker match"
                exit 0
              fi
              if [ "$n" -ge 2 ]; then
                echo "::notice::Deploy OK — Fileman succeeded, site up (marker may lag CDN: live=${MARKER})"
                exit 0
              fi
            fi
            sleep 8
          done

          echo "::error::Deploy failed. fileman=${FILEMAN_OK} live_marker=${MARKER:-missing} want=${EXPECTED}"
          exit 1
