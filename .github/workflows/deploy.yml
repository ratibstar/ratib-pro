name: Deploy PHP App to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Upload all code files (shows % progress). Default = critical only (~2 min)."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload to public_html (Fileman + progress %)
        id: fileman
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_REMOTE_BASE: ${{ secrets.CPANEL_SFTP_REMOTE_DIR || '/home/outratib/public_html' }}
          CPANEL_DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.full_sync == 'true' && 'all' || 'critical' }}
        run: bash scripts/github-cpanel-fileman-deploy.sh

      - name: Verify live site
        if: steps.fileman.outcome == 'success'
        run: |
          SITE="${{ secrets.CPANEL_SITE_URL || 'https://out.ratib.sa' }}"
          code() { curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 25 "$1" 2>/dev/null || echo 000; }
          sleep 3
          P="$(code "${SITE}/profile/")"
          PI="$(code "${SITE}/profile/index.php")"
          G="$(code "${SITE}/js/pages/ratib-profile-nav-guard.js")"
          MARKER="$(curl -sS --connect-timeout 10 --max-time 20 "${SITE}/pages/deploy-root.php" 2>/dev/null | grep '^git_marker=' | cut -d= -f2- || true)"
          echo "profile/=$P profile/index.php=$PI guard.js=$G git_marker=${MARKER}"
          if [ "$P" = "200" ] && [ "$PI" = "200" ] && [ "$G" = "200" ]; then
            echo "::notice::Deploy OK"
            exit 0
          fi
          echo "::error::verify failed profile/=$P profile/index.php=$PI guard.js=$G"
          exit 1

      - name: Deploy failed
        if: steps.fileman.outcome != 'success'
        run: |
          echo "::error::Fileman upload failed — see log above for [N/TOTAL] % lines and FAIL entries"
          exit 1
