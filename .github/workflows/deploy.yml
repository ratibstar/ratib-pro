name: Deploy PHP App (DirectAdmin rsync / cPanel)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Full upload (~5 min). Default = fast deploy (baseline + commit-changed paths, ~1–2 min)."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      infra_only:
        description: "Upload only scripts/infra-deploy-23-files.list (PHP/sql/sh). Use after a failed infra bundle push."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: rateb.sa
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Deploy to public_html
        id: deploy
        env:
          DEPLOY_BACKEND: ${{ secrets.DEPLOY_BACKEND || 'rsync' }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
          DEPLOY_REMOTE_BASE: ${{ secrets.DEPLOY_REMOTE_BASE || secrets.CPANEL_SFTP_REMOTE_DIR || '/home/admin/public_html' }}
          DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.infra_only == 'true' && 'list' || (github.event_name == 'workflow_dispatch' && inputs.full_sync == 'true' && 'critical' || 'fast') }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_REMOTE_BASE: ${{ secrets.CPANEL_SFTP_REMOTE_DIR || '/home/admin/public_html' }}
          CPANEL_DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.infra_only == 'true' && 'list' || (github.event_name == 'workflow_dispatch' && inputs.full_sync == 'true' && 'critical' || 'fast') }}
          RATEB_ERP_MIGRATE_TOKEN: ${{ secrets.RATEB_ERP_MIGRATE_TOKEN || secrets.CPANEL_API_TOKEN }}
        run: |
          MODE="${DEPLOY_MODE}"
          export DEPLOY_MODE="${MODE}" CPANEL_DEPLOY_MODE="${MODE}"
          if [ "${DEPLOY_BACKEND}" = "cpanel" ] && [ -n "${CPANEL_API_TOKEN:-}" ]; then
            echo "backend=cpanel (Fileman API)"
            bash scripts/github-cpanel-fileman-deploy.sh
          else
            echo "backend=rsync (DirectAdmin / SSH)"
            bash scripts/github-rsync-deploy.sh
          fi

      - name: Run RATEB ERP migrations
        if: steps.deploy.outcome == 'success'
        env:
          CPANEL_SITE_URL: ${{ secrets.DEPLOY_SITE_URL || secrets.CPANEL_SITE_URL || 'https://rateb.sa' }}
          RATEB_ERP_MIGRATE_TOKEN: ${{ secrets.RATEB_ERP_MIGRATE_TOKEN || secrets.CPANEL_API_TOKEN }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: bash scripts/run-rateb-erp-migrations.sh

      - name: Verify live site (~20s)
        if: steps.deploy.outcome == 'success'
        run: |
          SITE="${{ secrets.DEPLOY_SITE_URL || secrets.CPANEL_SITE_URL || 'https://rateb.sa' }}"
          # home.php 302-redirects to /home — must follow redirects (-L). /home must NOT hit country_slug=home.
          code() {
            local out code_try=1
            while [ "$code_try" -le 2 ]; do
              out="$(curl -sS -o /dev/null -w "%{http_code}" -L --connect-timeout 10 --max-time 30 "$1" 2>/dev/null || true)"
              if [ -n "$out" ] && [ "$out" != "000" ]; then
                echo "$out"
                return 0
              fi
              code_try=$((code_try + 1))
              sleep 2
            done
            echo "${out:-000}"
          }
          # Bypass LiteSpeed HTML cache before register/home probes.
          LIVE_BUILD="$(curl -sS -L --connect-timeout 8 --max-time 15 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            "${SITE}/public/rateb-build.txt?deploy_verify=$(date +%s)" 2>/dev/null | tr -d '\r\n' || true)"
          if ! echo "$LIVE_BUILD" | grep -q 'rateb-'; then
            LIVE_BUILD="$(curl -sS -L --connect-timeout 8 --max-time 20 -H 'Cache-Control: no-cache' \
              "${SITE}/pages/rateb-rebrand-status.php" 2>/dev/null | sed -n 's/^build=//p' | head -1 | tr -d '\r\n' || true)"
          fi
          P="$(code "${SITE}/profile/")"
          G="$(code "${SITE}/js/pages/rateb-profile-nav-guard.js")"
          H="$(code "${SITE}/home")"
          HLEG="$(code "${SITE}/pages/home.php")"
          REG="${SITE}/home?open=register&plan=gold&years=1&_deploy_verify=1"
          if [ -n "$LIVE_BUILD" ]; then
            REG="${SITE}/home?v=${LIVE_BUILD}&open=register&plan=gold&years=1&_deploy_verify=1"
          fi
          HR="$(code "${REG}")"
          BODY="$(curl -sS -L --connect-timeout 10 --max-time 35 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${REG}" 2>/dev/null | head -c 250000 || true)"
          echo "profile/=$P home=$H home.php(legacy)=$HLEG register=$HR guard.js=$G live_build=${LIVE_BUILD}"
          GOV_BYTES="$(curl -sS -L --connect-timeout 8 --max-time 20 "${SITE}/public/cms-bundle-gov-control-v2.png" 2>/dev/null | wc -c | tr -d ' ')"
          GOV_MAGIC="$(curl -sS -L --connect-timeout 8 --max-time 20 "${SITE}/public/cms-bundle-gov-control-v2.png" 2>/dev/null | head -c 3 | xxd -p 2>/dev/null || echo 000000)"
          echo "gov-control-v2 bytes=${GOV_BYTES} magic=${GOV_MAGIC}"
          if [ "${GOV_BYTES:-0}" -lt 80000 ] || [ "${GOV_BYTES:-0}" -gt 150000 ]; then
            echo "::error::gov-control-v2 bundle wrong size (${GOV_BYTES} bytes) — image deploy broken"
            exit 1
          fi
          if [ "$GOV_MAGIC" != "ffd8ff" ] && [ "$GOV_MAGIC" != "89504e" ]; then
            echo "::error::gov-control-v2 not a valid image (magic ${GOV_MAGIC})"
            exit 1
          fi
          HOME_URL="${SITE}/home"
          if [ -n "$LIVE_BUILD" ]; then
            HOME_URL="${HOME_URL}?v=${LIVE_BUILD}&_deploy_verify=1"
          else
            HOME_URL="${HOME_URL}?_deploy_verify=1"
          fi
          HOME_RAW="$(curl -sS -L --connect-timeout 8 --max-time 25 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            "${HOME_URL}" 2>/dev/null | head -c 250000 || true)"
          BRAND_FAIL=0
          if ! grep -qi '<!DOCTYPE' <<< "$HOME_RAW"; then
            echo "::error::home did not return HTML (body=${HOME_RAW:0:200})"
            exit 1
          fi
          # Use grep <<< "$var" (not echo "$var" | grep) — large HTML + grep -q closes the pipe early → SIGPIPE noise.
          if grep -qi 'RATEB Company' <<< "$HOME_RAW"; then
            echo "::error::home still contains RATEB Company"
            BRAND_FAIL=1
          fi
          if grep -q 'Workforce Intelligence</span>' <<< "$HOME_RAW"; then
            echo "::error::home hero still uses Workforce Intelligence (stale CMS title)"
            BRAND_FAIL=1
          fi
          if grep -q 'Software Foundation for Information Technology' <<< "$HOME_RAW"; then
            echo "::error::home still shows Software Foundation legal line"
            BRAND_FAIL=1
          fi
          if grep -qE 'Telemetry Enterprise Base|rateb-brand-full__word--w3' <<< "$HOME_RAW"; then
            echo "hero_expansion=ok"
          else
            echo "::error::home hero missing Telemetry Enterprise Base expansion"
            BRAND_FAIL=1
          fi
          if grep -qiE 'country_slug=home|Country not found' <<< "$HOME_RAW"; then
            echo "::error::/home wrongly routed as country slug (check .htaccess home rule order)"
            BRAND_FAIL=1
          fi
          if grep -q 'rateb-public-header-pin' <<< "$HOME_RAW"; then
            echo "header_pin_markup=ok"
          else
            echo "::error::home missing rateb-public-header-pin (sticky header chrome)"
            BRAND_FAIL=1
          fi
          if [ -n "$LIVE_BUILD" ]; then
            echo "rebrand_build_marker=ok"
          else
            echo "::warning::rateb-build.txt empty or unreachable; verify HTML rebrand= comment matches git"
          fi
          [ "$BRAND_FAIL" -eq 1 ] && exit 1
          REGISTER_OK=0
          if [ "$HR" = "200" ]; then
            REGISTER_OK=1
          elif grep -qi '<!DOCTYPE' <<< "$BODY"; then
            echo "::warning::register HTTP=$HR but body is HTML (treating as OK)"
            REGISTER_OK=1
          fi
          if [ "$P" = "200" ] && [ "$G" = "200" ] && [ "$H" = "200" ] && [ "$REGISTER_OK" -eq 1 ]; then
            HOMECSS="$(code "${SITE}/css/pages/home-public.css")"
            echo "home-public.css=$HOMECSS"
            if [ "$HOMECSS" != "200" ]; then
              echo "::error::css/pages/home-public.css returned $HOMECSS (check .htaccess does not rewrite /css/pages/ as country_slug)"
              exit 1
            fi
            if grep -qi '<!DOCTYPE' <<< "$BODY"; then
              if grep -q 'register-section-hidden rateb-register-wrap' <<< "$BODY"; then
                echo "::error::register section still hidden with open=register (deploy home.php?)"
                exit 1
              fi
              if grep -q 'openRegister.:true' <<< "$BODY"; then
                echo "::notice::Deploy OK (home HTML + openRegister)"
                exit 0
              fi
              echo "::notice::Deploy OK (home returns HTML after redirect)"
              exit 0
            fi
            echo "::error::home.php returned 200 but not HTML (likely PHP fatal): ${BODY:0:160}"
            exit 1
          fi
          echo "::error::verify failed profile/=$P home=$H home.php(legacy)=$HLEG guard.js=$G body=${BODY:0:160}"
          exit 1

      - name: Deploy failed
        if: steps.deploy.outcome != 'success'
        run: |
          echo "::error::Deploy failed — see rsync / Fileman logs above"
          exit 1
