name: Temporary read-only fetch ai.rateb.sa

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    environment: rateb.sa
    timeout-minutes: 20
    steps:
      - name: Copy /home/admin/domains/ai.rateb.sa read-only
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH_HOST}" ] || [ -z "${DEPLOY_SSH_USER}" ] || [ -z "${DEPLOY_SSH_PRIVATE_KEY}" ]; then
            echo "::error::SSH secret is missing (host, user, or private key)"
            exit 1
          fi
          KEY_PATH="${RUNNER_TEMP}/rateb-readonly-key"
          export KEY_PATH
          python3 - << 'PY'
          import os, stat
          key = (os.environ.get("DEPLOY_SSH_PRIVATE_KEY") or os.environ.get("SSH_PRIVATE_KEY") or "").strip()
          if not key:
              raise SystemExit("SSH private key secret is missing")
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")
          path = os.environ["KEY_PATH"]
          with open(path, "w", encoding="utf-8", newline="\n") as handle:
              handle.write(key)
              if not key.endswith("\n"):
                  handle.write("\n")
          os.chmod(path, stat.S_IRUSR | stat.S_IWUSR)
          PY
          cleanup() { rm -f "${KEY_PATH}"; }
          trap cleanup EXIT
          PORT="${DEPLOY_SSH_PORT:-22}"
          SSH=(ssh -i "${KEY_PATH}" -p "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new)
          REMOTE="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          TARGET="/home/admin/domains/ai.rateb.sa"
          KIND="$("${SSH[@]}" "${REMOTE}" "if [ ! -e '${TARGET}' ]; then echo MISSING; exit 2; fi; if [ -L '${TARGET}' ]; then echo SYMLINK; exit 3; fi; if [ ! -d '${TARGET}' ]; then echo NOT_DIR; exit 4; fi; echo DIR")"
          echo "remote_path_kind=${KIND}"
          if [ "${KIND}" != "DIR" ]; then
            echo "::error::Remote path is not a plain directory (${KIND})"
            exit 1
          fi
          DEST="${GITHUB_WORKSPACE}/ai-rateb-sa-source"
          mkdir -p "${DEST}"
          rsync -rt --safe-links --omit-dir-times \
            -e "ssh -i ${KEY_PATH} -p ${PORT} -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            "${REMOTE}:${TARGET}/" \
            "${DEST}/"
          echo "local_file_count=$(find "${DEST}" -type f | wc -l)"

      - name: Upload read-only source artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-rateb-sa-source
          path: ai-rateb-sa-source
          retention-days: 1
          if-no-files-found: error
