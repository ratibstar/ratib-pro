name: Temporary media capability inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: rateb.sa
    timeout-minutes: 10
    steps:
      - name: Read schema, upload limits, and speech capability
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/rateb-readonly-key"
          export KEY_PATH
          python3 - << 'PY'
          import os, stat
          key = (os.environ.get("DEPLOY_SSH_PRIVATE_KEY") or "").strip()
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")
          path = os.environ["KEY_PATH"]
          with open(path, "w", encoding="utf-8", newline="\n") as handle:
              handle.write(key)
              if not key.endswith("\n"):
                  handle.write("\n")
          os.chmod(path, stat.S_IRUSR | stat.S_IWUSR)
          PY
          PORT="${DEPLOY_SSH_PORT:-22}"
          ssh -i "${KEY_PATH}" -p "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}" php << 'PHP'
          <?php
          require '/home/admin/.secrets/rateb-ai-env.php';
          require '/home/admin/domains/ai.rateb.sa/app/bootstrap.php';
          $cfg = require '/home/admin/domains/ai.rateb.sa/config/ai.php';
          echo 'UPLOAD_MAX=' . ini_get('upload_max_filesize') . "\n";
          echo 'POST_MAX=' . ini_get('post_max_size') . "\n";
          echo 'FILEINFO=' . (extension_loaded('fileinfo') ? 'yes' : 'no') . "\n";
          $tables = db()->query('SHOW TABLES')->fetchAll(PDO::FETCH_NUM);
          foreach ($tables as $table) {
              $name = (string) $table[0];
              echo 'TABLE=' . $name . "\n";
              $cols = db()->query('SHOW COLUMNS FROM `' . str_replace('`', '', $name) . '`')->fetchAll();
              foreach ($cols as $col) {
                  echo 'COLUMN=' . $name . ' ' . $col['Field'] . ' ' . $col['Type'] . ' null=' . $col['Null'] . ' key=' . $col['Key'] . "\n";
              }
          }
          $redact = static function ($value): string {
              $text = (string) $value;
              $text = preg_replace('/sk-[A-Za-z0-9_\-]{6,}/', 'sk-REDACTED', $text) ?? $text;
              $text = preg_replace('/gsk_[A-Za-z0-9_\-]{6,}/', 'gsk_REDACTED', $text) ?? $text;
              return substr($text, 0, 160);
          };
          $base = rtrim((string) $cfg['base_url'], '/');
          $ch = curl_init($base . '/models');
          curl_setopt_array($ch, [
              CURLOPT_RETURNTRANSFER => true,
              CURLOPT_HTTPHEADER => ['Authorization: Bearer ' . $cfg['api_key']],
              CURLOPT_TIMEOUT => 30,
          ]);
          $raw = curl_exec($ch);
          echo 'MODELS_HTTP=' . curl_getinfo($ch, CURLINFO_HTTP_CODE) . "\n";
          curl_close($ch);
          $data = json_decode((string) $raw, true);
          $ids = [];
          foreach (($data['data'] ?? []) as $row) {
              if (isset($row['id'])) {
                  $ids[] = (string) $row['id'];
                  echo 'MODEL_ID=' . $row['id'] . "\n";
              }
          }
          $speechModel = in_array('canopylabs/orpheus-v1-english', $ids, true) ? 'canopylabs/orpheus-v1-english' : '';
          echo 'SPEECH_MODEL_LISTED=' . ($speechModel !== '' ? 'yes' : 'no') . "\n";
          echo 'ARABIC_SPEECH_LISTED=' . (in_array('canopylabs/orpheus-arabic-saudi', $ids, true) ? 'yes' : 'no') . "\n";
          $image = array_values(array_filter($ids, static function ($id) {
              return preg_match('/image|flux|dall|sdxl|stable|video|ltx|wan/i', $id) === 1;
          }));
          echo 'MEDIA_MODEL_IDS=' . ($image === [] ? 'none' : implode(',', $image)) . "\n";
          if ($speechModel !== '') {
              $payload = json_encode([
                  'model' => $speechModel,
                  'input' => 'Hello.',
                  'voice' => 'troy',
                  'response_format' => 'wav',
              ]);
              $ch = curl_init($base . '/audio/speech');
              curl_setopt_array($ch, [
                  CURLOPT_POST => true,
                  CURLOPT_RETURNTRANSFER => true,
                  CURLOPT_HTTPHEADER => ['Content-Type: application/json', 'Authorization: Bearer ' . $cfg['api_key']],
                  CURLOPT_POSTFIELDS => $payload,
                  CURLOPT_TIMEOUT => 60,
              ]);
              $audio = curl_exec($ch);
              $http = (int) curl_getinfo($ch, CURLINFO_HTTP_CODE);
              $type = (string) curl_getinfo($ch, CURLINFO_CONTENT_TYPE);
              curl_close($ch);
              echo 'SPEECH_HTTP=' . $http . "\n";
              echo 'SPEECH_TYPE=' . $type . "\n";
              echo 'SPEECH_BYTES=' . strlen((string) $audio) . "\n";
              echo 'SPEECH_RIFF=' . (substr((string) $audio, 0, 4) === 'RIFF' ? 'yes' : 'no') . "\n";
              if ($http !== 200) {
                  $err = json_decode((string) $audio, true);
                  $code = is_array($err) && isset($err['error']) ? ($err['error']['code'] ?? $err['error']['type'] ?? '') : '';
                  echo 'SPEECH_ERROR=' . $redact($code) . "\n";
              }
          }
          PHP
          rm -f "${KEY_PATH}"
