name: Temporary free image deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: rateb.sa
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Publish image generation and test production
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/rateb-readonly-key"
          export KEY_PATH
          python3 - << 'PY'
          import os, stat
          key = (os.environ.get("DEPLOY_SSH_PRIVATE_KEY") or "").strip()
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")
          path = os.environ["KEY_PATH"]
          with open(path, "w", encoding="utf-8", newline="\n") as handle:
              handle.write(key)
              if not key.endswith("\n"):
                  handle.write("\n")
          os.chmod(path, stat.S_IRUSR | stat.S_IWUSR)
          PY
          PORT="${DEPLOY_SSH_PORT:-22}"
          REMOTE="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          SSH=(ssh -i "${KEY_PATH}" -p "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          ROOT=/home/admin/domains/ai.rateb.sa
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          "${SSH[@]}" "${REMOTE}" "mkdir -p /home/admin/domains/ai.rateb.sa-file-backup-${STAMP}-image && cp -a ${ROOT}/campaign.php ${ROOT}/public/assets/js/app.js /home/admin/domains/ai.rateb.sa-file-backup-${STAMP}-image/ && sha256sum ${ROOT}/config/ai.php ${ROOT}/config/database.php ${ROOT}/app/ai/generate.php ${ROOT}/app/ai/voice.php > /tmp/ai-image-before.txt"
          scp -i "${KEY_PATH}" -P "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            ai-rateb-sa-source/app/ai/image.php \
            ai-rateb-sa-source/campaign.php \
            ai-rateb-sa-source/public/assets/js/app.js \
            "${REMOTE}:/tmp/"
          "${SSH[@]}" "${REMOTE}" "mkdir -p ${ROOT}/app/ai && mv /tmp/image.php ${ROOT}/app/ai/image.php && mv /tmp/campaign.php ${ROOT}/campaign.php && mv /tmp/app.js ${ROOT}/public/assets/js/app.js && php -l ${ROOT}/app/ai/image.php && php -l ${ROOT}/campaign.php && sha256sum ${ROOT}/config/ai.php ${ROOT}/config/database.php ${ROOT}/app/ai/generate.php ${ROOT}/app/ai/voice.php > /tmp/ai-image-after.txt && cmp /tmp/ai-image-before.txt /tmp/ai-image-after.txt && echo PROTECTED_UNCHANGED=yes"
          TOKEN=$(openssl rand -hex 16)
          "${SSH[@]}" "${REMOTE}" "cat > ${ROOT}/.ai-refresh-${TOKEN}.php" << EOF
          <?php
          if ((\$_GET['t'] ?? '') !== '${TOKEN}') { http_response_code(404); exit; }
          header('Content-Type: text/plain; charset=UTF-8');
          echo 'INVALIDATED=' . (function_exists('opcache_invalidate') && opcache_invalidate('${ROOT}/campaign.php', true) ? 'yes' : 'no') . "\\n";
          EOF
          curl -fsS "https://ai.rateb.sa/.ai-refresh-${TOKEN}.php?t=${TOKEN}"
          echo
          "${SSH[@]}" "${REMOTE}" "rm -f ${ROOT}/.ai-refresh-${TOKEN}.php"
          WORK="${RUNNER_TEMP}/image"
          mkdir -p "$WORK"
          python3 - << 'PY'
          import os, pathlib, secrets
          work = pathlib.Path(os.environ["RUNNER_TEMP"]) / "image"
          work.mkdir(parents=True, exist_ok=True)
          (work / "email").write_text("ai-image-" + secrets.token_hex(4) + "@rateb.sa", encoding="utf-8")
          (work / "password").write_text(secrets.token_urlsafe(18), encoding="utf-8")
          os.chmod(work / "password", 0o600)
          PY
          BASE=https://ai.rateb.sa
          COOKIE="$WORK/cookies"
          CSRF="$WORK/csrf"
          extract_csrf() {
            python3 - "$1" "$2" "$CSRF" << 'PY'
          import re, sys
          html = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          match = re.search(r'name="' + re.escape(sys.argv[2]) + r'" value="([^"]+)"', html)
          if not match:
              raise SystemExit("csrf missing")
          open(sys.argv[3], "w", encoding="utf-8").write(match.group(1))
          PY
          }
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/register.html" "$BASE/register.php"
          extract_csrf "$WORK/register.html" csrf_token
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/register.hdr" -o "$WORK/register-post.html" \
            --data-urlencode "csrf_token@${CSRF}" \
            --data-urlencode "name=Image Check" \
            --data-urlencode "email@${WORK}/email" \
            --data-urlencode "password@${WORK}/password" \
            "$BASE/register.php"
          grep -qi 'dashboard.php' "$WORK/register.hdr"
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/new.html" "$BASE/campaign-new.php"
          extract_csrf "$WORK/new.html" csrf
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/save.hdr" -o "$WORK/save.html" \
            --data-urlencode "csrf@${CSRF}" \
            --data-urlencode "title=Free image check" \
            --data-urlencode "product_name=RATEB AI Campaign" \
            --data-urlencode "description=A simple red square on a white background." \
            --data-urlencode "price=100 SAR" \
            --data-urlencode "target_customer=Small business owners" \
            "$BASE/campaign-save.php"
          CAMPAIGN_ID=$(python3 - "$WORK/save.hdr" << 'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          match = re.search(r'campaign\.php\?id=(\d+)', text)
          print(match.group(1) if match else "")
          PY
          )
          echo "CAMPAIGN_ID=${CAMPAIGN_ID}"
          test -n "$CAMPAIGN_ID"
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/campaign.html" "$BASE/campaign.php?id=${CAMPAIGN_ID}"
          grep -q 'data-i18n="text_available"' "$WORK/campaign.html"
          grep -q 'data-i18n="image_available"' "$WORK/campaign.html"
          grep -q 'id="generate-image"' "$WORK/campaign.html"
          grep -q 'data-i18n="voice_available"' "$WORK/campaign.html"
          grep -q 'id="voice"' "$WORK/campaign.html"
          grep -q 'data-i18n="provider_required"' "$WORK/campaign.html"
          grep -q 'data-i18n="video_provider_required"' "$WORK/campaign.html"
          if grep -q 'accept_model_terms' "$WORK/campaign.html"; then echo "VOICE_TERMS_BUTTON=present"; exit 1; fi
          echo "PAGE_STATES=yes"
          extract_csrf "$WORK/campaign.html" csrf
          code=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/nocsrf.json" -w '%{http_code}' \
            --data-urlencode "campaign_id=${CAMPAIGN_ID}" \
            "$BASE/app/ai/image.php")
          echo "CSRF_MISSING_HTTP=${code}"
          test "$code" = "419"
          code=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/foreign.json" -w '%{http_code}' \
            --data-urlencode "csrf@${CSRF}" \
            --data-urlencode "campaign_id=999999999" \
            "$BASE/app/ai/image.php")
          echo "FOREIGN_CAMPAIGN_HTTP=${code}"
          test "$code" = "404"
          code=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/image.json" -w '%{http_code}' --max-time 250 \
            --data-urlencode "csrf@${CSRF}" \
            --data-urlencode "campaign_id=${CAMPAIGN_ID}" \
            "$BASE/app/ai/image.php" || true)
          python3 - "$WORK/image.json" "$code" << 'PY'
          import json, re, sys
          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          try:
              data = json.loads(raw or "{}")
          except json.JSONDecodeError:
              data = {}
          error = re.sub(r"(?:sk-|gsk_)[A-Za-z0-9_\-]+", "[redacted]", str(data.get("error") or ""))[:180]
          print("IMAGE_HTTP=" + sys.argv[2])
          print("IMAGE_OK=" + ("yes" if data.get("ok") else "no"))
          print("IMAGE_MODEL=" + str(data.get("model") or ""))
          print("IMAGE_MIME=" + str(data.get("mime") or ""))
          if error:
              print("IMAGE_ERROR=" + error)
          if not data.get("ok"):
              raise SystemExit(1)
          PY
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/campaign.html" "$BASE/campaign.php?id=${CAMPAIGN_ID}"
          python3 - "$WORK/campaign.html" << 'PY'
          import re, sys
          html = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          image = re.search(r'<img\b[^>]*\bsrc="([^"]+)"', html)
          download = re.search(r'href="([^"]*download=1)"', html)
          print("PAGE_IMAGE=" + ("yes" if image else "no"))
          print("PAGE_DOWNLOAD=" + ("yes" if download else "no"))
          if not image or not download:
              raise SystemExit(1)
          open(sys.argv[1] + ".src", "w", encoding="utf-8").write(image.group(1).replace("&amp;", "&"))
          open(sys.argv[1] + ".dl", "w", encoding="utf-8").write(download.group(1).replace("&amp;", "&"))
          PY
          SRC=$(cat "$WORK/campaign.html.src")
          DL=$(cat "$WORK/campaign.html.dl")
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/preview.hdr" -o "$WORK/preview.bin" "https://ai.rateb.sa${SRC}"
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/download.hdr" -o "$WORK/download.bin" "https://ai.rateb.sa${DL}"
          python3 - "$WORK/preview.hdr" "$WORK/preview.bin" "$WORK/download.hdr" "$WORK/download.bin" << 'PY'
          import sys
          def read(header_path, body_path):
              header = open(header_path, encoding="utf-8", errors="replace").read().lower()
              data = open(body_path, "rb").read()
              status = "0"
              ctype = ""
              disposition = ""
              for line in header.splitlines():
                  if line.startswith("http/"):
                      parts = line.split()
                      if len(parts) > 1:
                          status = parts[1]
                  if line.startswith("content-type:"):
                      ctype = line.split(":", 1)[1].strip()
                  if line.startswith("content-disposition:"):
                      disposition = line.split(":", 1)[1].strip()
              webp = data[:4] == b"RIFF" and data[8:12] == b"WEBP"
              jpeg = data[:3] == b"\xff\xd8\xff"
              png = data[:8] == b"\x89PNG\r\n\x1a\n"
              return status, ctype, disposition, len(data), webp or jpeg or png
          status, ctype, disposition, size, image = read(sys.argv[1], sys.argv[2])
          print("PREVIEW_HTTP=" + status)
          print("PREVIEW_TYPE=" + ctype)
          print("PREVIEW_BYTES=" + str(size))
          print("PREVIEW_IMAGE=" + ("yes" if image else "no"))
          dstatus, dctype, ddisp, dsize, dimage = read(sys.argv[3], sys.argv[4])
          print("DOWNLOAD_HTTP=" + dstatus)
          print("DOWNLOAD_TYPE=" + dctype)
          print("DOWNLOAD_DISPOSITION=" + ("attachment" if "attachment" in ddisp else "other"))
          print("DOWNLOAD_BYTES=" + str(dsize))
          print("DOWNLOAD_IMAGE=" + ("yes" if dimage else "no"))
          if status != "200" or dstatus != "200" or not image or not dimage or "attachment" not in ddisp:
              raise SystemExit(1)
          PY
          "${SSH[@]}" "${REMOTE}" "export CAMPAIGN_ID=${CAMPAIGN_ID}; php" << 'PHP'
          <?php
          require '/home/admin/domains/ai.rateb.sa/app/bootstrap.php';
          $id = (int) getenv('CAMPAIGN_ID');
          $stmt = db()->prepare("SELECT id, kind, source, mime, bytes, stored_name FROM campaign_media WHERE campaign_id = ? AND source = 'ai' AND kind = 'image' ORDER BY id DESC LIMIT 1");
          $stmt->execute([$id]);
          $row = $stmt->fetch();
          if (!$row) {
              echo "MEDIA_ROW=no\n";
              exit(1);
          }
          $path = '/home/admin/.campaign-media/' . $id . '/' . $row['stored_name'];
          $head = is_file($path) ? (string) file_get_contents($path, false, null, 0, 12) : '';
          $webp = str_starts_with($head, 'RIFF') && substr($head, 8, 4) === 'WEBP';
          $jpeg = str_starts_with($head, "\xFF\xD8\xFF");
          $png = str_starts_with($head, "\x89PNG\r\n\x1a\n");
          echo "MEDIA_ROW=yes\n";
          echo 'MEDIA_KIND=' . $row['kind'] . "\n";
          echo 'MEDIA_SOURCE=' . $row['source'] . "\n";
          echo 'MEDIA_MIME=' . $row['mime'] . "\n";
          echo 'MEDIA_BYTES=' . $row['bytes'] . "\n";
          echo 'DISK_IMAGE=' . ($webp || $jpeg || $png ? 'yes' : 'no') . "\n";
          PHP
          rm -f "${KEY_PATH}" "$WORK/password" "$CSRF" "$COOKIE"
          echo "BACKUP=/home/admin/domains/ai.rateb.sa-file-backup-${STAMP}-image"
