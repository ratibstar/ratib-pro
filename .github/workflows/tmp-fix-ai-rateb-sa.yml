name: Temporary read-only ai.rateb.sa outage check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: rateb.sa
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 20

      - name: External checks
        run: |
          set +e
          python3 - << 'PY' > ai-rateb-fix-report.txt
          import socket
          expected = "167.233.71.107"
          ips = set()
          for family, label in ((socket.AF_INET, "A"), (socket.AF_INET6, "AAAA")):
              try:
                  found = sorted({item[4][0] for item in socket.getaddrinfo("ai.rateb.sa", 443, family)})
              except OSError as exc:
                  found = []
                  print("DNS_" + label + "_ERROR=" + exc.__class__.__name__)
              if family == socket.AF_INET:
                  ips = set(found)
              print("DNS_" + label + "=" + (",".join(found) if found else "none"))
          print("DNS_MATCH=" + ("yes" if expected in ips else "no"))
          PY
          for port in 22 80 443; do
            if timeout 8 bash -c "echo >/dev/tcp/167.233.71.107/${port}" 2>/dev/null; then
              echo "TCP_${port}=open" >> ai-rateb-fix-report.txt
            else
              echo "TCP_${port}=timeout_or_closed" >> ai-rateb-fix-report.txt
            fi
          done
          curl -sS -o /dev/null --max-time 20 -w "HTTP_CODE=%{http_code} REDIR=%{redirect_url} CONNECT=%{time_connect}\n" http://ai.rateb.sa/ >> ai-rateb-fix-report.txt || echo "HTTP_FAIL=$?" >> ai-rateb-fix-report.txt
          curl -sS -o /tmp/ai-home.html --max-time 20 -w "HTTPS_CODE=%{http_code} CONNECT=%{time_connect} SSLVERIFY=%{ssl_verify_result}\n" https://ai.rateb.sa/ >> ai-rateb-fix-report.txt || echo "HTTPS_FAIL=$?" >> ai-rateb-fix-report.txt
          echo "HOME_HAS_LANG=$(grep -c 'id=\"lang\"' /tmp/ai-home.html || true)" >> ai-rateb-fix-report.txt
          echo "HOME_FATAL=$(grep -ciE 'Fatal error|Uncaught' /tmp/ai-home.html || true)" >> ai-rateb-fix-report.txt
          echo | timeout 15 openssl s_client -servername ai.rateb.sa -connect ai.rateb.sa:443 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>/dev/null | sed 's/emailAddress=[^,/ ]*/emailAddress=redacted/g' >> ai-rateb-fix-report.txt
          echo "VERIFY_OUT=$(echo | timeout 15 openssl s_client -servername ai.rateb.sa -connect ai.rateb.sa:443 -verify_return_error 2>&1 | awk '/Verify return code/{print; exit}')" >> ai-rateb-fix-report.txt

      - name: Server checks
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
        run: |
          set +e
          KEY_PATH="${RUNNER_TEMP}/rateb-readonly-key"
          export KEY_PATH
          python3 - << 'PY'
          import os, stat
          key = (os.environ.get("DEPLOY_SSH_PRIVATE_KEY") or "").strip()
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")
          path = os.environ["KEY_PATH"]
          with open(path, "w", encoding="utf-8", newline="\n") as handle:
              handle.write(key)
              if not key.endswith("\n"):
                  handle.write("\n")
          os.chmod(path, stat.S_IRUSR | stat.S_IWUSR)
          PY
          PORT="${DEPLOY_SSH_PORT:-22}"
          ssh -i "${KEY_PATH}" -p "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}" bash -s >> ai-rateb-fix-report.txt << 'BASH'
          set +e
          echo "SSH=ok"
          echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uptime
          echo "SERVICE_HTTPD=$(systemctl is-active httpd 2>/dev/null)"
          echo "LISTEN_START"
          ss -lnt | awk 'NR==1 || $4 ~ /:80$/ || $4 ~ /:443$/'
          echo "LISTEN_END"
          echo "LOCAL_HTTP=$(curl -s -o /dev/null --max-time 8 -w '%{http_code}' -H 'Host: ai.rateb.sa' http://127.0.0.1/)"
          echo "LOCAL_HTTPS=$(curl -s -o /dev/null --max-time 8 -w '%{http_code}' --resolve ai.rateb.sa:443:127.0.0.1 https://ai.rateb.sa/)"
          echo "INDEX_HAS_LANG=$(grep -c 'id=\"lang\"' /home/admin/domains/ai.rateb.sa/index.php)"
          echo "DB_HASH=$(sha256sum /home/admin/domains/ai.rateb.sa/config/database.php | awk '{print $1}')"
          echo "AI_HASH=$(sha256sum /home/admin/domains/ai.rateb.sa/config/ai.php | awk '{print $1}')"
          echo "TEST_HASH=$(sha256sum /home/admin/domains/ai.rateb.sa/test.html | awk '{print $1}')"
          echo "FILE_HASHES_START"
          cd /home/admin/domains/ai.rateb.sa
          sha256sum \
            config/session.php config/guard.php config/bootstrap.php app/bootstrap.php \
            index.php dashboard.php campaign-new.php campaign.php app/ai/generate.php \
            app/auth/login.php app/auth/register.php app/auth/logout.php \
            public/assets/css/theme.css public/assets/css/app.css public/assets/js/app.js \
            assets/app.css
          echo "FILE_HASHES_END"
          echo "SSL_LINES_START"
          grep -R -n -E 'ServerName ai\.rateb\.sa|SSLEngine|SSLCertificateFile|SSLCertificateKeyFile|DocumentRoot' \
            /usr/local/directadmin/data/users/admin/httpd.conf /etc/httpd/conf/httpd.conf /etc/httpd/conf/extra 2>/dev/null \
            | sed -E 's#(SSLCertificateKeyFile).*#\1 redacted-path-hidden#' \
            | head -40
          echo "SSL_LINES_END"
          echo "FIREWALL_START"
          echo "SUDO=$(sudo -n true 2>/dev/null && echo yes || echo no)"
          (sudo -n iptables -S INPUT 2>/dev/null || iptables -S INPUT 2>/dev/null) | awk 'NR<=60 {print}'
          echo "IPTABLES_POLICY_END"
          if [ -f /etc/hosts.deny ]; then echo "HOSTS_DENY_LINES=$(grep -vcE '^[[:space:]]*(#|$)' /etc/hosts.deny)"; else echo "HOSTS_DENY=absent"; fi
          if [ -f /usr/local/directadmin/data/admin/ip_blacklist ]; then echo "DA_BLACKLIST_LINES=$(wc -l < /usr/local/directadmin/data/admin/ip_blacklist)"; else echo "DA_BLACKLIST=absent"; fi
          systemctl is-active fail2ban 2>/dev/null | sed 's/^/FAIL2BAN=/'
          echo "FIREWALL_END"
          echo "LOG_DIRS_START"
          ls -1 /var/log/httpd/domains 2>/dev/null | grep -i 'ai.rateb' || echo "NO_DOMAIN_LOG_NAME"
          ls -1 /home/admin/domains/ai.rateb.sa/logs 2>/dev/null | head -20 || echo "NO_HOME_LOGS"
          echo "LOG_DIRS_END"
          BASH
          echo "SSH_EXIT=$?" >> ai-rateb-fix-report.txt
          rm -f "${KEY_PATH}"
          echo "EXPECTED_HASHES_START" >> ai-rateb-fix-report.txt
          while IFS= read -r rel; do
            sum=$(git show "557b0d0b:tmp-ai-rateb-deploy/${rel}" | sha256sum | awk '{print $1}')
            echo "${sum}  ${rel}" >> ai-rateb-fix-report.txt
          done << 'FILES'
          config/session.php
          config/guard.php
          config/bootstrap.php
          app/bootstrap.php
          index.php
          dashboard.php
          campaign-new.php
          campaign.php
          app/ai/generate.php
          app/auth/login.php
          app/auth/register.php
          app/auth/logout.php
          public/assets/css/theme.css
          public/assets/css/app.css
          public/assets/js/app.js
          assets/app.css
          FILES
          echo "EXPECTED_HASHES_END" >> ai-rateb-fix-report.txt
          python3 - << 'PY' >> ai-rateb-fix-report.txt
          import re
          text = open("ai-rateb-fix-report.txt", encoding="utf-8", errors="replace").read()
          def block(name):
              match = re.search(rf"{name}_START\n(.*?){name}_END", text, re.S)
              return match.group(1) if match else ""
          live = {}
          for line in block("FILE_HASHES").splitlines():
              parts = line.split()
              if len(parts) == 2:
                  live[parts[1]] = parts[0]
          expected = {}
          for line in block("EXPECTED_HASHES").splitlines():
              parts = line.split()
              if len(parts) == 2:
                  expected[parts[1]] = parts[0]
          bad = [name for name in expected if live.get(name) != expected[name]]
          missing = [name for name in expected if name not in live]
          print("APP_FILES_MATCH=" + ("yes" if expected and not bad and not missing else "no"))
          print("APP_FILES_DIFF=" + (",".join(bad + missing) if (bad or missing) else "none"))
          db = re.search(r"^DB_HASH=(\S+)", text, re.M)
          ai = re.search(r"^AI_HASH=(\S+)", text, re.M)
          print("DATABASE_UNCHANGED=" + ("yes" if db and db.group(1) == "5afc681e1982ed40734678fba966feb15426cb26ffec465cb263e73049b4556d" else "no"))
          print("AI_CONFIG_UNCHANGED=" + ("yes" if ai and ai.group(1) == "574f6c27b1d726dff89c6408df4b83ecfa197fcb2b4f6f032bf5a307ac1e2bd1" else "no"))
          PY
          echo "COMPARE_DONE" >> ai-rateb-fix-report.txt

      - name: Browser verification
        run: |
          set +e
          npm init -y >/dev/null
          npm install puppeteer --silent
          node << 'NODE' >> ai-rateb-fix-report.txt
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({headless: true, args: ['--no-sandbox','--disable-dev-shm-usage']});
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', (err) => errors.push(String(err).slice(0, 160)));
            page.on('console', (msg) => { if (msg.type() === 'error') errors.push(msg.text().slice(0, 160)); });
            const response = await page.goto('https://ai.rateb.sa/', {waitUntil: 'networkidle0', timeout: 60000});
            const body = await page.content();
            console.log('BROWSER_STATUS=' + (response ? response.status() : 0));
            console.log('BROWSER_FATAL=' + (/Fatal error|Uncaught/i.test(body) ? 'yes' : 'no'));
            console.log('BROWSER_LANG_BTN=' + (await page.$('#lang') ? 'yes' : 'no'));
            console.log('BROWSER_THEME_BTN=' + (await page.$('#theme') ? 'yes' : 'no'));
            await page.click('#lang');
            console.log('BROWSER_AR_DIR=' + await page.evaluate(() => document.documentElement.dir));
            await page.click('#lang');
            console.log('BROWSER_EN_DIR=' + await page.evaluate(() => document.documentElement.dir));
            await page.click('#theme');
            console.log('BROWSER_DARK=' + await page.evaluate(() => document.documentElement.dataset.theme));
            await page.click('#theme');
            console.log('BROWSER_LIGHT=' + await page.evaluate(() => document.documentElement.dataset.theme));
            console.log('BROWSER_CONSOLE=' + errors.length);
            await browser.close();
          })().catch((err) => {
            console.log('BROWSER_FAIL=' + err.name);
            process.exitCode = 1;
          });
          NODE

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-rateb-fix-report
          path: ai-rateb-fix-report.txt
          retention-days: 1
          if-no-files-found: warn
