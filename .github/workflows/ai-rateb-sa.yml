name: RATEB AI Campaign

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-rateb-sa
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ai.rateb.sa wiring
    runs-on: ubuntu-latest
    environment: ai.rateb.sa
    timeout-minutes: 5
    env:
      RATEB_AI_API_KEY: ${{ secrets.RATEB_AI_API_KEY }}
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
    steps:
      - name: Confirm this job uses only the ai.rateb.sa environment
        run: |
          set -euo pipefail
          echo "ENVIRONMENT=ai.rateb.sa"
          echo "TARGET=/home/admin/domains/ai.rateb.sa"
          flag() {
            if [ -n "${2:-}" ]; then
              echo "$1=SET"
            else
              echo "$1=NOT_SET"
            fi
          }
          flag RATEB_AI_API_KEY "${RATEB_AI_API_KEY:-}"
          flag DEPLOY_SSH_HOST "${DEPLOY_SSH_HOST:-}"
          flag DEPLOY_SSH_USER "${DEPLOY_SSH_USER:-}"
          flag DEPLOY_SSH_PRIVATE_KEY "${DEPLOY_SSH_PRIVATE_KEY:-}"
          flag DEPLOY_SSH_PORT "${DEPLOY_SSH_PORT:-}"
          if [ -z "${RATEB_AI_API_KEY:-}" ]; then
            echo "MISSING=RATEB_AI_API_KEY"
            exit 1
          fi
          echo "RATEB_AI_API_KEY_REQUIRED=present"

  generate:
    name: Production campaign generation
    runs-on: ubuntu-latest
    environment: ai.rateb.sa
    timeout-minutes: 10
    steps:
      - name: Run Campaign Details generation
        run: |
          set -euo pipefail
          BASE="https://ai.rateb.sa"
          WORK="${RUNNER_TEMP}/ai-gen"
          mkdir -p "$WORK"
          chmod 700 "$WORK"
          python3 - << 'PY'
          import os, pathlib, secrets
          work = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ai-gen"
          work.mkdir(parents=True, exist_ok=True)
          (work / "email").write_text("ai-gen-" + secrets.token_hex(4) + "@rateb.sa", encoding="utf-8")
          (work / "password").write_text(secrets.token_urlsafe(18), encoding="utf-8")
          os.chmod(work / "password", 0o600)
          PY
          EMAIL="$(cat "$WORK/email")"
          CSRF_FILE="$WORK/csrf"
          COOKIE="$WORK/cookies"
          say() { printf '%s\n' "$1" | tee -a "$WORK/report.txt"; }
          extract_csrf() {
            local src="$1" field="$2"
            python3 - "$src" "$field" "$CSRF_FILE" << 'PY'
          import re, sys
          html = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          field = sys.argv[2]
          match = re.search(r'name="' + re.escape(field) + r'" value="([^"]+)"', html)
          if not match:
              raise SystemExit(1)
          open(sys.argv[3], "w", encoding="utf-8").write(match.group(1))
          PY
          }
          code=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/register.html" -w '%{http_code}' "$BASE/register.php" || true)
          say "REGISTER_GET=$code"
          if ! extract_csrf "$WORK/register.html" csrf_token; then
            say "GENERATE_HTTP=0"
            say "GENERATE_ERROR=register page did not return a form token"
            say "OUTPUT_COUNT=0"
            say "SAVED=NO"
            exit 1
          fi
          code=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/register-post.html" -D "$WORK/register.hdr" -w '%{http_code}' \
            --data-urlencode "csrf_token@${CSRF_FILE}" \
            --data-urlencode "name=AI Generation Check" \
            --data-urlencode "email@${WORK}/email" \
            --data-urlencode "password@${WORK}/password" \
            "$BASE/register.php" || true)
          say "REGISTER_POST=$code"
          if ! grep -qi 'dashboard.php' "$WORK/register.hdr"; then
            say "GENERATE_HTTP=0"
            say "GENERATE_ERROR=could not open an authenticated campaign session"
            say "OUTPUT_COUNT=0"
            say "SAVED=NO"
            exit 1
          fi
          code=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/new.html" -w '%{http_code}' "$BASE/campaign-new.php" || true)
          say "CAMPAIGN_FORM=$code"
          if ! extract_csrf "$WORK/new.html" csrf; then
            say "GENERATE_HTTP=0"
            say "GENERATE_ERROR=campaign form did not return a form token"
            say "OUTPUT_COUNT=0"
            say "SAVED=NO"
            exit 1
          fi
          code=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/save.html" -D "$WORK/save.hdr" -w '%{http_code}' \
            --data-urlencode "csrf@${CSRF_FILE}" \
            --data-urlencode "title=Production generation check" \
            --data-urlencode "product_name=RATEB AI Campaign" \
            --data-urlencode "description=A short production check for campaign generation." \
            --data-urlencode "price=100 SAR" \
            --data-urlencode "target_customer=Small business owners" \
            "$BASE/campaign-save.php" || true)
          CAMPAIGN_ID=$(python3 - "$WORK/save.hdr" << 'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          match = re.search(r'campaign\.php\?id=(\d+)', text)
          print(match.group(1) if match else "")
          PY
          )
          say "CAMPAIGN_HTTP=$code"
          say "CAMPAIGN_ID=${CAMPAIGN_ID:-none}"
          if [ -z "${CAMPAIGN_ID}" ]; then
            python3 - "$WORK/save.html" << 'PY'
          import re, sys
          raw = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          text = re.sub(r"<[^>]+>", " ", raw)
          text = re.sub(r"\s+", " ", text)
          found = ""
          for pattern in (r"Fatal error:.{0,180}", r"Uncaught [^ ]{0,40}.{0,160}", r"SQLSTATE\[[^\]]+\].{0,140}"):
              match = re.search(pattern, text)
              if match:
                  found = match.group(0)
                  break
          if not found:
              found = "HTTP 500 without a visible PHP message"
          found = re.sub(r"(password|api_key|secret)=[^\s]+", r"\1=[redacted]", found, flags=re.I)
          print("SAVE_ERROR=" + found[:220])
          PY
            say "GENERATE_HTTP=0"
            say "GENERATE_ERROR=campaign was not created"
            say "OUTPUT_COUNT=0"
            say "SAVED=NO"
            exit 1
          fi
          code=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/campaign.html" -w '%{http_code}' "$BASE/campaign.php?id=${CAMPAIGN_ID}" || true)
          say "DETAILS_HTTP=$code"
          if ! extract_csrf "$WORK/campaign.html" csrf; then
            say "GENERATE_HTTP=0"
            say "GENERATE_ERROR=campaign details did not return a form token"
            say "OUTPUT_COUNT=0"
            say "SAVED=NO"
            exit 1
          fi
          code=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/generate.json" -w '%{http_code}' --max-time 120 \
            --data-urlencode "csrf@${CSRF_FILE}" \
            --data-urlencode "campaign_id=${CAMPAIGN_ID}" \
            --data-urlencode "lang=en" \
            "$BASE/app/ai/generate.php" || true)
          python3 - "$WORK/generate.json" "$code" "$WORK/campaign.html" << 'PY'
          import json, re, sys
          body_path, http_code, page_path = sys.argv[1:]
          raw = open(body_path, encoding="utf-8", errors="replace").read()
          error = ""
          ok = False
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              data = {}
              error = "generation response was not JSON"
          if isinstance(data, dict):
              ok = bool(data.get("ok"))
              if not ok and not error:
                  error = str(data.get("error") or "")
          error = re.sub(r"sk-[A-Za-z0-9_\-]+", "[redacted]", error)[:180]
          print("GENERATE_HTTP=" + http_code)
          print("GENERATE_OK=" + ("yes" if ok else "no"))
          if error:
              print("GENERATE_ERROR=" + error)
          PY
          code=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/campaign-after.html" -w '%{http_code}' "$BASE/campaign.php?id=${CAMPAIGN_ID}" || true)
          python3 - "$WORK/campaign-after.html" << 'PY'
          import re, sys
          html = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          found = re.findall(r'data-i18n="type_([a-z0-9_]+)"', html)
          wanted = [
              "strategy", "ad_copy", "social_posts", "whatsapp",
              "product_description", "video_ideas", "voiceover", "content_plan_7_days",
          ]
          present = [name for name in wanted if name in found]
          print("DETAILS_AFTER=" + "200")
          print("OUTPUT_COUNT=" + str(len(present)))
          print("OUTPUT_TYPES=" + (",".join(present) if present else "none"))
          print("SAVED=" + ("YES" if present else "NO"))
          PY
          rm -f "$WORK/password" "$CSRF_FILE" "$COOKIE"
