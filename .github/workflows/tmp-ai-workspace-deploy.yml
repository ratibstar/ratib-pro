name: Temporary campaign workspace deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: rateb.sa
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Publish campaign workspace and smoke-test production
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/rateb-readonly-key"
          export KEY_PATH
          python3 - << 'PY'
          import os, stat
          key = (os.environ.get("DEPLOY_SSH_PRIVATE_KEY") or "").strip()
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")
          path = os.environ["KEY_PATH"]
          with open(path, "w", encoding="utf-8", newline="\n") as handle:
              handle.write(key)
              if not key.endswith("\n"):
                  handle.write("\n")
          os.chmod(path, stat.S_IRUSR | stat.S_IWUSR)
          PY
          PORT="${DEPLOY_SSH_PORT:-22}"
          REMOTE="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          SSH=(ssh -i "${KEY_PATH}" -p "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          ROOT=/home/admin/domains/ai.rateb.sa
          STAGE="${RUNNER_TEMP}/stage"
          mkdir -p "$STAGE/app/ai" "$STAGE/app/content" "$STAGE/app/brand" "$STAGE/config" "$STAGE/public/assets/js" "$STAGE/public/assets/css"
          cp ai-rateb-sa-source/app/schema.php "$STAGE/app/schema.php"
          cp ai-rateb-sa-source/app/bootstrap.php "$STAGE/app/bootstrap.php"
          cp ai-rateb-sa-source/config/bootstrap.php "$STAGE/config/bootstrap.php"
          cp ai-rateb-sa-source/app/ai/generate.php "$STAGE/app/ai/generate.php"
          cp ai-rateb-sa-source/app/ai/variation.php "$STAGE/app/ai/variation.php"
          cp ai-rateb-sa-source/app/content/save.php "$STAGE/app/content/save.php"
          cp ai-rateb-sa-source/app/content/variation-save.php "$STAGE/app/content/variation-save.php"
          cp ai-rateb-sa-source/app/brand/library.php "$STAGE/app/brand/library.php"
          cp ai-rateb-sa-source/app/brand/save.php "$STAGE/app/brand/save.php"
          cp ai-rateb-sa-source/app/brand/logo.php "$STAGE/app/brand/logo.php"
          cp ai-rateb-sa-source/brand.php ai-rateb-sa-source/campaign.php ai-rateb-sa-source/campaign-new.php ai-rateb-sa-source/campaign-save.php ai-rateb-sa-source/campaign-update.php ai-rateb-sa-source/dashboard.php "$STAGE/"
          cp ai-rateb-sa-source/public/assets/js/app.js "$STAGE/public/assets/js/app.js"
          cp ai-rateb-sa-source/public/assets/css/app.css "$STAGE/public/assets/css/app.css"
          "${SSH[@]}" "${REMOTE}" "mkdir -p /tmp/ai-workspace && sha256sum ${ROOT}/config/ai.php ${ROOT}/config/database.php ${ROOT}/app/ai/voice.php ${ROOT}/app/ai/image.php > /tmp/workspace-before.txt"
          scp -i "${KEY_PATH}" -P "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -r "$STAGE/." "${REMOTE}:/tmp/ai-workspace/"
          "${SSH[@]}" "${REMOTE}" "mkdir -p ${ROOT}/app/ai ${ROOT}/app/content ${ROOT}/app/brand && cp -a /tmp/ai-workspace/. ${ROOT}/ && php -l ${ROOT}/campaign.php && php -l ${ROOT}/app/ai/generate.php && php -l ${ROOT}/app/schema.php && sha256sum ${ROOT}/config/ai.php ${ROOT}/config/database.php ${ROOT}/app/ai/voice.php ${ROOT}/app/ai/image.php > /tmp/workspace-after.txt && cmp /tmp/workspace-before.txt /tmp/workspace-after.txt && echo PROTECTED_UNCHANGED=yes && rm -rf /tmp/ai-workspace"
          TOKEN=$(openssl rand -hex 16)
          "${SSH[@]}" "${REMOTE}" "cat > ${ROOT}/.ai-refresh-${TOKEN}.php" << EOF
          <?php
          if ((\$_GET['t'] ?? '') !== '${TOKEN}') { http_response_code(404); exit; }
          header('Content-Type: text/plain; charset=UTF-8');
          foreach ([
            '${ROOT}/campaign.php','${ROOT}/campaign-save.php','${ROOT}/campaign-new.php','${ROOT}/campaign-update.php','${ROOT}/dashboard.php','${ROOT}/brand.php','${ROOT}/config/bootstrap.php','${ROOT}/app/bootstrap.php','${ROOT}/app/schema.php','${ROOT}/app/ai/generate.php'
          ] as \$file) {
            echo basename(\$file) . '=' . (function_exists('opcache_invalidate') && opcache_invalidate(\$file, true) ? 'yes' : 'no') . "\\n";
          }
          EOF
          curl -fsS "https://ai.rateb.sa/.ai-refresh-${TOKEN}.php?t=${TOKEN}"
          echo
          "${SSH[@]}" "${REMOTE}" "rm -f ${ROOT}/.ai-refresh-${TOKEN}.php"
          WORK="${RUNNER_TEMP}/workspace"
          mkdir -p "$WORK"
          python3 - << 'PY'
          import os, pathlib, secrets, struct, zlib
          work = pathlib.Path(os.environ["RUNNER_TEMP"]) / "workspace"
          def chunk(tag, data):
              return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xFFFFFFFF)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", 1, 1, 8, 2, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(b"\x00\xff\x00\x00")) + chunk(b"IEND", b"")
          (work / "tiny.png").write_bytes(png)
          (work / "email").write_text("ai-ws-" + secrets.token_hex(4) + "@rateb.sa", encoding="utf-8")
          (work / "password").write_text(secrets.token_urlsafe(18), encoding="utf-8")
          os.chmod(work / "password", 0o600)
          PY
          BASE=https://ai.rateb.sa
          COOKIE="$WORK/cookies"
          CSRF="$WORK/csrf"
          extract_csrf() {
            python3 - "$1" "$2" "$CSRF" << 'PY'
          import re, sys
          html = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          match = re.search(r'name="' + re.escape(sys.argv[2]) + r'" value="([^"]+)"', html)
          if not match:
              raise SystemExit("csrf missing")
          open(sys.argv[3], "w", encoding="utf-8").write(match.group(1))
          PY
          }
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/register.html" "$BASE/register.php"
          extract_csrf "$WORK/register.html" csrf_token
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/register.hdr" -o "$WORK/register-post.html" \
            --data-urlencode "csrf_token@${CSRF}" --data-urlencode "name=Workspace Check" \
            --data-urlencode "email@${WORK}/email" --data-urlencode "password@${WORK}/password" \
            "$BASE/register.php"
          grep -qi 'dashboard.php' "$WORK/register.hdr"
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/dash.html" "$BASE/dashboard.php"
          grep -q 'brand.php' "$WORK/dash.html"
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/new.html" "$BASE/campaign-new.php"
          grep -q 'name="objective"' "$WORK/new.html"
          grep -q 'name="budget"' "$WORK/new.html"
          grep -q 'name="start_date"' "$WORK/new.html"
          extract_csrf "$WORK/new.html" csrf
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/save.hdr" -o "$WORK/save.html" \
            --data-urlencode "csrf@${CSRF}" --data-urlencode "title=Workspace check" \
            --data-urlencode "product_name=RATEB AI Campaign" --data-urlencode "description=A short production check." \
            --data-urlencode "price=100 SAR" --data-urlencode "target_customer=Small business owners" \
            --data-urlencode "objective=Increase trial signups" --data-urlencode "budget=2500 SAR" \
            --data-urlencode "start_date=2026-10-10" --data-urlencode "end_date=2026-10-20" \
            --data-urlencode "status=in_progress" "$BASE/campaign-save.php"
          CAMPAIGN_ID=$(python3 - "$WORK/save.hdr" << 'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          match = re.search(r'campaign\.php\?id=(\d+)', text)
          print(match.group(1) if match else "")
          PY
          )
          echo "CAMPAIGN_ID=${CAMPAIGN_ID}"
          test -n "$CAMPAIGN_ID"
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/campaign.html" "$BASE/campaign.php?id=${CAMPAIGN_ID}"
          grep -q 'id="overview"' "$WORK/campaign.html"
          grep -q 'id="planner"' "$WORK/campaign.html"
          grep -q 'id="variations"' "$WORK/campaign.html"
          grep -q 'id="generateForm"' "$WORK/campaign.html"
          grep -q 'id="generate-image"' "$WORK/campaign.html"
          grep -q 'id="voice"' "$WORK/campaign.html"
          grep -q 'data-i18n="provider_required"' "$WORK/campaign.html"
          grep -q 'id="media"' "$WORK/campaign.html"
          echo "PAGE_WORKSPACE=yes"
          extract_csrf "$WORK/campaign.html" csrf
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/update.hdr" -o /dev/null \
            --data-urlencode "csrf@${CSRF}" --data-urlencode "campaign_id=${CAMPAIGN_ID}" \
            --data-urlencode "title=Workspace check" --data-urlencode "product_name=RATEB AI Campaign" \
            --data-urlencode "description=A short production check." --data-urlencode "price=100" \
            --data-urlencode "target_customer=Small business owners" --data-urlencode "objective=Increase trial signups" \
            --data-urlencode "budget=2500" --data-urlencode "start_date=2026-10-10" --data-urlencode "end_date=2026-10-20" \
            --data-urlencode "status=ready" "$BASE/campaign-update.php"
          grep -q ' 302' "$WORK/update.hdr"
          echo "UPDATE_HTTP=302"
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/brand.html" "$BASE/brand.php"
          extract_csrf "$WORK/brand.html" csrf
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/brand.hdr" -o /dev/null \
            -F "csrf=<${CSRF}" -F "brand_name=RATEB" -F "tone=Clear and direct" \
            -F "contact=hello@rateb.sa" -F "preferred_language=ar" -F "primary_color=#0f766e" \
            -F "secondary_color=#111827" -F "logo=@${WORK}/tiny.png;type=image/png;filename=logo.png" \
            "$BASE/app/brand/save.php"
          grep -q 'brand.php?saved=1' "$WORK/brand.hdr"
          echo "BRAND_SAVE=yes"
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/logo.hdr" -o "$WORK/logo.bin" "$BASE/app/brand/logo.php"
          python3 - "$WORK/logo.hdr" "$WORK/logo.bin" << 'PY'
          import sys
          header = open(sys.argv[1], encoding="utf-8", errors="replace").read().lower()
          data = open(sys.argv[2], "rb").read()
          status = "0"
          for line in header.splitlines():
              if line.startswith("http/"):
                  parts = line.split()
                  if len(parts) > 1:
                      status = parts[1]
          print("LOGO_HTTP=" + status)
          print("LOGO_PNG=" + ("yes" if data.startswith(b"\x89PNG") else "no"))
          if status != "200" or not data.startswith(b"\x89PNG"):
              raise SystemExit(1)
          PY
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/campaign.html" "$BASE/campaign.php?id=${CAMPAIGN_ID}"
          extract_csrf "$WORK/campaign.html" csrf
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/item.hdr" -o /dev/null \
            --data-urlencode "csrf@${CSRF}" --data-urlencode "campaign_id=${CAMPAIGN_ID}" \
            --data-urlencode "title=Launch post" --data-urlencode "body=A scheduled social post." \
            --data-urlencode "item_date=2026-10-12" --data-urlencode "planner_status=scheduled" \
            --data-urlencode "approval_status=approved" "$BASE/app/content/save.php"
          grep -q ' 302' "$WORK/item.hdr"
          echo "ITEM_SAVE=yes"
          curl -sS -o "$WORK/app.js" "$BASE/public/assets/js/app.js"
          grep -q 'status_in_progress' "$WORK/app.js"
          grep -q 'قيد التنفيذ' "$WORK/app.js"
          grep -q 'rateb-theme' "$WORK/app.js"
          echo "I18N_THEME=yes"
          code=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/generate.json" -w '%{http_code}' --max-time 120 \
            --data-urlencode "csrf@${CSRF}" --data-urlencode "campaign_id=${CAMPAIGN_ID}" --data-urlencode "lang=en" \
            "$BASE/app/ai/generate.php" || true)
          python3 - "$WORK/generate.json" "$code" << 'PY'
          import json, sys
          data = json.loads(open(sys.argv[1], encoding="utf-8").read() or "{}")
          print("TEXT_HTTP=" + sys.argv[2])
          print("TEXT_OK=" + ("yes" if data.get("ok") else "no"))
          if not data.get("ok"):
              raise SystemExit(1)
          PY
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/campaign.html" "$BASE/campaign.php?id=${CAMPAIGN_ID}"
          extract_csrf "$WORK/campaign.html" csrf
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/var.hdr" -o /dev/null \
            --data-urlencode "csrf@${CSRF}" --data-urlencode "campaign_id=${CAMPAIGN_ID}" \
            "$BASE/app/content/variation-save.php"
          grep -q ' 302' "$WORK/var.hdr"
          echo "VARIATION_SAVE=yes"
          code=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/voice.json" -w '%{http_code}' --max-time 120 \
            --data-urlencode "csrf@${CSRF}" --data-urlencode "campaign_id=${CAMPAIGN_ID}" --data-urlencode "lang=ar" \
            "$BASE/app/ai/voice.php" || true)
          python3 - "$WORK/voice.json" "$code" << 'PY'
          import json, re, sys
          data = json.loads(open(sys.argv[1], encoding="utf-8").read() or "{}")
          error = re.sub(r"(?:sk-|gsk_)[A-Za-z0-9_\-]+", "[redacted]", str(data.get("error") or ""))[:160]
          print("VOICE_HTTP=" + sys.argv[2])
          print("VOICE_OK=" + ("yes" if data.get("ok") else "no"))
          if error:
              print("VOICE_ERROR=" + error)
          if not data.get("ok"):
              raise SystemExit(1)
          PY
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/campaign.html" "$BASE/campaign.php?id=${CAMPAIGN_ID}"
          extract_csrf "$WORK/campaign.html" csrf
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/upload.hdr" -o /dev/null \
            -F "csrf=<${CSRF}" -F "campaign_id=${CAMPAIGN_ID}" -F "kind=image" \
            -F "file=@${WORK}/tiny.png;type=image/png;filename=tiny.png" "$BASE/app/media/upload.php"
          grep -q ' 302' "$WORK/upload.hdr"
          echo "MEDIA_UPLOAD=yes"
          code=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/image.json" -w '%{http_code}' --max-time 60 \
            --data-urlencode "csrf@${CSRF}" --data-urlencode "campaign_id=${CAMPAIGN_ID}" \
            "$BASE/app/ai/image.php" || true)
          python3 - "$WORK/image.json" "$code" "$WORK/job" << 'PY'
          import json, sys
          data = json.loads(open(sys.argv[1], encoding="utf-8").read() or "{}")
          job = str(data.get("job_id") or "")
          print("IMAGE_SUBMIT_HTTP=" + sys.argv[2])
          print("IMAGE_PENDING=" + ("yes" if data.get("pending") and len(job) == 36 else "no"))
          if not data.get("pending"):
              raise SystemExit(1)
          open(sys.argv[3], "w", encoding="utf-8").write(job)
          PY
          JOB=$(cat "$WORK/job")
          state=pending
          for attempt in $(seq 1 240); do
            sleep 3
            code=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/image.json" -w '%{http_code}' --max-time 60 \
              --data-urlencode "csrf@${CSRF}" --data-urlencode "campaign_id=${CAMPAIGN_ID}" \
              --data-urlencode "job_id=${JOB}" "$BASE/app/ai/image.php" || true)
            state=$(python3 - "$WORK/image.json" "$code" << 'PY'
          import json, sys
          data = json.loads(open(sys.argv[1], encoding="utf-8").read() or "{}")
          if data.get("ok"):
              print("done")
              print("IMAGE_HTTP=" + sys.argv[2])
              print("IMAGE_OK=yes")
              print("IMAGE_MODEL=" + str(data.get("model") or ""))
          elif data.get("pending"):
              print("pending")
          else:
              print("failed")
              print("IMAGE_HTTP=" + sys.argv[2])
              print("IMAGE_OK=no")
          PY
            )
            first=${state%%$'\n'*}
            if [ "$first" = "done" ]; then printf '%s\n' "$state"; break; fi
            if [ "$first" = "pending" ]; then
              if [ $((attempt % 20)) -eq 0 ]; then echo "IMAGE_STILL_PENDING=${attempt}"; fi
              continue
            fi
            printf '%s\n' "$state"
            exit 1
          done
          if [ "${state%%$'\n'*}" != "done" ]; then echo "IMAGE_ERROR=still queued"; exit 1; fi
          "${SSH[@]}" "${REMOTE}" "export CAMPAIGN_ID=${CAMPAIGN_ID}; php" << 'PHP'
          <?php
          require '/home/admin/domains/ai.rateb.sa/app/bootstrap.php';
          $id = (int) getenv('CAMPAIGN_ID');
          $campaign = db()->prepare('SELECT status, objective, budget, start_date, end_date FROM campaigns WHERE id=?');
          $campaign->execute([$id]);
          $row = $campaign->fetch();
          echo 'STATUS=' . $row['status'] . "\n";
          echo 'OBJECTIVE=' . ($row['objective'] === 'Increase trial signups' ? 'yes' : 'no') . "\n";
          echo 'BUDGET=' . $row['budget'] . "\n";
          echo 'START=' . $row['start_date'] . "\n";
          $items = db()->prepare('SELECT planner_status, approval_status, item_date FROM campaign_items WHERE campaign_id=?');
          $items->execute([$id]);
          $item = $items->fetch();
          echo 'ITEM=' . ($item ? $item['planner_status'] . '/' . $item['approval_status'] . '/' . $item['item_date'] : 'no') . "\n";
          $types = db()->prepare('SELECT output_type FROM campaign_outputs WHERE campaign_id=?');
          $types->execute([$id]);
          $names = array_column($types->fetchAll(), 'output_type');
          $need = ['strategy','ad_copy','social_posts','whatsapp','product_description','video_ideas','voiceover','content_plan_7_days'];
          echo 'TEXT_TYPES=' . count(array_intersect($need, $names)) . "\n";
          $vars = db()->prepare('SELECT COUNT(*) FROM campaign_variations WHERE campaign_id=?');
          $vars->execute([$id]);
          echo 'VARIATION_ROWS=' . $vars->fetchColumn() . "\n";
          $media = db()->prepare("SELECT source, kind FROM campaign_media WHERE campaign_id=?");
          $media->execute([$id]);
          foreach ($media as $mediaRow) echo 'MEDIA=' . $mediaRow['source'] . '/' . $mediaRow['kind'] . "\n";
          $brand = db()->prepare('SELECT brand_name, preferred_language FROM brand_kits WHERE user_id=(SELECT user_id FROM campaigns WHERE id=?)');
          $brand->execute([$id]);
          $kit = $brand->fetch();
          echo 'BRAND=' . (($kit['brand_name'] ?? '') === 'RATEB' && ($kit['preferred_language'] ?? '') === 'ar' ? 'yes' : 'no') . "\n";
          PHP
          rm -f "${KEY_PATH}" "$WORK/password" "$CSRF" "$COOKIE"
