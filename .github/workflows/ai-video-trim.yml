name: AI ffmpeg

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ship:
    runs-on: ubuntu-latest
    environment: rateb.sa
    timeout-minutes: 15
    env:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v5
      - name: Install ffmpeg for video shortening
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import os
          from pathlib import Path
          key = os.environ.get("DEPLOY_SSH_PRIVATE_KEY", "")
          if "-----BEGIN" not in key:
              raise SystemExit("SSH key missing")
          if "\\n" in key and "\n" not in key.split("-----BEGIN", 1)[1][:30]:
              key = key.replace("\\n", "\n")
          path = Path.home() / ".ssh"
          path.mkdir(mode=0o700, exist_ok=True)
          file = path / "ai_key"
          file.write_text(key if key.endswith("\n") else key + "\n", encoding="utf-8")
          file.chmod(0o600)
          PY
          ssh -i "$HOME/.ssh/ai_key" -p "$DEPLOY_SSH_PORT" -o StrictHostKeyChecking=accept-new "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" 'bash -s' << 'SH'
          set -euo pipefail
          mkdir -p "$HOME/bin"
          cd /tmp
          curl -fsSL -o ffmpeg.tgz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xJf ffmpeg.tgz
          install -m 755 ffmpeg-*-amd64-static/ffmpeg "$HOME/bin/ffmpeg"
          rm -rf ffmpeg.tgz ffmpeg-*-amd64-static
          "$HOME/bin/ffmpeg" -version | head -n 1
          INI="$HOME/domains/ai.rateb.sa/.user.ini"
          grep -q '^upload_max_filesize=' "$INI" || printf '\nupload_max_filesize=256M\npost_max_size=256M\n' >> "$INI"
          echo FFMPEG_OK
          SH
