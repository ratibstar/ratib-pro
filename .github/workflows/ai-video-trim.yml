name: AI text edit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ship:
    runs-on: ubuntu-latest
    environment: rateb.sa
    timeout-minutes: 12
    env:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v5
      - name: Upload edit controls
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import os
          from pathlib import Path
          key = os.environ.get("DEPLOY_SSH_PRIVATE_KEY", "")
          if "-----BEGIN" not in key:
              raise SystemExit("SSH key missing")
          if "\\n" in key and "\n" not in key.split("-----BEGIN", 1)[1][:30]:
              key = key.replace("\\n", "\n")
          path = Path.home() / ".ssh"
          path.mkdir(mode=0o700, exist_ok=True)
          file = path / "ai_key"
          file.write_text(key if key.endswith("\n") else key + "\n", encoding="utf-8")
          file.chmod(0o600)
          PY
          ROOT=/home/admin/domains/ai.rateb.sa
          for file in campaign.php app/idea.php app/plans.php app/ai/voice.php app/content/text-save.php public/assets/js/app.js public/assets/css/app.css; do
            scp -i "$HOME/.ssh/ai_key" -P "$DEPLOY_SSH_PORT" -o StrictHostKeyChecking=accept-new "ai-rateb-sa-source/$file" "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:$ROOT/$file"
          done
          ssh -i "$HOME/.ssh/ai_key" -p "$DEPLOY_SSH_PORT" -o StrictHostKeyChecking=accept-new "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" "php -l $ROOT/campaign.php && php -l $ROOT/app/idea.php && php -l $ROOT/app/content/text-save.php && php -l $ROOT/app/ai/voice.php"
          cat > /tmp/fix-idea.php << 'PHP'
          <?php
          $root = '/home/admin/domains/ai.rateb.sa';
          foreach (file($root . '/.user.ini', FILE_IGNORE_NEW_LINES) as $line) {
              $line = trim($line);
              if (str_starts_with($line, 'auto_prepend_file')) {
                  $path = trim(explode('=', $line, 2)[1], " \t\"'");
                  require $path;
              }
          }
          require $root . '/config/bootstrap.php';
          $fixed = 'ترويج لبرنامج رتب';
          $bad = 'ترويج لبرن';
          $count = 0;
          $brief = db()->prepare('UPDATE campaign_briefs SET description = ? WHERE campaign_id = 6 AND description = ?');
          $brief->execute([$fixed, $bad]);
          $count += $brief->rowCount();
          $campaign = db()->prepare('UPDATE campaigns SET description = ? WHERE id = 6 AND description = ?');
          $campaign->execute([$fixed, $bad]);
          $count += $campaign->rowCount();
          echo 'ROWS=' . $count . PHP_EOL;
          PHP
          scp -i "$HOME/.ssh/ai_key" -P "$DEPLOY_SSH_PORT" -o StrictHostKeyChecking=accept-new /tmp/fix-idea.php "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:/tmp/fix-idea.php"
          ssh -i "$HOME/.ssh/ai_key" -p "$DEPLOY_SSH_PORT" -o StrictHostKeyChecking=accept-new "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" "php /tmp/fix-idea.php; rm -f /tmp/fix-idea.php"
          TOKEN=$(python3 -c 'import secrets; print(secrets.token_hex(6))')
          ssh -i "$HOME/.ssh/ai_key" -p "$DEPLOY_SSH_PORT" -o StrictHostKeyChecking=accept-new "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" "cat > $ROOT/oc-$TOKEN.php" << 'PHP'
          <?php
          foreach (['/campaign.php', '/app/idea.php', '/app/plans.php', '/app/ai/voice.php', '/app/content/text-save.php'] as $file) {
              if (function_exists('opcache_invalidate')) opcache_invalidate(__DIR__ . $file, true);
          }
          echo 'OPCACHE=ok';
          PHP
          curl -fsS "https://ai.rateb.sa/oc-$TOKEN.php"; echo
          ssh -i "$HOME/.ssh/ai_key" -p "$DEPLOY_SSH_PORT" -o StrictHostKeyChecking=accept-new "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" "rm -f $ROOT/oc-$TOKEN.php"
