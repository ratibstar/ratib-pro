name: Temporary campaign delete check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: rateb.sa
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and test campaign deletion
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/rateb-readonly-key"
          export KEY_PATH
          python3 - << 'PY'
          import os, stat
          key = (os.environ.get("DEPLOY_SSH_PRIVATE_KEY") or "").strip()
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")
          path = os.environ["KEY_PATH"]
          with open(path, "w", encoding="utf-8", newline="\n") as handle:
              handle.write(key)
              if not key.endswith("\n"):
                  handle.write("\n")
          os.chmod(path, stat.S_IRUSR | stat.S_IWUSR)
          PY
          PORT="${DEPLOY_SSH_PORT:-22}"
          REMOTE="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          SSH=(ssh -i "${KEY_PATH}" -p "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          SCP=(scp -i "${KEY_PATH}" -P "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          ROOT=/home/admin/domains/ai.rateb.sa
          BASE=https://ai.rateb.sa
          WORK="${RUNNER_TEMP}/delete"
          mkdir -p "$WORK"
          "${SCP[@]}" ai-rateb-sa-source/campaign-delete.php "${REMOTE}:${ROOT}/campaign-delete.php"
          "${SCP[@]}" ai-rateb-sa-source/campaign.php "${REMOTE}:${ROOT}/campaign.php"
          "${SCP[@]}" ai-rateb-sa-source/dashboard.php "${REMOTE}:${ROOT}/dashboard.php"
          "${SCP[@]}" ai-rateb-sa-source/public/assets/js/app.js "${REMOTE}:${ROOT}/public/assets/js/app.js"
          "${SCP[@]}" ai-rateb-sa-source/public/assets/css/app.css "${REMOTE}:${ROOT}/public/assets/css/app.css"
          "${SSH[@]}" "${REMOTE}" "php -l ${ROOT}/campaign-delete.php && php -l ${ROOT}/campaign.php && php -l ${ROOT}/dashboard.php"
          cat > "$WORK/refresh.php" << 'PHP'
          <?php
          foreach (["campaign-delete.php","campaign.php","dashboard.php"] as $file) {
              $path = "/home/admin/domains/ai.rateb.sa/" . $file;
              echo $file . "=" . (function_exists("opcache_invalidate") && opcache_invalidate($path, true) ? "yes" : "no") . PHP_EOL;
          }
          PHP
          "${SCP[@]}" "$WORK/refresh.php" "${REMOTE}:${ROOT}/delete-refresh.php"
          curl -sS "$BASE/delete-refresh.php" || true
          echo
          "${SSH[@]}" "${REMOTE}" "rm -f ${ROOT}/delete-refresh.php"
          python3 - << 'PY'
          import struct, zlib
          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data) & 0xFFFFFFFF)
          raw = b"\x00\xff\x00\x00"
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", 1, 1, 8, 2, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          open("/tmp/pixel.png", "wb").write(png)
          PY
          cp /tmp/pixel.png "$WORK/pixel.png"
          cat > "$WORK/cleanup-early.php" << 'PHP'
          <?php
          $emailsFile = "/home/admin/.secrets/delete-test-emails.txt";
          if (!is_file($emailsFile)) {
              echo "EARLY_CLEANUP=skip\n";
              exit(0);
          }
          $ini = (string) file_get_contents("/home/admin/domains/ai.rateb.sa/.user.ini");
          if (preg_match('/auto_prepend_file\s*=\s*(\S+)/', $ini, $match) === 1) {
              require trim($match[1], "\"'");
          }
          require "/home/admin/domains/ai.rateb.sa/config/bootstrap.php";
          $emails = file($emailsFile, FILE_IGNORE_NEW_LINES | FILE_SKIP_EMPTY_LINES);
          foreach ($emails as $email) {
              $user = $pdo->prepare("SELECT id FROM users WHERE email=?");
              $user->execute([$email]);
              $uid = (int) $user->fetchColumn();
              if ($uid < 1) {
                  continue;
              }
              $ids = $pdo->prepare("SELECT id FROM campaigns WHERE user_id=?");
              $ids->execute([$uid]);
              foreach ($ids->fetchAll(PDO::FETCH_COLUMN) as $campaignId) {
                  $campaignId = (int) $campaignId;
                  $pdo->prepare("DELETE FROM campaign_media WHERE campaign_id=? AND user_id=?")->execute([$campaignId, $uid]);
                  $pdo->prepare("DELETE FROM campaign_outputs WHERE campaign_id=?")->execute([$campaignId]);
                  $pdo->prepare("DELETE FROM campaign_items WHERE campaign_id=? AND user_id=?")->execute([$campaignId, $uid]);
                  $pdo->prepare("DELETE FROM campaign_variations WHERE campaign_id=? AND user_id=?")->execute([$campaignId, $uid]);
                  $pdo->prepare("DELETE FROM campaigns WHERE id=? AND user_id=?")->execute([$campaignId, $uid]);
                  $dir = "/home/admin/.campaign-media/" . $campaignId;
                  if (is_dir($dir)) {
                      foreach (glob($dir . "/*") ?: [] as $file) {
                          if (is_file($file)) {
                              unlink($file);
                          }
                      }
                      @rmdir($dir);
                  }
              }
              $pdo->prepare("DELETE FROM users WHERE id=?")->execute([$uid]);
          }
          echo "EARLY_CLEANUP=ok\n";
          PHP
          "${SCP[@]}" "$WORK/cleanup-early.php" "${REMOTE}:/home/admin/.secrets/delete-cleanup-early.php"
          "${SSH[@]}" "${REMOTE}" "php /home/admin/.secrets/delete-cleanup-early.php && rm -f /home/admin/.secrets/delete-cleanup-early.php"
          stamp="$(date +%s)"
          email_a="delete-a-${stamp}@example.com"
          email_b="delete-b-${stamp}@example.com"
          pass="Delete-test-${stamp}-Aa1"
          printf '%s\n%s\n' "$email_a" "$email_b" > "$WORK/emails.txt"
          "${SCP[@]}" "$WORK/emails.txt" "${REMOTE}:/home/admin/.secrets/delete-test-emails.txt"
          csrf_of() { python3 -c 'import re,sys; html=open(sys.argv[1],encoding="utf-8",errors="replace").read(); m=re.search(r"name=\"csrf(?:_token)?\" value=\"([^\"]+)\"", html); print(m.group(1) if m else "")' "$1"; }
          A="$WORK/a.jar"
          B="$WORK/b.jar"
          curl -sS -c "$A" -b "$A" -o "$WORK/reg-a.html" "$BASE/register.php"
          curl -sS -c "$A" -b "$A" -o "$WORK/reg-a-post.html" -w "REG_A=%{http_code}\n" -L --data-urlencode "csrf_token=$(csrf_of "$WORK/reg-a.html")" --data-urlencode "name=Delete A" --data-urlencode "email=${email_a}" --data-urlencode "password=${pass}" "$BASE/register.php"
          curl -sS -c "$B" -b "$B" -o "$WORK/reg-b.html" "$BASE/register.php"
          curl -sS -c "$B" -b "$B" -o "$WORK/reg-b-post.html" -w "REG_B=%{http_code}\n" -L --data-urlencode "csrf_token=$(csrf_of "$WORK/reg-b.html")" --data-urlencode "name=Delete B" --data-urlencode "email=${email_b}" --data-urlencode "password=${pass}" "$BASE/register.php"
          grep -q 'logout' "$WORK/reg-a-post.html"
          grep -q 'logout' "$WORK/reg-b-post.html"
          create_campaign() {
            local jar="$1" title="$2"
            curl -sS -c "$jar" -b "$jar" -o "$WORK/new.html" "$BASE/campaign-new.php"
            curl -sS -c "$jar" -b "$jar" -o /dev/null -w "%{url_effective}" -L \
              --data-urlencode "csrf=$(csrf_of "$WORK/new.html")" \
              --data-urlencode "title=${title}" \
              --data-urlencode "product_name=Delete test" \
              --data-urlencode "description=Temporary campaign" \
              --data-urlencode "target_customer=Tester" \
              --data-urlencode "status=draft" \
              "$BASE/campaign-save.php"
          }
          url_a=$(create_campaign "$A" "Delete me ${stamp}")
          url_keep=$(create_campaign "$A" "Keep me ${stamp}")
          url_b=$(create_campaign "$B" "Other user ${stamp}")
          echo "URL_A=${url_a}"
          echo "URL_KEEP=${url_keep}"
          echo "URL_B=${url_b}"
          id_a=$(python3 -c 'import sys,re; m=re.search(r"[?&]id=(\d+)", sys.argv[1]); print(m.group(1) if m else "")' "$url_a")
          id_keep=$(python3 -c 'import sys,re; m=re.search(r"[?&]id=(\d+)", sys.argv[1]); print(m.group(1) if m else "")' "$url_keep")
          id_b=$(python3 -c 'import sys,re; m=re.search(r"[?&]id=(\d+)", sys.argv[1]); print(m.group(1) if m else "")' "$url_b")
          test -n "$id_a" && test -n "$id_keep" && test -n "$id_b"
          curl -sS -c "$A" -b "$A" -o "$WORK/camp-a.html" "$BASE/campaign.php?id=${id_a}"
          grep -q 'delete-campaign' "$WORK/camp-a.html"
          upload_a=$(curl -sS -c "$A" -b "$A" -o /dev/null -w "%{url_effective}" -L \
            -F "csrf=$(csrf_of "$WORK/camp-a.html")" \
            -F "campaign_id=${id_a}" \
            -F "kind=image" \
            -F "file=@${WORK}/pixel.png;type=image/png" \
            "$BASE/app/media/upload.php")
          echo "UPLOAD_A=${upload_a}"
          python3 -c 'import sys; raise SystemExit("media_error" in sys.argv[1])' "$upload_a"
          curl -sS -c "$B" -b "$B" -o "$WORK/camp-b.html" "$BASE/campaign.php?id=${id_b}"
          upload_b=$(curl -sS -c "$B" -b "$B" -o /dev/null -w "%{url_effective}" -L \
            -F "csrf=$(csrf_of "$WORK/camp-b.html")" \
            -F "campaign_id=${id_b}" \
            -F "kind=image" \
            -F "file=@${WORK}/pixel.png;type=image/png" \
            "$BASE/app/media/upload.php")
          echo "UPLOAD_B=${upload_b}"
          python3 -c 'import sys; raise SystemExit("media_error" in sys.argv[1])' "$upload_b"
          cat > "$WORK/seed.php" << 'PHP'
          <?php
          $ini = (string) file_get_contents("/home/admin/domains/ai.rateb.sa/.user.ini");
          if (preg_match('/auto_prepend_file\s*=\s*(\S+)/', $ini, $match) === 1) {
              require trim($match[1], "\"'");
          }
          require "/home/admin/domains/ai.rateb.sa/config/bootstrap.php";
          $id = (int) getenv("CID");
          $uid = (int) $pdo->query("SELECT user_id FROM campaigns WHERE id=" . $id)->fetchColumn();
          $pdo->prepare("INSERT INTO campaign_outputs (campaign_id, output_type, content) VALUES (?, ?, ?)")->execute([$id, "strategy", "delete-test"]);
          $pdo->prepare("INSERT INTO campaign_items (campaign_id, user_id, title, body) VALUES (?, ?, ?, ?)")->execute([$id, $uid, "delete-test", "body"]);
          $pdo->prepare("INSERT INTO campaign_variations (campaign_id, user_id, label, output_type, content) VALUES (?, ?, ?, ?, ?)")->execute([$id, $uid, "delete-test", "strategy", "body"]);
          $dir = "/home/admin/.campaign-media/" . $id;
          echo "DIR_BEFORE=" . (is_dir($dir) ? "yes" : "no") . PHP_EOL;
          echo "FILES_BEFORE=" . count(glob($dir . "/*") ?: []) . PHP_EOL;
          PHP
          "${SCP[@]}" "$WORK/seed.php" "${REMOTE}:/home/admin/.secrets/delete-seed.php"
          "${SSH[@]}" "${REMOTE}" "CID=${id_a} php /home/admin/.secrets/delete-seed.php && rm -f /home/admin/.secrets/delete-seed.php"
          method=$(curl -sS -c "$A" -b "$A" -o "$WORK/get-delete.txt" -w "%{http_code}" "$BASE/campaign-delete.php")
          echo "GET_DELETE=${method}"
          test "$method" = "405"
          bad=$(curl -sS -c "$A" -b "$A" -o "$WORK/bad-csrf.txt" -w "%{http_code}" -X POST --data-urlencode "csrf=not-a-token" --data-urlencode "campaign_id=${id_a}" "$BASE/campaign-delete.php")
          echo "BAD_CSRF=${bad}"
          test "$bad" = "419"
          foreign=$(curl -sS -c "$B" -b "$B" -o "$WORK/foreign.txt" -w "%{http_code}" -X POST --data-urlencode "csrf=$(csrf_of "$WORK/camp-b.html")" --data-urlencode "campaign_id=${id_a}" "$BASE/campaign-delete.php")
          echo "FOREIGN=${foreign}"
          test "$foreign" = "404"
          curl -sS -c "$A" -b "$A" -o "$WORK/camp-a2.html" "$BASE/campaign.php?id=${id_a}"
          delete_code=$(curl -sS -c "$A" -b "$A" -o /dev/null -D "$WORK/delete.headers" -w "%{http_code}" -X POST --data-urlencode "csrf=$(csrf_of "$WORK/camp-a2.html")" --data-urlencode "campaign_id=${id_a}" "$BASE/campaign-delete.php")
          echo "DELETE=${delete_code}"
          tr -d '\r' < "$WORK/delete.headers" | awk 'tolower($1)=="location:" {print}'
          test "$delete_code" = "302"
          grep -qi 'location: /dashboard.php?deleted=1' "$WORK/delete.headers"
          gone=$(curl -sS -c "$A" -b "$A" -o "$WORK/gone.txt" -w "%{http_code}" "$BASE/campaign.php?id=${id_a}")
          echo "GONE=${gone}"
          test "$gone" = "404"
          dash=$(curl -sS -c "$A" -b "$A" -o "$WORK/dash.html" -w "%{http_code}" "$BASE/dashboard.php?deleted=1")
          echo "DASH=${dash}"
          test "$dash" = "200"
          grep -q 'campaign_deleted' "$WORK/dash.html"
          keep=$(curl -sS -c "$A" -b "$A" -o "$WORK/keep.html" -w "%{http_code}" "$BASE/campaign.php?id=${id_keep}")
          echo "KEEP=${keep}"
          test "$keep" = "200"
          grep -q 'delete-campaign' "$WORK/keep.html"
          other=$(curl -sS -c "$B" -b "$B" -o "$WORK/other.html" -w "%{http_code}" "$BASE/campaign.php?id=${id_b}")
          echo "OTHER=${other}"
          test "$other" = "200"
          cat > "$WORK/verify.php" << 'PHP'
          <?php
          $ini = (string) file_get_contents("/home/admin/domains/ai.rateb.sa/.user.ini");
          if (preg_match('/auto_prepend_file\s*=\s*(\S+)/', $ini, $match) === 1) {
              require trim($match[1], "\"'");
          }
          require "/home/admin/domains/ai.rateb.sa/config/bootstrap.php";
          $id = (int) getenv("CID");
          $keep = (int) getenv("KEEP");
          $other = (int) getenv("OTHER");
          $counts = [];
          foreach (["campaigns" => "SELECT COUNT(*) FROM campaigns WHERE id=?", "campaign_media" => "SELECT COUNT(*) FROM campaign_media WHERE campaign_id=?", "campaign_outputs" => "SELECT COUNT(*) FROM campaign_outputs WHERE campaign_id=?", "campaign_items" => "SELECT COUNT(*) FROM campaign_items WHERE campaign_id=?", "campaign_variations" => "SELECT COUNT(*) FROM campaign_variations WHERE campaign_id=?"] as $label => $sql) {
              $stmt = $pdo->prepare($sql);
              $stmt->execute([$id]);
              $counts[$label] = (int) $stmt->fetchColumn();
              echo $label . "=" . $counts[$label] . PHP_EOL;
          }
          $dir = "/home/admin/.campaign-media/" . $id;
          $keepDir = "/home/admin/.campaign-media/" . $keep;
          $otherDir = "/home/admin/.campaign-media/" . $other;
          $dirAfter = is_dir($dir);
          $otherFiles = count(glob($otherDir . "/*") ?: []);
          echo "DIR_AFTER=" . ($dirAfter ? "yes" : "no") . PHP_EOL;
          echo "OTHER_DIR=" . (is_dir($otherDir) ? "yes" : "no") . PHP_EOL;
          echo "OTHER_FILES=" . $otherFiles . PHP_EOL;
          $bad = false;
          foreach (["campaigns","campaign_media","campaign_outputs","campaign_items","campaign_variations"] as $label) {
              if ((int) $counts[$label] !== 0) {
                  $bad = true;
              }
          }
          if ($dirAfter || $otherFiles < 1 || !is_dir($otherDir)) {
              $bad = true;
          }
          if ($bad) {
              exit(1);
          }
          PHP
          "${SCP[@]}" "$WORK/verify.php" "${REMOTE}:/home/admin/.secrets/delete-verify.php"
          verify_ok=0
          "${SSH[@]}" "${REMOTE}" "CID=${id_a} KEEP=${id_keep} OTHER=${id_b} php /home/admin/.secrets/delete-verify.php && rm -f /home/admin/.secrets/delete-verify.php" || verify_ok=1
          cat > "$WORK/cleanup.php" << 'PHP'
          <?php
          $ini = (string) file_get_contents("/home/admin/domains/ai.rateb.sa/.user.ini");
          if (preg_match('/auto_prepend_file\s*=\s*(\S+)/', $ini, $match) === 1) {
              require trim($match[1], "\"'");
          }
          require "/home/admin/domains/ai.rateb.sa/config/bootstrap.php";
          $emails = file("/home/admin/.secrets/delete-test-emails.txt", FILE_IGNORE_NEW_LINES | FILE_SKIP_EMPTY_LINES);
          foreach ($emails as $email) {
              $user = $pdo->prepare("SELECT id FROM users WHERE email=?");
              $user->execute([$email]);
              $uid = (int) $user->fetchColumn();
              if ($uid < 1) {
                  continue;
              }
              $ids = $pdo->prepare("SELECT id FROM campaigns WHERE user_id=?");
              $ids->execute([$uid]);
              foreach ($ids->fetchAll(PDO::FETCH_COLUMN) as $campaignId) {
                  $campaignId = (int) $campaignId;
                  $pdo->prepare("DELETE FROM campaign_media WHERE campaign_id=? AND user_id=?")->execute([$campaignId, $uid]);
                  $pdo->prepare("DELETE FROM campaign_outputs WHERE campaign_id=?")->execute([$campaignId]);
                  $pdo->prepare("DELETE FROM campaign_items WHERE campaign_id=? AND user_id=?")->execute([$campaignId, $uid]);
                  $pdo->prepare("DELETE FROM campaign_variations WHERE campaign_id=? AND user_id=?")->execute([$campaignId, $uid]);
                  $pdo->prepare("DELETE FROM campaigns WHERE id=? AND user_id=?")->execute([$campaignId, $uid]);
                  $dir = "/home/admin/.campaign-media/" . $campaignId;
                  if (is_dir($dir)) {
                      foreach (glob($dir . "/*") ?: [] as $file) {
                          if (is_file($file)) {
                              unlink($file);
                          }
                      }
                      @rmdir($dir);
                  }
              }
              $pdo->prepare("DELETE FROM users WHERE id=?")->execute([$uid]);
          }
          echo "CLEANUP=ok\n";
          PHP
          "${SCP[@]}" "$WORK/cleanup.php" "${REMOTE}:/home/admin/.secrets/delete-cleanup.php"
          "${SSH[@]}" "${REMOTE}" "php /home/admin/.secrets/delete-cleanup.php && rm -f /home/admin/.secrets/delete-cleanup.php /home/admin/.secrets/delete-test-emails.txt"
          test "$verify_ok" = "0"
          echo "DELETE_TEST=pass"
          rm -f "${KEY_PATH}"
