name: Temporary read-only verify ai.rateb.sa

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: rateb.sa
    timeout-minutes: 15
    steps:
      - name: Read-only production checks
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH_HOST}" ] || [ -z "${DEPLOY_SSH_USER}" ] || [ -z "${DEPLOY_SSH_PRIVATE_KEY}" ]; then
            echo "::error::SSH secret is missing (host, user, or private key)"
            exit 1
          fi
          KEY_PATH="${RUNNER_TEMP}/rateb-readonly-key"
          export KEY_PATH
          python3 - << 'PY'
          import os, stat
          key = (os.environ.get("DEPLOY_SSH_PRIVATE_KEY") or os.environ.get("SSH_PRIVATE_KEY") or "").strip()
          if not key:
              raise SystemExit("SSH private key secret is missing")
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")
          path = os.environ["KEY_PATH"]
          with open(path, "w", encoding="utf-8", newline="\n") as handle:
              handle.write(key)
              if not key.endswith("\n"):
                  handle.write("\n")
          os.chmod(path, stat.S_IRUSR | stat.S_IWUSR)
          PY
          cleanup() { rm -f "${KEY_PATH}"; }
          trap cleanup EXIT
          PORT="${DEPLOY_SSH_PORT:-22}"
          SSH=(ssh -i "${KEY_PATH}" -p "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new)
          REMOTE="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          REPORT="${GITHUB_WORKSPACE}/ai-rateb-readonly-verify.txt"
          "${SSH[@]}" "${REMOTE}" php > "${REPORT}" << 'PHP'
          <?php
          $root = '/home/admin/domains/ai.rateb.sa';
          echo 'PHP_VERSION=' . PHP_VERSION . PHP_EOL;
          echo 'PHP_VERSION_ID=' . PHP_VERSION_ID . PHP_EOL;
          echo 'PHP_SAPI=' . PHP_SAPI . PHP_EOL;
          foreach ([
              'session.use_strict_mode',
              'session.use_only_cookies',
              'session.cookie_httponly',
              'session.cookie_secure',
              'session.cookie_samesite',
              'session.name',
          ] as $key) {
              echo 'INI ' . $key . '=' . ini_get($key) . PHP_EOL;
          }
          $aiFile = $root . '/config/ai.php';
          if (!is_file($aiFile)) {
              echo "AI_CONFIG=MISSING\n";
              echo "CLI_RATEB_AI_API_KEY=UNKNOWN\n";
          } else {
              $cfg = require $aiFile;
              $apiKey = (string) ($cfg['api_key'] ?? '');
              echo 'CLI_RATEB_AI_API_KEY=' . ($apiKey !== '' ? 'SET' : 'NOT SET') . PHP_EOL;
              echo 'AI_PROVIDER=' . (string) ($cfg['provider'] ?? '') . PHP_EOL;
              echo 'AI_MODEL=' . (string) ($cfg['model'] ?? '') . PHP_EOL;
          }
          $keySet = false;
          $keySeen = false;
          foreach ([$root . '/.htaccess', $root . '/.user.ini', $root . '/public/.htaccess', $root . '/public/.user.ini'] as $file) {
              if (!is_file($file)) {
                  continue;
              }
              $text = (string) file_get_contents($file);
              if (preg_match('/RATEB_AI_API_KEY/', $text) === 1) {
                  $keySeen = true;
                  if (preg_match('/RATEB_AI_API_KEY[^\S\r\n]*(?:=|\s)[^\S\r\n]*["\']?([^"\'\s#]+)/', $text, $match) === 1) {
                      $keySet = trim($match[1]) !== '';
                  }
              }
              if (preg_match('/AddHandler\s+(\S*php\S*)/i', $text, $handler) === 1) {
                  echo 'ADDHANDLER=' . $handler[1] . PHP_EOL;
              }
          }
          if ($keySeen) {
              echo 'FILE_RATEB_AI_API_KEY=' . ($keySet ? 'SET' : 'NOT SET') . PHP_EOL;
          } else {
              echo "FILE_RATEB_AI_API_KEY=NOT SET\n";
          }
          try {
              $db = require $root . '/config/database.php';
              $pdo = new PDO(
                  'mysql:host=' . $db['host'] . ';dbname=' . $db['database'] . ';charset=' . $db['charset'],
                  $db['username'],
                  $db['password'],
                  [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION, PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC]
              );
              echo "MYSQL=AVAILABLE\n";
              $tables = $pdo->query('SHOW TABLES')->fetchAll(PDO::FETCH_COLUMN);
              $hasCampaigns = false;
              $hasOutputs = false;
              foreach ($tables as $table) {
                  if ($table === 'campaigns') {
                      $hasCampaigns = true;
                  }
                  if ($table === 'campaign_outputs') {
                      $hasOutputs = true;
                  }
              }
              echo 'CAMPAIGNS=' . ($hasCampaigns ? 'FOUND' : 'MISSING') . PHP_EOL;
              echo 'CAMPAIGN_OUTPUTS=' . ($hasOutputs ? 'FOUND' : 'MISSING') . PHP_EOL;
              if ($hasCampaigns) {
                  foreach ($pdo->query('SHOW COLUMNS FROM campaigns') as $column) {
                      echo 'CAMPAIGN_COL=' . $column['Field'] . PHP_EOL;
                  }
              }
              if ($hasOutputs) {
                  foreach ($pdo->query('SHOW COLUMNS FROM campaign_outputs') as $column) {
                      echo 'OUTPUT_COL=' . $column['Field'] . PHP_EOL;
                  }
              }
          } catch (Throwable $e) {
              echo "MYSQL=UNAVAILABLE\n";
          }
          PHP
          "${SSH[@]}" "${REMOTE}" bash -s >> "${REPORT}" << 'BASH'
          cd /home/admin/domains/ai.rateb.sa
          for f in \
            index.php login.php register.php logout.php dashboard.php \
            campaign-new.php campaign-save.php campaign.php \
            config/bootstrap.php config/database.php config/ai.php config/session.php config/guard.php \
            app/bootstrap.php app/ai/generate.php \
            app/auth/login.php app/auth/register.php app/auth/logout.php \
            public/assets/css/theme.css public/assets/css/app.css public/assets/js/app.js \
            assets/app.css
          do
            if [ -f "$f" ]; then
              sha256sum "$f"
            else
              echo "MISSING $f"
            fi
          done
          BASH
          echo "report_lines=$(wc -l < "${REPORT}")"

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: ai-rateb-readonly-verify
          path: ai-rateb-readonly-verify.txt
          retention-days: 1
          if-no-files-found: error
