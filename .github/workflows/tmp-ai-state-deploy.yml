name: Temporary media state deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: rateb.sa
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Publish media states and test production
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/rateb-readonly-key"
          export KEY_PATH
          python3 - << 'PY'
          import os, stat
          key = (os.environ.get("DEPLOY_SSH_PRIVATE_KEY") or "").strip()
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")
          path = os.environ["KEY_PATH"]
          with open(path, "w", encoding="utf-8", newline="\n") as handle:
              handle.write(key)
              if not key.endswith("\n"):
                  handle.write("\n")
          os.chmod(path, stat.S_IRUSR | stat.S_IWUSR)
          PY
          PORT="${DEPLOY_SSH_PORT:-22}"
          REMOTE="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          SSH=(ssh -i "${KEY_PATH}" -p "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          ROOT=/home/admin/domains/ai.rateb.sa
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          "${SSH[@]}" "${REMOTE}" "mkdir -p /home/admin/domains/ai.rateb.sa-file-backup-${STAMP}-states && cp -a ${ROOT}/campaign.php ${ROOT}/public/assets/js/app.js ${ROOT}/public/assets/css/app.css /home/admin/domains/ai.rateb.sa-file-backup-${STAMP}-states/ && sha256sum ${ROOT}/config/ai.php ${ROOT}/config/database.php ${ROOT}/app/ai/generate.php > /tmp/ai-state-before.txt"
          scp -i "${KEY_PATH}" -P "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            ai-rateb-sa-source/campaign.php \
            ai-rateb-sa-source/public/assets/js/app.js \
            ai-rateb-sa-source/public/assets/css/app.css \
            "${REMOTE}:/tmp/"
          "${SSH[@]}" "${REMOTE}" "mv /tmp/campaign.php ${ROOT}/campaign.php && mv /tmp/app.js ${ROOT}/public/assets/js/app.js && mv /tmp/app.css ${ROOT}/public/assets/css/app.css && sha256sum ${ROOT}/config/ai.php ${ROOT}/config/database.php ${ROOT}/app/ai/generate.php > /tmp/ai-state-after.txt && cmp /tmp/ai-state-before.txt /tmp/ai-state-after.txt && echo PROTECTED_UNCHANGED=yes"
          "${SSH[@]}" "${REMOTE}" php << 'PHP'
          <?php
          require '/home/admin/.secrets/rateb-ai-env.php';
          $cfg = require '/home/admin/domains/ai.rateb.sa/config/ai.php';
          $redact = static function ($value): string {
              $text = (string) $value;
              $text = preg_replace('/sk-[A-Za-z0-9_\-]{6,}/', 'sk-REDACTED', $text) ?? $text;
              $text = preg_replace('/gsk_[A-Za-z0-9_\-]{6,}/', 'gsk_REDACTED', $text) ?? $text;
              return substr($text, 0, 240);
          };
          $base = rtrim((string) $cfg['base_url'], '/');
          $ch = curl_init($base . '/models');
          curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER => true, CURLOPT_HTTPHEADER => ['Authorization: Bearer ' . $cfg['api_key']], CURLOPT_TIMEOUT => 30]);
          $raw = curl_exec($ch);
          curl_close($ch);
          $ids = [];
          foreach ((json_decode((string) $raw, true)['data'] ?? []) as $row) {
              if (isset($row['id'])) {
                  $ids[] = (string) $row['id'];
              }
          }
          $media = array_values(array_filter($ids, static function ($id) {
              return preg_match('/image|flux|dall|sdxl|stable-diffusion|video|ltx|wan2/i', $id) === 1;
          }));
          echo 'MEDIA_MODELS=' . ($media === [] ? 'none' : implode(',', $media)) . "\n";
          echo 'ARABIC_SPEECH_LISTED=' . (in_array('canopylabs/orpheus-arabic-saudi', $ids, true) ? 'yes' : 'no') . "\n";
          $payload = json_encode([
              'model' => 'canopylabs/orpheus-arabic-saudi',
              'input' => 'مرحبا',
              'voice' => 'fahad',
              'response_format' => 'wav',
          ], JSON_UNESCAPED_UNICODE);
          $ch = curl_init($base . '/audio/speech');
          curl_setopt_array($ch, [
              CURLOPT_POST => true,
              CURLOPT_RETURNTRANSFER => true,
              CURLOPT_HTTPHEADER => ['Content-Type: application/json', 'Authorization: Bearer ' . $cfg['api_key']],
              CURLOPT_POSTFIELDS => $payload,
              CURLOPT_TIMEOUT => 60,
          ]);
          $body = curl_exec($ch);
          echo 'DIRECT_SPEECH_HTTP=' . curl_getinfo($ch, CURLINFO_HTTP_CODE) . "\n";
          echo 'DIRECT_SPEECH_RIFF=' . (substr((string) $body, 0, 4) === 'RIFF' ? 'yes' : 'no') . "\n";
          curl_close($ch);
          $decoded = json_decode((string) $body, true);
          $error = is_array($decoded) ? ($decoded['error'] ?? []) : [];
          echo 'DIRECT_ERROR_CODE=' . $redact(is_array($error) ? ($error['code'] ?? '') : '') . "\n";
          $message = $redact(is_array($error) ? ($error['message'] ?? '') : '');
          echo 'DIRECT_HAS_CONSOLE=' . (str_contains($message, 'console.groq.com') ? 'yes' : 'no') . "\n";
          echo 'DIRECT_MESSAGE=' . $message . "\n";
          PHP
          TOKEN=$(openssl rand -hex 16)
          "${SSH[@]}" "${REMOTE}" "cat > ${ROOT}/.ai-refresh-${TOKEN}.php" << EOF
          <?php
          if ((\$_GET['t'] ?? '') !== '${TOKEN}') { http_response_code(404); exit; }
          header('Content-Type: text/plain; charset=UTF-8');
          echo 'INVALIDATED=' . (function_exists('opcache_invalidate') && opcache_invalidate('${ROOT}/campaign.php', true) ? 'yes' : 'no') . "\\n";
          EOF
          curl -fsS "https://ai.rateb.sa/.ai-refresh-${TOKEN}.php?t=${TOKEN}"
          echo
          "${SSH[@]}" "${REMOTE}" "rm -f ${ROOT}/.ai-refresh-${TOKEN}.php"
          WORK="${RUNNER_TEMP}/state"
          mkdir -p "$WORK"
          python3 - << 'PY'
          import os, pathlib, secrets, struct, zlib
          work = pathlib.Path(os.environ["RUNNER_TEMP"]) / "state"
          def chunk(tag, data):
              return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xFFFFFFFF)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", 1, 1, 8, 2, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(b"\x00\xff\x00\x00")) + chunk(b"IEND", b"")
          (work / "tiny.png").write_bytes(png)
          (work / "email").write_text("ai-state-" + secrets.token_hex(4) + "@rateb.sa", encoding="utf-8")
          (work / "password").write_text(secrets.token_urlsafe(18), encoding="utf-8")
          os.chmod(work / "password", 0o600)
          PY
          BASE=https://ai.rateb.sa
          COOKIE="$WORK/cookies"
          CSRF="$WORK/csrf"
          extract_csrf() {
            python3 - "$1" "$2" "$CSRF" << 'PY'
          import re, sys
          html = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          match = re.search(r'name="' + re.escape(sys.argv[2]) + r'" value="([^"]+)"', html)
          if not match:
              raise SystemExit("csrf missing")
          open(sys.argv[3], "w", encoding="utf-8").write(match.group(1))
          PY
          }
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/register.html" "$BASE/register.php"
          extract_csrf "$WORK/register.html" csrf_token
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/register.hdr" -o "$WORK/register-post.html" \
            --data-urlencode "csrf_token@${CSRF}" \
            --data-urlencode "name=State Check" \
            --data-urlencode "email@${WORK}/email" \
            --data-urlencode "password@${WORK}/password" \
            "$BASE/register.php"
          grep -qi 'dashboard.php' "$WORK/register.hdr"
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/new.html" "$BASE/campaign-new.php"
          extract_csrf "$WORK/new.html" csrf
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/save.hdr" -o "$WORK/save.html" \
            --data-urlencode "csrf@${CSRF}" \
            --data-urlencode "title=Media state check" \
            --data-urlencode "product_name=RATEB AI Campaign" \
            --data-urlencode "description=A short production check." \
            --data-urlencode "price=100 SAR" \
            --data-urlencode "target_customer=Small business owners" \
            "$BASE/campaign-save.php"
          CAMPAIGN_ID=$(python3 - "$WORK/save.hdr" << 'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          match = re.search(r'campaign\.php\?id=(\d+)', text)
          print(match.group(1) if match else "")
          PY
          )
          echo "CAMPAIGN_ID=${CAMPAIGN_ID}"
          test -n "$CAMPAIGN_ID"
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/campaign.html" "$BASE/campaign.php?id=${CAMPAIGN_ID}"
          grep -q 'id="generateForm"' "$WORK/campaign.html"
          grep -q 'data-i18n="provider_required"' "$WORK/campaign.html"
          grep -q 'data-i18n="image_provider_required"' "$WORK/campaign.html"
          grep -q 'data-i18n="video_provider_required"' "$WORK/campaign.html"
          grep -q 'data-i18n="accept_model_terms"' "$WORK/campaign.html"
          grep -q 'orpheus-arabic-saudi' "$WORK/campaign.html"
          if grep -q 'id="voice"' "$WORK/campaign.html"; then echo "VOICE_BUTTON=present"; exit 1; fi
          echo "PAGE_STATES=yes"
          extract_csrf "$WORK/campaign.html" csrf
          curl -sS -c "$COOKIE" -b "$COOKIE" -D "$WORK/upload.hdr" -o "$WORK/upload.html" \
            -F "csrf=<${CSRF}" -F "campaign_id=${CAMPAIGN_ID}" -F "kind=image" \
            -F "file=@${WORK}/tiny.png;type=image/png;filename=tiny.png" \
            "$BASE/app/media/upload.php"
          grep -q ' 302' "$WORK/upload.hdr"
          if grep -q 'media_error=' "$WORK/upload.hdr"; then echo "UPLOAD_FAIL"; exit 1; fi
          echo "IMAGE_UPLOAD=302"
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/campaign.html" "$BASE/campaign.php?id=${CAMPAIGN_ID}"
          extract_csrf "$WORK/campaign.html" csrf
          curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/voice.json" -w 'VOICE_HTTP=%{http_code}\n' \
            --data-urlencode "csrf@${CSRF}" \
            --data-urlencode "campaign_id=${CAMPAIGN_ID}" \
            --data-urlencode "lang=ar" \
            "$BASE/app/ai/voice.php"
          python3 - "$WORK/voice.json" << 'PY'
          import json, re, sys
          data = json.loads(open(sys.argv[1], encoding="utf-8").read())
          error = re.sub(r"(?:sk-|gsk_)[A-Za-z0-9_\-]+", "[redacted]", str(data.get("error") or ""))[:180]
          print("VOICE_OK=" + ("yes" if data.get("ok") else "no"))
          print("VOICE_ERROR=" + error)
          PY
          code=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o "$WORK/generate.json" -w '%{http_code}' --max-time 180 \
            --data-urlencode "csrf@${CSRF}" \
            --data-urlencode "campaign_id=${CAMPAIGN_ID}" \
            --data-urlencode "lang=en" \
            "$BASE/app/ai/generate.php" || true)
          python3 - "$WORK/generate.json" "$code" << 'PY'
          import json, sys
          data = json.loads(open(sys.argv[1], encoding="utf-8").read() or "{}")
          print("TEXT_HTTP=" + sys.argv[2])
          print("TEXT_OK=" + ("yes" if data.get("ok") else "no"))
          PY
          "${SSH[@]}" "${REMOTE}" "export CAMPAIGN_ID=${CAMPAIGN_ID}; php" << 'PHP'
          <?php
          require '/home/admin/domains/ai.rateb.sa/app/bootstrap.php';
          $id = (int) getenv('CAMPAIGN_ID');
          $stmt = db()->prepare("SELECT COUNT(*) FROM campaign_media WHERE campaign_id = ? AND source = 'ai'");
          $stmt->execute([$id]);
          echo 'AI_MEDIA_ROWS=' . $stmt->fetchColumn() . "\n";
          $stmt = db()->prepare("SELECT kind, mime FROM campaign_media WHERE campaign_id = ? AND source = 'upload'");
          $stmt->execute([$id]);
          foreach ($stmt as $row) {
              echo 'UPLOAD_ROW=' . $row['kind'] . ' ' . $row['mime'] . "\n";
          }
          $stmt = db()->prepare("SELECT output_type FROM campaign_outputs WHERE campaign_id = ?");
          $stmt->execute([$id]);
          echo 'TEXT_ROWS=' . count($stmt->fetchAll()) . "\n";
          PHP
          rm -f "${KEY_PATH}" "$WORK/password" "$CSRF" "$COOKIE"
          echo "BACKUP=/home/admin/domains/ai.rateb.sa-file-backup-${STAMP}-states"
