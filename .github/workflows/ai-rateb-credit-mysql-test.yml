name: RATEB AI Credit MySQL Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-rateb-credit-mysql-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credit-mysql:
    name: Credit reservations on disposable MySQL 8.0
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          # Throwaway root password for this job-scoped container only. It is not a secret and
          # is never used by the application or the integration test.
          MYSQL_ROOT_PASSWORD: ci-disposable-root
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-disposable-root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      MYSQL_ROOT_PASSWORD: ci-disposable-root
      RATEB_TEST_DB_HOST: 127.0.0.1
      RATEB_TEST_DB_NAME: rateb_ai_credit_test
      RATEB_TEST_DB_CONFIRM: rateb_ai_credit_test
      RATEB_TEST_DB_USER: rateb_credit_test
      RATEB_VIDEO_TEST_DB_NAME: rateb_ai_video_test
      RATEB_DEPLOY_TEST_DB_NAME: rateb_ai_deploy_test

    defaults:
      run:
        shell: bash
        working-directory: ai-rateb-sa-source

    steps:
      - name: Require a feature branch
        working-directory: ${{ github.workspace }}
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF_TYPE" != "branch" ] || [ "$REF" = "refs/heads/main" ] || [ -z "$DEFAULT_BRANCH" ] || [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Run this workflow on a feature branch that contains the code under test, not on $REF."
            exit 1
          fi
          echo "Testing $REF"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, gd, posix
          coverage: none
          tools: none

      - name: Check PHP extensions
        run: php -r 'foreach (["pdo_mysql", "mbstring", "gd", "posix"] as $e) { if (!extension_loaded($e)) { fwrite(STDERR, "missing $e\n"); exit(1); } } echo PHP_VERSION, PHP_EOL;'

      - name: Install ffmpeg for the video worker test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          version="$(ffmpeg -hide_banner -version)"
          echo "${version%%$'\n'*}"
          filters="$(ffmpeg -hide_banner -filters 2>/dev/null)"
          decoders="$(ffmpeg -hide_banner -decoders 2>/dev/null)"
          grep -q ' zoompan ' <<< "$filters"
          grep -q ' overlay ' <<< "$filters"
          grep -q ' png ' <<< "$decoders"
          echo "ffmpeg zoompan and overlay filters and the png decoder present"

      # Production's ffmpeg has no drawtext (built without FreeType). Build one the same way from
      # the pinned upstream release, with only what the worker and its tests use.
      - name: Build an ffmpeg without drawtext
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq pkg-config libx264-dev zlib1g-dev > /dev/null
          src="$RUNNER_TEMP/ffmpeg-src"
          git clone --quiet --depth 1 --branch n7.1.1 https://github.com/FFmpeg/FFmpeg.git "$src"
          test "$(git -C "$src" rev-parse HEAD)" = db69d06eeeab4f46da15030a80d539efb4503ca8
          cd "$src"
          # n7.1.1 links aom_film_grain.o only through hevc_sei, which h264's shared SEI code needs;
          # the hevc parser is the smallest component that selects it.
          ./configure --prefix="$RUNNER_TEMP/ffmpeg-no-drawtext" --disable-everything --disable-doc --disable-ffplay --disable-ffprobe \
            --disable-network --disable-x86asm --enable-gpl --enable-libx264 --enable-zlib \
            --enable-protocol=file,pipe \
            --enable-demuxer=concat,image2,mjpeg,image_jpeg_pipe,image_png_pipe,mov,wav \
            --enable-muxer=mp4,null,rawvideo \
            --enable-decoder=mjpeg,png,h264,aac,pcm_s16le \
            --enable-encoder=libx264,aac,rawvideo,wrapped_avframe,pcm_s16le \
            --enable-parser=h264,hevc,aac,mjpeg,png \
            --enable-bsf=h264_mp4toannexb \
            --enable-filter=zoompan,overlay,scale,pad,format,crop,aresample,aformat,anull,null > /dev/null
          make -j"$(nproc)" > /dev/null
          make install > /dev/null
          bin="$RUNNER_TEMP/ffmpeg-no-drawtext/bin/ffmpeg"
          filters="$("$bin" -hide_banner -filters 2>/dev/null)"
          if grep -q ' drawtext ' <<< "$filters"; then
            echo "::error::The test build must not have drawtext."
            exit 1
          fi
          for filter in zoompan overlay scale pad format; do
            grep -q " ${filter} " <<< "$filters"
          done
          version="$("$bin" -hide_banner -version)"
          echo "${version%%$'\n'*}"
          echo "RATEB_TEST_FFMPEG_NO_DRAWTEXT=$bin" >> "$GITHUB_ENV"

      - name: PHP syntax check
        run: |
          failures=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! output="$(php -l "$file" 2>&1)"; then
              echo "$output"
              failures=$((failures + 1))
            fi
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -not -path '*/node_modules/*' -print0)
          echo "Checked $count PHP files, $failures with syntax errors."
          test "$count" -gt 0
          test "$failures" -eq 0

      - name: Offline test suites
        env:
          RATEB_TEST_REQUIRE_FFMPEG: '1'
        run: |
          failed=()
          for suite in workflow-fixes credit-reservations endpoint-billing campaign-package video-engine video-worker strategy-output sawtak-catalog media-upload-kind; do
            echo "::group::tests/$suite.php"
            if php "tests/$suite.php"; then
              echo "OK tests/$suite.php"
            else
              echo "::error::tests/$suite.php exited with $?"
              failed+=("$suite")
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "Failed suites: ${failed[*]}"
            exit 1
          fi

      - name: Cron install, remove, and wait test
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          bash tests/cron-install.sh

      - name: Deploy guard, backup, and rollback test
        run: |
          set +e
          bash tests/deploy-guard.sh 2>&1 | tee "$RUNNER_TEMP/deploy-guard.log"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::Deploy guard test failed (exit $code)."
            exit 1
          fi
          grep -Eq '^SUMMARY pass=[1-9][0-9]* fail=0$' "$RUNNER_TEMP/deploy-guard.log"

      - name: Wait for MySQL
        env:
          SERVICE_CONTAINER: ${{ job.services.mysql.id }}
          SERVICE_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: |
          test -n "$SERVICE_CONTAINER"
          test -n "$SERVICE_PORT"
          echo "MYSQL_CONTAINER=$SERVICE_CONTAINER" >> "$GITHUB_ENV"
          echo "RATEB_TEST_DB_PORT=$SERVICE_PORT" >> "$GITHUB_ENV"
          MYSQL_CONTAINER="$SERVICE_CONTAINER"
          RATEB_TEST_DB_PORT="$SERVICE_PORT"
          for i in $(seq 1 60); do
            if docker exec -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" "$MYSQL_CONTAINER" mysql -uroot -N -e 'SELECT 1' > /dev/null 2>&1; then
              echo "MySQL is ready on host port $RATEB_TEST_DB_PORT"
              exit 0
            fi
            sleep 2
          done
          echo "::error::MySQL service did not become ready"
          exit 1

      - name: Create test database and test-only user
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "RATEB_TEST_DB_PASS=$password" >> "$GITHUB_ENV"
          docker exec -i -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" "$MYSQL_CONTAINER" mysql -uroot <<SQL
          CREATE DATABASE \`${RATEB_TEST_DB_NAME}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE DATABASE \`${RATEB_VIDEO_TEST_DB_NAME}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE DATABASE \`${RATEB_DEPLOY_TEST_DB_NAME}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER '${RATEB_TEST_DB_USER}'@'%' IDENTIFIED BY '${password}';
          GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, TRIGGER ON \`${RATEB_TEST_DB_NAME}\`.* TO '${RATEB_TEST_DB_USER}'@'%';
          GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX ON \`${RATEB_VIDEO_TEST_DB_NAME}\`.* TO '${RATEB_TEST_DB_USER}'@'%';
          GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX ON \`${RATEB_DEPLOY_TEST_DB_NAME}\`.* TO '${RATEB_TEST_DB_USER}'@'%';
          SET GLOBAL log_bin_trust_function_creators = 1;
          SQL
          docker exec -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" "$MYSQL_CONTAINER" mysql -uroot -N -e "SHOW GRANTS FOR '${RATEB_TEST_DB_USER}'@'%'"

      - name: MySQL credit reservation integration test
        run: |
          set +e
          php tests/integration/credit-reservations-mysql.php 2>&1 | tee "$RUNNER_TEMP/credit-mysql.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "Integration test exit code: $code"
          if [ "$code" -ne 0 ]; then
            [ "$code" -eq 2 ] && echo "::error::Integration test refused or incomplete (exit 2); a NOT RUN case is never a pass."
            [ "$code" -eq 1 ] && echo "::error::Integration test failed (exit 1)."
            exit 1
          fi
          grep -qx 'RESULT=PASS' "$RUNNER_TEMP/credit-mysql.log"
          grep -Eq '^SUMMARY pass=[1-9][0-9]* fail=0 not_run=0$' "$RUNNER_TEMP/credit-mysql.log"
          if grep -Eq '^(FAIL|NOT RUN) ' "$RUNNER_TEMP/credit-mysql.log"; then
            echo "::error::A case failed or did not run."
            exit 1
          fi

      - name: MySQL video worker integration test
        if: always()
        env:
          RATEB_TEST_DB_NAME: ${{ env.RATEB_VIDEO_TEST_DB_NAME }}
          RATEB_TEST_DB_CONFIRM: ${{ env.RATEB_VIDEO_TEST_DB_NAME }}
        run: |
          test -n "${RATEB_TEST_DB_PASS:-}"
          set +e
          php tests/integration/video-worker-mysql.php 2>&1 | tee "$RUNNER_TEMP/video-mysql.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "Video worker integration test exit code: $code"
          if [ "$code" -ne 0 ]; then
            [ "$code" -eq 2 ] && echo "::error::Video worker test refused or incomplete (exit 2); a NOT RUN case is never a pass."
            [ "$code" -eq 1 ] && echo "::error::Video worker test failed (exit 1)."
            exit 1
          fi
          grep -qx 'RESULT=PASS' "$RUNNER_TEMP/video-mysql.log"
          grep -Eq '^SUMMARY pass=[1-9][0-9]* fail=0 not_run=0$' "$RUNNER_TEMP/video-mysql.log"
          grep -qx 'FFMPEG yes GD yes' "$RUNNER_TEMP/video-mysql.log"

      - name: Deploy and worker-off simulation
        if: always()
        run: |
          test -n "${RATEB_TEST_DB_PASS:-}"
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          # The application's media root is fixed at /home/admin/.campaign-media; this runner is disposable.
          sudo mkdir -p /home/admin/.campaign-media
          sudo chown "$(id -u):$(id -g)" /home/admin/.campaign-media
          set +e
          bash tests/deploy-sim.sh 2>&1 | tee "$RUNNER_TEMP/deploy-sim.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "Deploy simulation exit code: $code"
          if [ "$code" -ne 0 ]; then
            [ "$code" -eq 2 ] && echo "::error::Deploy simulation refused (exit 2); nothing was proven."
            [ "$code" -eq 1 ] && echo "::error::Deploy simulation failed (exit 1)."
            exit 1
          fi
          grep -qx 'RESULT=PASS' "$RUNNER_TEMP/deploy-sim.log"
          grep -Eq '^SUMMARY pass=[1-9][0-9]* fail=0$' "$RUNNER_TEMP/deploy-sim.log"

      - name: Remove test database and user
        if: always()
        run: |
          if [ -n "${RATEB_TEST_DB_PASS:-}" ]; then
            php tests/integration/credit-reservations-mysql.php --cleanup || true
            RATEB_TEST_DB_NAME="$RATEB_VIDEO_TEST_DB_NAME" RATEB_TEST_DB_CONFIRM="$RATEB_VIDEO_TEST_DB_NAME" php tests/integration/video-worker-mysql.php --cleanup || true
          fi
          if [ -n "${MYSQL_CONTAINER:-}" ]; then
            docker exec -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" "$MYSQL_CONTAINER" mysql -uroot -e "DROP DATABASE IF EXISTS \`${RATEB_TEST_DB_NAME}\`; DROP DATABASE IF EXISTS \`${RATEB_VIDEO_TEST_DB_NAME}\`; DROP DATABASE IF EXISTS \`${RATEB_DEPLOY_TEST_DB_NAME}\`; DROP USER IF EXISTS '${RATEB_TEST_DB_USER}'@'%';" || true
          fi
