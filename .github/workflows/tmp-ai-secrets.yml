name: Temporary database secret move

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: rateb.sa
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Move database password to the environment
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/rateb-readonly-key"
          export KEY_PATH
          python3 - << 'PY'
          import os, stat
          key = (os.environ.get("DEPLOY_SSH_PRIVATE_KEY") or "").strip()
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")
          path = os.environ["KEY_PATH"]
          with open(path, "w", encoding="utf-8", newline="\n") as handle:
              handle.write(key)
              if not key.endswith("\n"):
                  handle.write("\n")
          os.chmod(path, stat.S_IRUSR | stat.S_IWUSR)
          PY
          PORT="${DEPLOY_SSH_PORT:-22}"
          REMOTE="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          SSH=(ssh -i "${KEY_PATH}" -p "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          SCP=(scp -i "${KEY_PATH}" -P "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          ROOT=/home/admin/domains/ai.rateb.sa
          BASE=https://ai.rateb.sa
          WORK="${RUNNER_TEMP}/secrets"
          mkdir -p "$WORK"
          cat > "$WORK/migrate.php" << 'PHP'
          <?php
          $doc = '/home/admin/domains/ai.rateb.sa';
          $dbFile = $doc . '/config/database.php';
          $secretDir = '/home/admin/.secrets';
          $passFile = $secretDir . '/rateb_ai_db_password';
          $ini = $doc . '/.user.ini';
          if (!is_file($ini)) {
              fwrite(STDERR, "INI_MISSING\n");
              exit(1);
          }
          $iniText = (string) file_get_contents($ini);
          if (preg_match('/auto_prepend_file\s*=\s*(\S+)/', $iniText, $match) !== 1) {
              fwrite(STDERR, "PREPEND_MISSING\n");
              exit(1);
          }
          $prepend = trim($match[1], "\"'");
          if (!is_file($prepend)) {
              fwrite(STDERR, "PREPEND_FILE_MISSING\n");
              exit(1);
          }
          if (!is_dir($secretDir) && !mkdir($secretDir, 0700, true) && !is_dir($secretDir)) {
              fwrite(STDERR, "SECRET_DIR\n");
              exit(1);
          }
          if (!is_file($passFile)) {
              $cfg = require $dbFile;
              $password = is_array($cfg) ? (string) ($cfg['password'] ?? '') : '';
              if ($password === '') {
                  fwrite(STDERR, "PASSWORD_EMPTY\n");
                  exit(1);
              }
              if (file_put_contents($passFile, $password) === false) {
                  fwrite(STDERR, "PASSWORD_WRITE\n");
                  exit(1);
              }
              chmod($passFile, 0600);
          }
          $env = (string) file_get_contents($prepend);
          if (!str_contains($env, 'RATEB_AI_DB_PASSWORD')) {
              $block = "\n\$ratebDbPassFile = '/home/admin/.secrets/rateb_ai_db_password';\n"
                  . "if (is_readable(\$ratebDbPassFile)) {\n"
                  . "    \$ratebDbPass = trim((string) file_get_contents(\$ratebDbPassFile));\n"
                  . "    if (\$ratebDbPass !== '') {\n"
                  . "        putenv('RATEB_AI_DB_PASSWORD=' . \$ratebDbPass);\n"
                  . "        \$_ENV['RATEB_AI_DB_PASSWORD'] = \$ratebDbPass;\n"
                  . "        \$_SERVER['RATEB_AI_DB_PASSWORD'] = \$ratebDbPass;\n"
                  . "    }\n"
                  . "}\n";
              if (file_put_contents($prepend, rtrim($env) . "\n" . $block) === false) {
                  fwrite(STDERR, "PREPEND_WRITE\n");
                  exit(1);
              }
              chmod($prepend, 0600);
          }
          echo "MIGRATE=ok\n";
          PHP
          "${SSH[@]}" "${REMOTE}" "mkdir -p /home/admin/.secrets && chmod 700 /home/admin/.secrets"
          "${SCP[@]}" "$WORK/migrate.php" "${REMOTE}:/home/admin/.secrets/migrate-db-env.php"
          "${SSH[@]}" "${REMOTE}" "php /home/admin/.secrets/migrate-db-env.php && rm -f /home/admin/.secrets/migrate-db-env.php"
          "${SCP[@]}" ai-rateb-sa-source/config/database.php "${REMOTE}:${ROOT}/config/database.php"
          "${SSH[@]}" "${REMOTE}" "rm -f ${ROOT}/db-test.php ${ROOT}/test.html && php -l ${ROOT}/config/database.php"
          cat > "$WORK/refresh.php" << 'PHP'
          <?php
          $doc = '/home/admin/domains/ai.rateb.sa';
          $ini = (string) file_get_contents($doc . '/.user.ini');
          $files = [$doc . '/config/database.php', $doc . '/config/bootstrap.php', $doc . '/app/bootstrap.php'];
          if (preg_match('/auto_prepend_file\s*=\s*(\S+)/', $ini, $match) === 1) {
              $files[] = trim($match[1], "\"'");
          }
          foreach ($files as $file) {
              $ok = function_exists('opcache_invalidate') && opcache_invalidate($file, true);
              echo basename($file) . '=' . ($ok ? 'yes' : 'no') . PHP_EOL;
          }
          PHP
          cat > "$WORK/db-check.php" << 'PHP'
          <?php
          try {
              require '/home/admin/domains/ai.rateb.sa/config/bootstrap.php';
              $pdo->query('SELECT 1');
              echo 'DB=ok';
          } catch (Throwable $error) {
              echo 'DB=fail';
          }
          PHP
          "${SCP[@]}" "$WORK/refresh.php" "${REMOTE}:${ROOT}/secret-refresh.php"
          "${SCP[@]}" "$WORK/db-check.php" "${REMOTE}:${ROOT}/secret-db-check.php"
          curl -sS "$BASE/secret-refresh.php" || true
          echo
          db=$(curl -sS "$BASE/secret-db-check.php" || true)
          echo "$db"
          "${SSH[@]}" "${REMOTE}" "rm -f ${ROOT}/secret-refresh.php ${ROOT}/secret-db-check.php"
          test "$db" = "DB=ok"
          home=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/")
          login=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/login.php")
          register=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/register.php")
          dash=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/dashboard.php")
          dbtest=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/db-test.php")
          testhtml=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/test.html")
          echo "HOME=${home}"
          echo "LOGIN=${login}"
          echo "REGISTER=${register}"
          echo "DASH=${dash}"
          echo "DBTEST=${dbtest}"
          echo "TESTHTML=${testhtml}"
          test "$home" = "200"
          test "$login" = "200"
          test "$register" = "200"
          test "$dash" = "302"
          test "$dbtest" = "404"
          test "$testhtml" = "404"
          echo "SECRETS=pass"
          rm -f "${KEY_PATH}"
