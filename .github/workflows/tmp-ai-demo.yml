name: Temporary demo media check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: rateb.sa
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy playable examples
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/rateb-readonly-key"
          export KEY_PATH
          python3 - << 'PY'
          import os, stat
          key = (os.environ.get("DEPLOY_SSH_PRIVATE_KEY") or "").strip()
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")
          path = os.environ["KEY_PATH"]
          with open(path, "w", encoding="utf-8", newline="\n") as handle:
              handle.write(key)
              if not key.endswith("\n"):
                  handle.write("\n")
          os.chmod(path, stat.S_IRUSR | stat.S_IWUSR)
          PY
          PORT="${DEPLOY_SSH_PORT:-22}"
          REMOTE="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          SSH=(ssh -i "${KEY_PATH}" -p "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          SCP=(scp -i "${KEY_PATH}" -P "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          ROOT=/home/admin/domains/ai.rateb.sa
          BASE=https://ai.rateb.sa
          "${SSH[@]}" "${REMOTE}" "mkdir -p ${ROOT}/public/assets/demo"
          "${SCP[@]}" ai-rateb-sa-source/index.php "${REMOTE}:${ROOT}/index.php"
          "${SCP[@]}" ai-rateb-sa-source/public/assets/css/app.css "${REMOTE}:${ROOT}/public/assets/css/app.css"
          "${SCP[@]}" ai-rateb-sa-source/public/assets/js/app.js "${REMOTE}:${ROOT}/public/assets/js/app.js"
          "${SCP[@]}" ai-rateb-sa-source/public/assets/demo/product.svg ai-rateb-sa-source/public/assets/demo/social.svg ai-rateb-sa-source/public/assets/demo/story.svg ai-rateb-sa-source/public/assets/demo/poster.svg ai-rateb-sa-source/public/assets/demo/strategy.svg ai-rateb-sa-source/public/assets/demo/planner.svg ai-rateb-sa-source/public/assets/demo/whatsapp.svg ai-rateb-sa-source/public/assets/demo/demo-video.mp4 ai-rateb-sa-source/public/assets/demo/demo-voice.mp3 "${REMOTE}:${ROOT}/public/assets/demo/"
          "${SSH[@]}" "${REMOTE}" "php -l ${ROOT}/index.php"
          WORK="${RUNNER_TEMP}/demo"
          mkdir -p "$WORK"
          printf '%s\n' '<?php echo (function_exists("opcache_invalidate") && opcache_invalidate("/home/admin/domains/ai.rateb.sa/index.php", true) ? "yes" : "no");' > "$WORK/refresh.php"
          "${SCP[@]}" "$WORK/refresh.php" "${REMOTE}:${ROOT}/demo-refresh.php"
          curl -sS "$BASE/demo-refresh.php" || true
          echo
          "${SSH[@]}" "${REMOTE}" "rm -f ${ROOT}/demo-refresh.php"
          code=$(curl -sS -o "$WORK/home.html" -w '%{http_code}' "$BASE/")
          echo "HOME_HTTP=${code}"
          test "$code" = "200"
          grep -q 'demo-viewer' "$WORK/home.html"
          grep -q 'demo-voice.mp3' "$WORK/home.html"
          grep -q 'demo-video.mp4' "$WORK/home.html"
          grep -q 'id="theme"' "$WORK/home.html"
          grep -q 'href="/login.php"' "$WORK/home.html"
          grep -q 'href="/register.php"' "$WORK/home.html"
          echo "HOME_DEMO=yes"
          for asset in product.svg social.svg story.svg poster.svg strategy.svg planner.svg whatsapp.svg demo-video.mp4 demo-voice.mp3; do
            asset_code=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/public/assets/demo/${asset}")
            echo "ASSET_${asset}=${asset_code}"
            test "$asset_code" = "200"
          done
          curl -sS -o "$WORK/app.js" "$BASE/public/assets/js/app.js"
          grep -q 'demo-viewer' "$WORK/app.js"
          grep -q 'rateb-theme' "$WORK/app.js"
          curl -sS -o "$WORK/app.css" "$BASE/public/assets/css/app.css"
          grep -q 'scroll-behavior:smooth' "$WORK/app.css"
          grep -q 'demo-viewer' "$WORK/app.css"
          echo "DEMO=pass"
          rm -f "${KEY_PATH}"
