name: Temporary read-only AI key setup inspect

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: rateb.sa
    timeout-minutes: 12
    steps:
      - name: Inspect server PHP environment
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST || secrets.SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER || secrets.SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/rateb-readonly-key"
          export KEY_PATH
          python3 - << 'PY'
          import os, stat
          key = (os.environ.get("DEPLOY_SSH_PRIVATE_KEY") or "").strip()
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")
          path = os.environ["KEY_PATH"]
          with open(path, "w", encoding="utf-8", newline="\n") as handle:
              handle.write(key)
              if not key.endswith("\n"):
                  handle.write("\n")
          os.chmod(path, stat.S_IRUSR | stat.S_IWUSR)
          PY
          PORT="${DEPLOY_SSH_PORT:-22}"
          ssh -i "${KEY_PATH}" -p "${PORT}" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}" bash -s > ai-key-inspect.txt << 'BASH'
          set +e
          echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          php -r '$v=getenv("RATEB_AI_API_KEY"); echo ($v===false||$v==="")?"CLI_KEY=NOT_SET\n":"CLI_KEY=SET\n"; echo "CLI_SAPI=".PHP_SAPI."\n";'
          if [ -r /usr/local/directadmin/custombuild/options.conf ]; then
            grep -E '^(php1_release|php1_mode|php2_release|php2_mode)=' /usr/local/directadmin/custombuild/options.conf
          else
            echo "CUSTOMBUILD_OPTIONS=unreadable"
          fi
          echo "HTACCESS=$([ -f /home/admin/domains/ai.rateb.sa/.htaccess ] && echo present || echo absent)"
          echo "USER_INI=$([ -f /home/admin/domains/ai.rateb.sa/.user.ini ] && echo present || echo absent)"
          echo "DOMAIN_PHP_INI=$([ -f /home/admin/domains/ai.rateb.sa/php.ini ] && echo present || echo absent)"
          echo "NAME_HITS_START"
          grep -R -l 'RATEB_AI_API_KEY' /home/admin/domains/ai.rateb.sa /home/admin /usr/local/directadmin/data/users/admin 2>/dev/null | head -30
          echo "NAME_HITS_END"
          echo "RECENT_SECRET_NAMES_START"
          find /home/admin -maxdepth 3 -type f \( -iname '*.env' -o -iname '*api*key*' -o -iname '*openai*' -o -iname '.user.ini' -o -iname '.htaccess' \) -printf '%p\n' 2>/dev/null | head -40
          echo "RECENT_SECRET_NAMES_END"
          python3 - << 'PY'
          import pathlib
          roots = [
              pathlib.Path("/home/admin/domains/ai.rateb.sa/.htaccess"),
              pathlib.Path("/home/admin/domains/ai.rateb.sa/.user.ini"),
              pathlib.Path("/usr/local/directadmin/data/users/admin/httpd.conf"),
          ]
          for path in roots:
              if not path.is_file():
                  print(f"FILE {path}=absent")
                  continue
              text = path.read_text(errors="replace")
              if "RATEB_AI_API_KEY" not in text:
                  print(f"FILE {path}=no_var")
                  continue
              nonempty = False
              for line in text.splitlines():
                  if "RATEB_AI_API_KEY" in line and not line.strip().startswith("#"):
                      value = line.split("RATEB_AI_API_KEY", 1)[1]
                      value = value.replace("=", " ", 1).strip().strip("\"'")
                      nonempty = nonempty or bool(value)
              print(f"FILE {path}={'SET' if nonempty else 'EMPTY'}")
          PY
          echo "VHOST_START"
          awk '
            /<VirtualHost/ {block=""; capture=0}
            {block = block $0 "\n"}
            /ServerName ai\.rateb\.sa/ {capture=1}
            /<\/VirtualHost>/ {
              if (capture) {
                gsub(/SSLCertificateKeyFile[^\n]*/, "SSLCertificateKeyFile redacted")
                n = split(block, lines, "\n")
                for (i = 1; i <= n; i++) {
                  line = lines[i]
                  if (line ~ /SetEnv|PassEnv|php_value|php_admin|AddHandler|AddType|Suexec|AllowOverride|Include|CUSTOM|ServerName|DocumentRoot|SSLEngine|SSLCertificateFile|<VirtualHost|<\/VirtualHost>|php-fpm|proxy:|lsapi|suphp/) print line
                }
                print "----"
              }
              block = ""; capture = 0
            }
          ' /usr/local/directadmin/data/users/admin/httpd.conf
          echo "VHOST_END"
          TOKEN=$(openssl rand -hex 16)
          PROBE="/home/admin/domains/ai.rateb.sa/.rateb-key-probe-${TOKEN}.php"
          cat > "$PROBE" << EOF
          <?php
          if ((\$_GET['t'] ?? '') !== '${TOKEN}') { http_response_code(404); exit; }
          header('Content-Type: text/plain; charset=UTF-8');
          header('Cache-Control: no-store');
          \$v = getenv('RATEB_AI_API_KEY');
          if (\$v === false || \$v === '') { \$v = \$_SERVER['RATEB_AI_API_KEY'] ?? ''; }
          echo (\$v === '' ? 'WEB_KEY=NOT_SET' : 'WEB_KEY=SET'), "\n";
          echo 'WEB_SAPI=', PHP_SAPI, "\n";
          echo 'WEB_ALLOW=', ini_get('user_ini.filename'), "\n";
          EOF
          CODE=$(curl -sk -o /tmp/rateb-key-probe.out -w '%{http_code}' -H 'Cache-Control: no-cache' "https://ai.rateb.sa/.rateb-key-probe-${TOKEN}.php?t=${TOKEN}")
          echo "PROBE_HTTP=$CODE"
          grep -E '^(WEB_KEY=|WEB_SAPI=|WEB_ALLOW=)' /tmp/rateb-key-probe.out || true
          rm -f "$PROBE" /tmp/rateb-key-probe.out
          if [ -f "$PROBE" ]; then echo "PROBE_FILE=still_present"; else echo "PROBE_FILE=removed"; fi
          BASH
          rm -f "${KEY_PATH}"

      - name: Upload inspect report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-key-inspect
          path: ai-key-inspect.txt
          retention-days: 1
          if-no-files-found: warn
